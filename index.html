        const a = this.world.interior ? this.world.zones[0].name : this.world.zoneAt(this.player.x, this.player.y);
        if (a && a !== this.currentArea) { this.currentArea = a; UI.area(a); }
        // festival
        if (this.festivalUntil > this.time && this.world.id === 'desa') {
          this.fwT -= dt;
          if (this.fwT <= 0) {
            this.fwT = U.rand(0.25, 0.6);
            const fx = U.rand(this.cam.x + 30, this.cam.x + this.cam.w - 30), fy = U.rand(this.cam.y + 20, this.cam.y + this.cam.h * 0.45);
            PV.FX.firework(fx, fy);
            if (Math.random() < 0.6) PV.Audio.sfx('firework');
          }
        } else if (this.festivalUntil && this.festivalUntil <= this.time) {
          this.festivalUntil = 0;
          if (this.world.id === 'desa') PV.Audio.playMusic('desa');
        }
      } else {
        // pratinjau layar judul: kamera berkeliling pelan
        const t = this.time * 0.05;
        this.cam.x = 40 * 16 + Math.sin(t) * 260; this.cam.y = 28 * 16 + Math.cos(t * 0.8) * 140;
        this.clampCam();
      }
      for (const o of this.world.objects) if (o !== this.player && o.update) o.update(dt);
      PV.FX.update(dt);
      if (this.started) {
        const c = this.cam;
        const tx = this.player.x - c.w / 2, ty = this.player.y - 16 - c.h / 2;
        const k = 1 - Math.exp(-dt * 7);
        c.x += (tx - c.x) * k; c.y += (ty - c.y) * k;
        this.clampCam();
      }
      this.shake = Math.max(0, this.shake - dt * 8);
    },
    modalBookKeys() {
      const UI = PV.UI;
      if (UI.modalOpen && UI.modalKind === 'book' && UI.bookKeys) {
        const In = PV.Input;
        for (const k of ['ArrowRight', 'KeyD', 'Space', 'KeyE', 'Enter', 'ArrowLeft', 'KeyA']) if (In.wasPressed(k)) { UI.bookKeys(k); return true; }
      }
      return false;
    },
    updateInteract(dt) {
      this.interactLock = Math.max(0, this.interactLock - dt);
      const pt = this.player.interactPoint();
      let best = null, bd = 1e9;
      for (const it of this.world.interactables) {
        if (it.enabled && !it.enabled()) continue;
        const d = Math.hypot(pt.x - it.x, (pt.y - it.y) * 1.2);
        if (d < it.r && d < bd) { bd = d; best = it; }
      }
      // memancing: menghadap air
      if (!best && this.world.id === 'desa') {
        const d = { down: [0, 1], up: [0, -1], left: [-1, 0], right: [1, 0] }[this.player.dir];
        for (let s = 1; s <= 2; s++) {
          const tx = Math.floor((this.player.x + d[0] * 12 * s) / 16), ty = Math.floor((this.player.y - 3 + d[1] * 12 * s) / 16);
          if (this.world.get(tx, ty) === T.WATER) {
            const ok = PV.Mini.fish.canFish();
            best = this._fishIt || (this._fishIt = { x: 0, y: 0, r: 0, h: 18 });
            Object.assign(best, { x: tx * 16 + 8, y: ty * 16 + 12, label: ok ? 'Memancing' : 'Butuh joran (temui Pak Bayu)', action: () => { if (PV.Mini.fish.canFish()) PV.Mini.fish.start(tx, ty); else { PV.UI.toast('Kamu belum punya joran. Temui Pak Bayu di dermaga!'); PV.Audio.sfx('error'); } } });
            break;
          }
        }
      }
      this.focus = best;
      if (best && this.interactLock <= 0 && PV.Input.action()) {
        PV.Input.consume('KeyE', 'Space', 'Enter', 'NumpadEnter');
        this.player.moving = false;
        best.action();
      }
    },

    // ---------- render ----------
    render() {
      const ctx = this.ctx, c = this.cam, w = this.world;
      ctx.fillStyle = w.bg; ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
      ctx.save();
      const sx = this.shake > 0 ? Math.round(U.rand(-1, 1) * this.shake) : 0, sy = this.shake > 0 ? Math.round(U.rand(-1, 1) * this.shake) : 0;
      ctx.translate(-Math.round(c.x) + sx, -Math.round(c.y) + sy);
      w.drawGround(ctx, c, this.time);
      const vis = [];
      const x0 = c.x - 120, x1 = c.x + c.w + 120, y0 = c.y - 40, y1 = c.y + c.h + 160;
      for (const o of w.objects) if (o.x > x0 && o.x < x1 && o.y > y0 && o.y < y1) vis.push(o);
      vis.sort((a, b) => a.sortY - b.sortY);
      for (const o of vis) o.draw(ctx, this.time);
      PV.Act.drawLanterns(ctx, this.time);
      PV.Mini.fish.drawWorld(ctx, this.time);
      PV.FX.draw(ctx);
      ctx.restore();
      // suasana: festival malam & interior hangat
      if (this.festivalUntil > this.time && w.id === 'desa') {
        const k = U.clamp(Math.min(this.time - this.festivalStart, this.festivalUntil - this.time) / 1.5, 0, 1); // transisi senja <-> malam
        ctx.fillStyle = `rgba(14,8,44,${0.6 * k})`; ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
        ctx.save(); ctx.translate(-Math.round(c.x), -Math.round(c.y));
        ctx.globalAlpha = k; PV.Act.drawFestivalGlow(ctx, this.time, vis); ctx.globalAlpha = 1;
        PV.Act.drawLanterns(ctx, this.time); PV.FX.draw(ctx); ctx.restore();
      }
      if (w.interior) {
        const g = ctx.createRadialGradient(this.canvas.width / 2, this.canvas.height / 2, this.canvas.height * 0.3, this.canvas.width / 2, this.canvas.height / 2, this.canvas.width * 0.7);
        g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(10,4,12,0.45)');
        ctx.fillStyle = g; ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
      }
      if (this.started && this.focus && !PV.UI.busy() && !this.activeMini && !this.fading) {
        ctx.save(); ctx.translate(-Math.round(c.x) + sx, -Math.round(c.y) + sy); this.drawPrompt(ctx, this.focus); ctx.restore();
      }
      if (this.fading) {
        const t = this.fading.t;
        ctx.fillStyle = `rgba(10,5,15,${t < 0.25 ? t / 0.25 : 1 - (t - 0.25) / 0.25})`;
        ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
      }
    },
    drawPrompt(ctx, it) {
      const label = typeof it.label === 'function' ? it.label() : it.label;
      const tx = PV.Paint.textSprite(label, '#fff6d8');
      const w = 11 + 3 + tx.width;
      const bob = Math.round(Math.sin(this.time * 5) * 1);
      const x = Math.round(it.x - w / 2), y = Math.round(it.y - (it.h || 24) - 12 + bob);
      ctx.fillStyle = 'rgba(28,10,24,0.78)';
      ctx.fillRect(x - 2, y - 1, w + 4, 13);
      ctx.fillRect(x - 1, y - 2, w + 2, 15);
      G.draw(ctx, 'key_e', x + 5, y + 11);
      ctx.drawImage(tx, x + 14, y + 2);
    },
  };

  function setLoading(p, msg) {
    const b = document.querySelector('#loading .bar i'); if (b) b.style.width = Math.round(p * 100) + '%';
    const m = document.querySelector('#loading .msg'); if (m) m.textContent = msg;
  }
  const tick = () => new Promise((r) => setTimeout(r, 0));

  PV.Game = Game;
  window.addEventListener('load', () => {
    Game.boot().catch((e) => {
      console.error(e);
      const m = document.querySelector('#loading .msg');
      if (m) m.textContent = 'Gagal memuat game: ' + e.message;
    });
  });
})(window.PV);

</script>
