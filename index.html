<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Lembah Piksel — Petualangan Pixel Art</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game"></canvas>

<!-- ===== HUD ===== -->
<div id="hud" class="hidden">
  <div class="hud-left">
    <div class="pills">
      <div class="pill coins"><img data-icon="koin" alt=""><span id="coinTxt">0</span></div>
      <div class="pill day"><span id="dayTxt">Hari 1</span></div>
    </div>
    <div id="questCard" class="quest-card"><div class="qh"><img data-icon="gulungan" alt=""> MISI</div><div class="qt"></div><div class="qo"></div><div class="qw"></div></div>
  </div>
  <div class="hud-right">
    <button class="hbtn" data-act="bag" title="Tas [I]"><img data-icon="tas" alt=""><kbd>I</kbd></button>
    <button class="hbtn" data-act="quest" title="Jurnal [Q]"><img data-icon="gulungan" alt=""><kbd>Q</kbd></button>
    <button class="hbtn" data-act="map" title="Peta [M]"><img data-icon="peta" alt=""><kbd>M</kbd></button>
    <button class="hbtn" data-act="sound" title="Suara [N]"><span class="sym">♪</span><kbd>N</kbd></button>
    <button class="hbtn" data-act="help" title="Bantuan [H]"><span class="sym">?</span><kbd>H</kbd></button>
  </div>
</div>
<div id="areaBanner"></div>
<div id="toasts"></div>
<div id="banner"></div>
<div id="fishbar" class="hidden"></div>

<!-- ===== DIALOG ===== -->
<div id="dialog" class="hidden">
  <canvas class="portrait" width="20" height="20"></canvas>
  <div class="dbody">
    <div class="dname"></div>
    <div class="dtext"></div>
    <div class="dchoices"></div>
  </div>
  <div class="dnext">▼</div>
</div>

<!-- ===== MODAL ===== -->
<div id="modal" class="hidden">
  <div class="panel">
    <div class="ptitle"></div>
    <button class="close" title="Tutup [Esc]">✕</button>
    <div class="pbody"></div>
  </div>
</div>

<!-- ===== LAYAR JUDUL ===== -->
<div id="title">
  <div class="tbox">
    <canvas id="logo"></canvas>
    <div class="tagline">Petualangan santai di lembah pixel — bertani, memancing, meracik kopi, memecahkan teka-teki, dan hidupkan kembali Festival Lentera!</div>
    <div class="tbtns">
      <button class="btn green big" id="btnContinue">▶ Lanjutkan</button>
      <button class="btn big" id="btnNew">✦ Mulai Baru</button>
    </div>
    <div class="tkeys"><span><kbd>WASD</kbd> gerak</span><span><kbd>E</kbd> interaksi</span><span><kbd>I</kbd> tas</span><span><kbd>Q</kbd> misi</span><span><kbd>M</kbd> peta</span></div>
    <div class="tcredit">Aset: Farm RPG FREE 16x16 Tiny Asset Pack + pixel art, musik &amp; SFX prosedural</div>
  </div>
</div>
<div id="loading"><div class="lbox"><div class="msg">Memuat...</div><div class="bar"><i></i></div></div></div>

<!-- ===== KONTROL SENTUH ===== -->
<div id="touch">
  <div id="stick"><div id="knob"></div></div>
  <div class="tbtn-wrap">
    <button class="tbtn big" data-key="KeyE">E</button>
    <button class="tbtn" data-key="KeyI">Tas</button>
    <button class="tbtn" data-key="KeyQ">Misi</button>
    <button class="tbtn" data-key="Escape">✕</button>
  </div>
</div>

<!-- urutan skrip: inti -> grafis -> dunia -> data -> UI -> mini-game -> main -->
<script src="js/core/util.js"></script>
<script src="js/core/input.js"></script>
<script src="js/core/audio.js"></script>
<script src="js/gfx/asset-data.js"></script>
<script src="js/gfx/paint.js"></script>
<script src="js/gfx/assets.js"></script>
<script src="js/gfx/gen-tiles.js"></script>
<script src="js/gfx/gen-icons.js"></script>
<script src="js/gfx/gen-props.js"></script>
<script src="js/world/world.js"></script>
<script src="js/world/entities.js"></script>
<script src="js/game/data.js"></script>
<script src="js/game/state.js"></script>
<script src="js/game/activities.js"></script>
<script src="js/world/maps.js"></script>
<script src="js/ui/ui.js"></script>
<script src="js/minigames/cafe.js"></script>
<script src="js/minigames/fishing.js"></script>
<script src="js/minigames/library.js"></script>
<script src="js/minigames/shop.js"></script>
<script src="js/minigames/workshop.js"></script>
<script src="js/main.js"></script>
</body>
</html>
