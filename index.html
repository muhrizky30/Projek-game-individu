      p.outline(O);
      G.defCanvas('lamp', p.c, 6, 37);
    }
    // ---------- bangku taman ----------
    {
      const p = P(30, 18);
      p.rect(3, 11, 2, 6, '#3a3a48'); p.rect(25, 11, 2, 6, '#3a3a48');
      p.rect(1, 2, 28, 3, PAL.woodL); p.hline(1, 2, 28, '#d8864a');
      p.rect(1, 6, 28, 2, PAL.wood);
      p.rect(0, 9, 30, 3, PAL.woodL); p.hline(0, 9, 30, '#d8864a'); p.hline(0, 11, 30, PAL.woodD2);
      p.vline(3, 2, 9, '#3a3a48'); p.vline(26, 2, 9, '#3a3a48');
      p.outline(O);
      G.defCanvas('bench', p.c, 15, 16);
    }
    // ---------- papan pengumuman ----------
    {
      const p = P(32, 32);
      p.rect(3, 6, 3, 25, PAL.woodD2); p.rect(26, 6, 3, 25, PAL.woodD2);
      p.rect(1, 2, 30, 3, PAL.wood); p.hline(1, 2, 30, PAL.woodLL);
      p.rect(2, 6, 28, 18, '#b07a46'); p.frame(2, 6, 28, 18, PAL.woodD);
      p.speckle(3, 7, 26, 16, ['#9a6a3a'], 0.12, 5);
      p.rect(5, 8, 8, 9, '#f7f0dc'); p.rect(15, 9, 7, 7, '#fff2a0'); p.rect(23, 8, 5, 10, '#d8f0ff'); p.rect(7, 18, 10, 4, '#ffd8e0');
      [[6, 10], [6, 12], [6, 14], [16, 11], [16, 13], [24, 10], [24, 12], [24, 14]].forEach(([x, y]) => p.hline(x, y, x > 20 ? 3 : 5, '#8a7a6a'));
      [[9, 8], [18, 9], [25, 8], [12, 18]].forEach(([x, y]) => p.px(x, y, '#e8412e'));

    // ---------- semak ----------
    const bush = (name, dots) => {
      const p = P(18, 15);

<script>/* js/world/world.js */
/* Lembah Piksel — kelas World: data tile, render chunk, air animasi, kolisi, interaksi */
(function (PV) {
  'use strict';
  const U = PV.U, G = PV.G, PAL = PV.PAL;
  const TS = 16, CH = 32; // ukuran tile & ukuran chunk (tile)

  const T = { GRASS: 0, DIRT: 1, WATER: 2, SAND: 3, PLAZA: 4, SOIL: 5, PLANK: 6, PLANKV: 7, FLOOR: 8, WALL: 9, WALLTOP: 10, VOID: 11, STONE: 12, CARPET: 13 };
  const BLOCKING = new Set([T.WATER, T.WALL, T.WALLTOP, T.VOID]);
  PV.T = T;

  class World {
    constructor(id, w, h, opts = {}) {
      this.id = id; this.w = w; this.h = h;
      this.name = opts.name || id;
      this.bg = opts.bg || '#1a1220';
      this.music = opts.music || 'desa';
      this.interior = !!opts.interior;
      this.wallKey = opts.wallKey || 't_wall_home';
      this.tiles = new Uint8Array(w * h);
      this.solid = new Uint8Array(w * h);     // blok tambahan (tile penuh)
      this.occ = new Uint8Array(w * h);       // penanda terisi saat menata dekorasi
      this.objects = [];                       // entitas yang di-sort berdasarkan y
      this.decals = [];                        // hiasan datar di tanah (bunga, rumput)
      this.interactables = [];
      this.triggers = [];                      // zona yang aktif saat diinjak
      this.zones = [];                         // nama area untuk banner lokasi
      this.colliders = [];
      this.colGrid = new Map();
      this.chunks = new Map();
      this.dirtyChunks = new Set();
      this.waterUnder = null;
    }
    idx(x, y) { return y * this.w + x; }
    inb(x, y) { return x >= 0 && y >= 0 && x < this.w && y < this.h; }
    get(x, y) { return this.inb(x, y) ? this.tiles[y * this.w + x] : (this.interior ? T.VOID : T.GRASS); }
    set(x, y, t) {
      if (!this.inb(x, y)) return;
      this.tiles[y * this.w + x] = t;
      if (this.chunks.size) for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++)
        this.dirtyChunks.add(Math.floor((x + dx) / CH) + ',' + Math.floor((y + dy) / CH));
    }
    fill(x0, y0, x1, y1, t) { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) this.set(x, y, t); }
    fillEllipse(cx, cy, rx, ry, t, jitter = 0, seed = 1) {
      for (let y = Math.floor(cy - ry - 2); y <= cy + ry + 2; y++) for (let x = Math.floor(cx - rx - 2); x <= cx + rx + 2; x++) {
        const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry;
        const n = jitter ? (U.hash2(x, y, seed) - 0.5) * jitter : 0;
        if (dx * dx + dy * dy <= 1 + n) this.set(x, y, t);
      }
    }
    path(points, width, t) {
      const r = (width - 1) / 2;
      for (let i = 0; i < points.length - 1; i++) {
        const [x0, y0] = points[i], [x1, y1] = points[i + 1];
        const steps = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) * 2;
        for (let s = 0; s <= steps; s++) {
          const x = x0 + ((x1 - x0) * s) / steps, y = y0 + ((y1 - y0) * s) / steps;
          for (let yy = Math.round(y - r); yy <= Math.round(y + r); yy++)
            for (let xx = Math.round(x - r); xx <= Math.round(x + r); xx++) if (this.get(xx, yy) === T.GRASS) this.set(xx, yy, t);
        }
      }
    }
    isFree(x0, y0, x1, y1) {
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
        if (!this.inb(x, y) || this.occ[this.idx(x, y)] || this.get(x, y) !== T.GRASS) return false;
      }
      return true;
    }
    mark(x0, y0, x1, y1) { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (this.inb(x, y)) this.occ[this.idx(x, y)] = 1; }

    // ---------- entitas & kolisi ----------
    add(e) {
      e.world = this; this.objects.push(e);
      const sb = e.solidBox && e.solidBox();
      if (sb) this.addCollider(sb, e);
      return e;
    }
    remove(e) {
      const i = this.objects.indexOf(e); if (i >= 0) this.objects.splice(i, 1);
      if (e._collider) this.removeCollider(e._collider);
      this.interactables = this.interactables.filter((it) => it.owner !== e);
    }
    addCollider(r, owner) {
      const c = { x: r.x, y: r.y, w: r.w, h: r.h, owner };
      if (owner) owner._collider = c;
      this.colliders.push(c);
      for (let ty = Math.floor(c.y / TS); ty <= Math.floor((c.y + c.h) / TS); ty++)
        for (let tx = Math.floor(c.x / TS); tx <= Math.floor((c.x + c.w) / TS); tx++) {
          const k = tx + ',' + ty;
          if (!this.colGrid.has(k)) this.colGrid.set(k, []);
          this.colGrid.get(k).push(c);
        }
      return c;
    }
    removeCollider(c) {
      this.colliders = this.colliders.filter((o) => o !== c);
      for (const arr of this.colGrid.values()) { const i = arr.indexOf(c); if (i >= 0) arr.splice(i, 1); }
    }
    solidAt(px, py) {
      const tx = Math.floor(px / TS), ty = Math.floor(py / TS);
      if (!this.inb(tx, ty)) return true;
      const i = this.idx(tx, ty);
      return BLOCKING.has(this.tiles[i]) || this.solid[i] === 1;
    }
    blocked(x, y, w, h, ignore) {
      // tile
      for (const [px, py] of [[x, y], [x + w, y], [x, y + h], [x + w, y + h], [x + w / 2, y], [x + w / 2, y + h]])
        if (this.solidAt(px, py)) return true;
      // collider persegi
      for (let ty = Math.floor(y / TS); ty <= Math.floor((y + h) / TS); ty++)
        for (let tx = Math.floor(x / TS); tx <= Math.floor((x + w) / TS); tx++) {
          const arr = this.colGrid.get(tx + ',' + ty);
          if (!arr) continue;
          for (const c of arr) {
            if (c.owner && c.owner === ignore) continue;
            if (c.disabled) continue;
            if (x < c.x + c.w && x + w > c.x && y < c.y + c.h && y + h > c.y) return true;
          }
        }
      // entitas bergerak yang padat (NPC/hewan)
      for (const o of this.objects) {
        if (!o.bodySolid || o === ignore) continue;
        const b = o.body();
        if (x < b.x + b.w && x + w > b.x && y < b.y + b.h && y + h > b.y) return true;
      }
      return false;
    }

    addInteract(it) { this.interactables.push(it); return it; }
    addTrigger(t) { this.triggers.push(t); return t; }
    addZone(name, x0, y0, x1, y1) { this.zones.push({ name, x0: x0 * TS, y0: y0 * TS, x1: (x1 + 1) * TS, y1: (y1 + 1) * TS }); }
    zoneAt(px, py) { for (const z of this.zones) if (px >= z.x0 && px < z.x1 && py >= z.y0 && py < z.y1) return z.name; return null; }

    // ---------- render tanah ----------
    finalize() {
      const n = this.w * this.h;
      this.waterUnder = new Uint8Array(n);
      for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
        let wv = 0;
        for (let dy = -1; dy <= 1 && !wv; dy++) for (let dx = -1; dx <= 1; dx++) if (this.get(x + dx, y + dy) === T.WATER) { wv = 1; break; }
        this.waterUnder[this.idx(x, y)] = wv;
      }
      this.chunks.clear();
    }
    tileTex(t, x, y) {
      const h = U.hash2(x, y, 3);
      switch (t) {
        case T.DIRT: return 't_dirt' + Math.floor(h * 4);
        case T.SAND: return 't_sand' + (h < 0.08 ? 2 : Math.floor(h * 2));
        case T.PLAZA: return 't_plaza' + Math.floor(h * 2);
        case T.SOIL: return 't_soil';
        case T.PLANK: return 't_planks';
        case T.PLANKV: return 't_planks_v';
        case T.FLOOR: return 't_floor' + ((x + y * 3) % 2);
        case T.STONE: return 't_stonefloor' + ((x + y) % 2);
        case T.CARPET: return 't_carpet';
        case T.WALLTOP: return 't_walltop';
        case T.VOID: return 't_void';
        default: return null;
      }
    }
    renderChunk(cx, cy) {
      const c = U.canvas(CH * TS, CH * TS);
      const g = U.ctx(c);
      for (let ty = 0; ty < CH; ty++) for (let tx = 0; tx < CH; tx++) {
        const x = cx * CH + tx, y = cy * CH + ty;
        if (!this.inb(x, y)) continue;
        this.drawTile(g, x, y, tx * TS, ty * TS);
      }
      return c;
    }
    blit(g, name, dx, dy, sx = 0, sy = 0, w = 16, h = 16) {
      const s = G.spr[name];
      if (s) g.drawImage(s.src, s.sx + sx, s.sy + sy, w, h, dx, dy, w, h);
    }
    drawTile(g, x, y, dx, dy) {
      const t = this.get(x, y);
      if (t === T.WATER) return; // digambar di lapisan air animasi
      if (t === T.GRASS) { this.drawGrass(g, x, y, dx, dy); return; }
      if (t === T.WALL) {
        const upper = this.get(x, y - 1) !== T.WALL;
        this.blit(g, this.wallKey, dx, dy, 0, upper ? 0 : 16);
        return;
      }
      const tex = this.tileTex(t, x, y);
      if (tex) this.blit(g, tex, dx, dy);
      // tepi alun-alun (trotoar)
      if (t === T.PLAZA) {
        g.fillStyle = '#8f7c62';
        if (this.get(x, y - 1) !== T.PLAZA) g.fillRect(dx, dy, 16, 1);
        if (this.get(x, y + 1) !== T.PLAZA) g.fillRect(dx, dy + 15, 16, 1);
        if (this.get(x - 1, y) !== T.PLAZA) g.fillRect(dx, dy, 1, 16);
        if (this.get(x + 1, y) !== T.PLAZA) g.fillRect(dx + 15, dy, 1, 16);
      }
      // bayangan & tiang dermaga di atas air
      if ((t === T.PLANK || t === T.PLANKV) && this.get(x, y + 1) === T.WATER) {
        g.fillStyle = PAL.woodD; g.fillRect(dx, dy + 15, 16, 1);
      }
      if (t === T.SAND) {
        // pasir basah di tepi air
        g.fillStyle = PAL.sandD;
        if (this.get(x, y - 1) === T.WATER) g.fillRect(dx, dy, 16, 2);
        if (this.get(x - 1, y) === T.WATER) g.fillRect(dx, dy, 2, 16);
        if (this.get(x + 1, y) === T.WATER) g.fillRect(dx + 14, dy, 2, 16);
      }
      if (t === T.CARPET) {
        g.fillStyle = '#e8b04a';
        if (this.get(x - 1, y) !== T.CARPET) g.fillRect(dx + 1, dy, 1, 16);
        if (this.get(x + 1, y) !== T.CARPET) g.fillRect(dx + 14, dy, 1, 16);
        g.fillStyle = '#5a1418';
        if (this.get(x - 1, y) !== T.CARPET) g.fillRect(dx, dy, 1, 16);
        if (this.get(x + 1, y) !== T.CARPET) g.fillRect(dx + 15, dy, 1, 16);
      }
    }
    drawGrass(g, x, y, dx, dy) {
      const isG = (xx, yy) => { const t = this.get(xx, yy); return t === T.GRASS; };
      const offs = [[-1, -1], [1, -1], [-1, 1], [1, 1]]; // TL TR BL BR
      let full = true;
      for (let q = 0; q < 4; q++) {
        const [sx, sy] = offs[q];
        const V = isG(x, y + sy), H = isG(x + sx, y), D = isG(x + sx, y + sy);
        let kind;
        if (!V && !H) kind = 0; else if (!V && H) kind = 1; else if (V && !H) kind = 2; else if (!D) kind = 3; else kind = 4;
        const qx = dx + (q & 1) * 8, qy = dy + (q >> 1) * 8;
        if (kind !== 4) {
          full = false;
          // dasar di bawah tepi rumput = jenis tile tetangga
          let bt;
          if (!V) bt = this.get(x, y + sy); else if (!H) bt = this.get(x + sx, y); else bt = this.get(x + sx, y + sy);
          if (bt !== T.WATER) {
            const tex = this.tileTex(bt, x, y) || 't_dirt0';
            this.blit(g, tex, qx, qy, (q & 1) * 8, (q >> 1) * 8, 8, 8);
          }
        }
        G.drawGrassQuad(g, q, kind, qx, qy);
      }
      if (full) {
        // detail rumput prosedural agar tidak polos
        const h = U.hash2(x, y, 9);
        g.fillStyle = PAL.grassM;
        if (h < 0.35) {
          const bx = dx + 2 + Math.floor(U.hash2(x, y, 4) * 10), by = dy + 3 + Math.floor(U.hash2(x, y, 5) * 9);
          g.fillRect(bx, by, 1, 2); g.fillRect(bx + 2, by - 1, 1, 3); g.fillRect(bx + 4, by + 1, 1, 1);
        } else if (h < 0.45) {
          const bx = dx + 3 + Math.floor(U.hash2(x, y, 6) * 9), by = dy + 4 + Math.floor(U.hash2(x, y, 7) * 8);
          g.fillStyle = PAL.grassD; g.fillRect(bx, by, 2, 1); g.fillStyle = '#9fd877'; g.fillRect(bx, by - 1, 1, 1);
        } else if (h < 0.5) {
          const bx = dx + 4 + Math.floor(U.hash2(x, y, 8) * 8), by = dy + 4 + Math.floor(U.hash2(x, y, 2) * 8);
          g.fillStyle = U.hash2(x, y, 11) < 0.5 ? '#ffffff' : '#ffe04a'; g.fillRect(bx, by, 1, 1);
        }
      }
    }

    drawGround(ctx, cam, time) {
      const x0 = Math.max(0, Math.floor(cam.x / TS) - 1), y0 = Math.max(0, Math.floor(cam.y / TS) - 1);
      const x1 = Math.min(this.w - 1, Math.ceil((cam.x + cam.w) / TS) + 1), y1 = Math.min(this.h - 1, Math.ceil((cam.y + cam.h) / TS) + 1);
      // 1) lapisan air animasi
      const frame = Math.floor(time * 2.2) % 4;
      const ws = G.spr['t_water' + frame];
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
        if (!this.waterUnder[this.idx(x, y)]) continue;
        const px = x * TS, py = y * TS;
        ctx.drawImage(ws.src, ws.sx, ws.sy, 16, 16, px, py, 16, 16);
        if (this.get(x, y) !== T.WATER) continue;
        // tepi: bayangan tebing di atas, buih di sisi lain
        const n = this.get(x, y - 1), s = this.get(x, y + 1), w = this.get(x - 1, y), e = this.get(x + 1, y);
        if (n !== T.WATER && n !== T.PLANK && n !== T.PLANKV) { ctx.fillStyle = PAL.waterDD; ctx.fillRect(px, py, 16, 3); ctx.fillStyle = PAL.waterD; ctx.fillRect(px, py + 3, 16, 1); }
        const fo = 0.55 + 0.35 * Math.sin(time * 3 + x * 0.7 + y);
        ctx.globalAlpha = fo; ctx.fillStyle = PAL.foam;
        if (s !== T.WATER && s !== T.PLANK && s !== T.PLANKV) { ctx.fillRect(px, py + 14, 16, 1); ctx.fillRect(px + ((x * 5) % 12), py + 13, 3, 1); }
        if (w !== T.WATER && w !== T.PLANK && w !== T.PLANKV) ctx.fillRect(px, py + 2, 1, 13);
        if (e !== T.WATER && e !== T.PLANK && e !== T.PLANKV) ctx.fillRect(px + 15, py + 2, 1, 13);
        ctx.globalAlpha = 1;
      }
      // 2) chunk statis
      for (const k of this.dirtyChunks) this.chunks.delete(k);
      this.dirtyChunks.clear();
      const cx0 = Math.floor(x0 / CH), cy0 = Math.floor(y0 / CH), cx1 = Math.floor(x1 / CH), cy1 = Math.floor(y1 / CH);
      for (let cy = cy0; cy <= cy1; cy++) for (let cx = cx0; cx <= cx1; cx++) {
        const k = cx + ',' + cy;
        let c = this.chunks.get(k);
        if (!c) { c = this.renderChunk(cx, cy); this.chunks.set(k, c); }
        ctx.drawImage(c, cx * CH * TS, cy * CH * TS);
      }
      // 3) hiasan datar
      for (const d of this.decals) {
        if (d.x < cam.x - 24 || d.x > cam.x + cam.w + 24 || d.y < cam.y - 24 || d.y > cam.y + cam.h + 40) continue;
        if (d.draw) d.draw(ctx, time); else G.draw(ctx, d.spr, d.x, d.y, d.flip);
      }
    }
  }

  PV.World = World;
  PV.TS = TS;
})(window.PV);

<script>/* js/world/entities.js */
/* Lembah Piksel — entitas: properti, pemain, NPC, hewan, partikel/efek */
(function (PV) {
  'use strict';
  const U = PV.U, G = PV.G, PAL = PV.PAL;

  const shadow = (ctx, x, y, rx, ry, a = 0.25) => {
    ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = '#000';
    for (let dy = -ry; dy <= ry; dy++) {
      const w = Math.round(rx * Math.sqrt(1 - (dy * dy) / (ry * ry + 0.01)));
      ctx.fillRect(Math.round(x - w), Math.round(y + dy), w * 2 + 1, 1);
    }
    ctx.restore();
  };

  // ---------- Properti statis / animasi ----------
  class Prop {
    constructor(x, y, spr, o = {}) {
      this.x = x; this.y = y; this.spr = spr;
      this.flip = !!o.flip; this.box = o.box || null; this.anim = o.anim || null; this.fps = o.fps || 4;
      this.sortOff = o.sortOff || 0; this.alpha = o.alpha; this.extra = o.extra || null; this.hidden = false;
      this.shake = 0; this.flat = !!o.flat; this.tag = o.tag; this.phase = o.phase || 0;
    }
    solidBox() { return this.box ? { x: this.x + this.box.x, y: this.y + this.box.y, w: this.box.w, h: this.box.h } : null; }
    get sortY() { return this.flat ? -99999 : this.y + this.sortOff; }
    update(dt) { if (this.shake > 0) this.shake = Math.max(0, this.shake - dt); }
    draw(ctx, t) {
      if (this.hidden) return;
      const name = this.anim ? this.anim[Math.floor(t * this.fps + this.phase) % this.anim.length] : this.spr;
      const sx = this.shake > 0 ? Math.round(Math.sin(this.shake * 60) * 1.5) : 0;
      G.draw(ctx, name, this.x + sx, this.y, this.flip, this.alpha);
      if (this.extra) this.extra(ctx, t, this);
    }
  }

  // ---------- Karakter (dasar pemain & NPC) ----------
  const DIR_ROW = { down: 0, up: 1, left: 2, right: 2 };
  class Actor {
    constructor(x, y, char) {
      this.x = x; this.y = y; this.char = char; this.dir = 'down';
      this.moving = false; this.anim = Math.random() * 4; this.bodySolid = false;
    }
    body() { return { x: this.x - 5, y: this.y - 5, w: 10, h: 5 }; }
    get sortY() { return this.y; }
    tryMove(dx, dy) {
      const w = this.world;
      let moved = false;
      if (dx) { const b = this.body(); if (!w.blocked(b.x + dx, b.y, b.w, b.h, this)) { this.x += dx; moved = true; } }
      if (dy) { const b = this.body(); if (!w.blocked(b.x, b.y + dy, b.w, b.h, this)) { this.y += dy; moved = true; } }
      return moved;
    }
    drawChar(ctx) {
      const ch = G.chars[this.char];
      if (!ch) return;
      const row = DIR_ROW[this.dir];
      const sheet = this.moving ? ch.walk : ch.idle;
      const frames = this.moving ? 6 : 4;
      const f = Math.floor(this.anim) % frames;
      shadow(ctx, this.x, this.y - 1, 5, 2);
      const dx = Math.round(this.x - 16), dy = Math.round(this.y - 26 - (this.hop || 0));
      if (this.dir === 'left') {
        ctx.save(); ctx.translate(dx + 32, dy); ctx.scale(-1, 1);
        ctx.drawImage(sheet, f * 32, row * 32, 32, 32, 0, 0, 32, 32); ctx.restore();
      } else ctx.drawImage(sheet, f * 32, row * 32, 32, 32, dx, dy, 32, 32);
    }
    face(tx, ty) {
      const dx = tx - this.x, dy = ty - this.y;
      if (Math.abs(dx) > Math.abs(dy)) this.dir = dx < 0 ? 'left' : 'right';
      else this.dir = dy < 0 ? 'up' : 'down';
    }
  }

  class Player extends Actor {
    constructor(x, y) {
      super(x, y, 'player');
      this.speed = 74; this.stepT = 0; this.frozen = false; this.hop = 0; this.sitting = false;
    }
    update(dt) {
      const In = PV.Input;
      const a = this.frozen ? { x: 0, y: 0 } : In.axis();
      const run = In.isDown('ShiftLeft', 'ShiftRight') ? 1.45 : 1;
      if (a.x || a.y) {
        this.moving = true; this.sitting = false;
        if (Math.abs(a.x) > Math.abs(a.y) + 0.05) this.dir = a.x < 0 ? 'left' : 'right';
        else this.dir = a.y < 0 ? 'up' : 'down';
        const sp = this.speed * run * dt;
        const ok = this.tryMove(a.x * sp, a.y * sp);
        // geser di sudut agar tidak tersangkut
        if (!ok && a.x && !a.y) { if (!this.tryMove(0, -sp * 0.7)) this.tryMove(0, sp * 0.7); }
        this.anim += dt * 10 * run;
        this.stepT -= dt * run;
        if (this.stepT <= 0) {
          this.stepT = 0.3;
          const t = this.world.get(Math.floor(this.x / 16), Math.floor((this.y - 2) / 16));
          PV.Audio.sfx(t === PV.T.PLANK || t === PV.T.PLANKV || t === PV.T.FLOOR ? 'stepWood' : 'step');
          if (Math.random() < 0.5 && !this.world.interior) PV.FX.dust(this.x, this.y);
        }
      } else { this.moving = false; this.anim += dt * 4; }
    }
    interactPoint() {
      const d = { down: [0, 10], up: [0, -14], left: [-11, -4], right: [11, -4] }[this.dir];
      return { x: this.x + d[0], y: this.y + d[1] };
    }
    draw(ctx) { this.drawChar(ctx); }
  }

  class NPC extends Actor {
    constructor(def) {
      super(def.x, def.y, def.char);
      Object.assign(this, { id: def.id, name: def.name, area: def.area || null, speed: def.speed || 26, talk: def.talk, still: !!def.still });
      this.dir = def.dir || 'down'; this.home = { x: def.x, y: def.y };
      this.state = 'idle'; this.timer = U.rand(1, 3); this.target = null; this.talking = false; this.bodySolid = true;
      this.bubble = def.bubble || null;
    }
    body() { return { x: this.x - 5, y: this.y - 5, w: 10, h: 5 }; }
    update(dt) {
      const pl = PV.Game.player;
      if (this.talking) { this.moving = false; this.face(pl.x, pl.y); this.anim += dt * 4; return; }
      this.timer -= dt;
      if (this.state === 'idle') {
        this.moving = false; this.anim += dt * 4;
        if (this.timer <= 0) {
          if (this.still || !this.area) { this.timer = U.rand(2, 5); if (!this.still && Math.random() < 0.3) this.dir = U.choice(['down', 'left', 'right']); return; }
          const a = this.area;
          this.target = { x: U.rand(a[0], a[2]) * 16, y: U.rand(a[1], a[3]) * 16 };
          this.state = 'walk'; this.timer = 6;
        }
      } else {
        const dx = this.target.x - this.x, dy = this.target.y - this.y, d = Math.hypot(dx, dy);
        if (d < 2 || this.timer <= 0) { this.state = 'idle'; this.timer = U.rand(1.5, 4.5); return; }
        const sp = this.speed * dt;
        const mx = (dx / d) * sp, my = (dy / d) * sp;
        // jangan menabrak pemain
        const pb = pl.body(), b = this.body();
        if (Math.abs((b.x + mx) - pb.x) < 10 && Math.abs((b.y + my) - pb.y) < 7 && pl.world === this.world) { this.state = 'idle'; this.timer = 1; return; }
        const ok = this.tryMove(mx, my);
        if (!ok) { this.state = 'idle'; this.timer = U.rand(0.5, 2); return; }
        this.moving = true; this.anim += dt * 8;
        if (Math.abs(dx) > Math.abs(dy)) this.dir = dx < 0 ? 'left' : 'right'; else this.dir = dy < 0 ? 'up' : 'down';
      }
    }
    draw(ctx, t) {
      this.drawChar(ctx);
      const pl = PV.Game.player;
      const near = U.dist(pl.x, pl.y, this.x, this.y) < 44;
      const b = typeof this.bubble === 'function' ? this.bubble() : this.bubble;
      if (b && !this.talking) G.draw(ctx, b, this.x, this.y - 30 + Math.round(Math.sin(t * 4) * 1.5));
      else if (near && !this.talking && !(PV.Game.focus && PV.Game.focus.owner === this)) {
        const tag = PV.Paint.textSprite(this.name, '#fff6d8');
        ctx.drawImage(tag, Math.round(this.x - tag.width / 2), Math.round(this.y - 34));
      }
    }
  }

  // ---------- Hewan ternak ----------
  class Animal {
    constructor(kind, x, y, area) {
      this.kind = kind; this.x = x; this.y = y; this.area = area; // area px [x0,y0,x1,y1]
      this.isCow = kind.startsWith('cow'); this.isChick = kind === 'chick';
      this.speed = this.isCow ? 12 : this.isChick ? 22 : 18;
      this.state = 'idle'; this.timer = U.rand(0.5, 3); this.anim = Math.random() * 4; this.flip = false;
      this.dir = 'side'; this.bodySolid = this.isCow; this.heart = 0; this.cooldown = 0; this.hop = 0;
    }
    body() { return this.isCow ? { x: this.x - 10, y: this.y - 6, w: 20, h: 6 } : { x: this.x - 4, y: this.y - 3, w: 8, h: 3 }; }
    get sortY() { return this.y; }
    update(dt) {
      this.timer -= dt; this.heart = Math.max(0, this.heart - dt); this.cooldown = Math.max(0, this.cooldown - dt);
      if (this.hop > 0) this.hop = Math.max(0, this.hop - dt * 20);
      if (this.state === 'idle') {
        this.anim += dt * (this.isCow ? 2 : 5);
        if (this.timer <= 0) {
          const a = this.area;
          this.target = { x: U.rand(a[0], a[2]), y: U.rand(a[1], a[3]) };
          this.state = 'walk'; this.timer = 5;
          if (!this.isCow && Math.random() < 0.15) PV.Game.nearSfx(this, 'cluck');
          if (this.isCow && Math.random() < 0.08) PV.Game.nearSfx(this, 'moo');
        }
      } else {
        const dx = this.target.x - this.x, dy = this.target.y - this.y, d = Math.hypot(dx, dy);
        if (d < 2 || this.timer <= 0) { this.state = 'idle'; this.timer = U.rand(1, 4); return; }
        const sp = this.speed * dt;
        const nx = this.x + (dx / d) * sp, ny = this.y + (dy / d) * sp;
        const b = this.body();
        if (this.world.blocked(b.x + (nx - this.x), b.y + (ny - this.y), b.w, b.h, this)) { this.state = 'idle'; this.timer = U.rand(0.5, 2); return; }
        this.x = nx; this.y = ny;
        this.anim += dt * (this.isCow ? 5 : 9);
        if (this.isCow) this.dir = Math.abs(dx) > Math.abs(dy) * 1.2 ? 'side' : dy < 0 ? 'up' : 'down';
        this.flip = dx > 0;
      }
    }
    draw(ctx, t) {
      const f = Math.floor(this.anim) % 4;
      let name;
      if (this.isCow) {
        const row = this.dir === 'side' ? 0 : this.dir === 'down' ? 1 : 2;
        name = `${this.kind}_${row}_${this.state === 'walk' ? f : f % 2}`;
        shadow(ctx, this.x, this.y - 1, 10, 3);
        G.draw(ctx, name, this.x, this.y, this.dir === 'side' && this.flip);
      } else {
        const row = this.state === 'walk' ? 0 : 1;
        name = this.isChick ? `chick_${this.flip ? 1 : 0}_${f}` : `${this.kind}_${row}_${f}`;
        shadow(ctx, this.x, this.y - 1, this.isChick ? 3 : 5, 1);
        G.draw(ctx, name, this.x, this.y - this.hop, this.isChick ? false : this.flip);
      }
      if (this.heart > 0) G.draw(ctx, 'bub_heart', this.x, this.y - (this.isCow ? 26 : 14) - (1 - this.heart) * 4);
    }
  }

  // ---------- Partikel & efek ----------
  const FX = {
    list: [],
    clear() { this.list.length = 0; },
    text(x, y, str, col = '#ffffff') { this.list.push({ k: 'text', x, y, vy: -18, life: 1.4, max: 1.4, spr: PV.Paint.textSprite(str, col) }); },
    spr(name, x, y, o = {}) { this.list.push(Object.assign({ k: 'spr', name, x, y, vx: 0, vy: -12, life: 1, max: 1 }, o)); },
    burst(x, y, cols, n = 10, spd = 40, o = {}) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2, s = spd * (0.4 + Math.random() * 0.8);
        this.list.push({ k: 'px', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - (o.up || 20), g: o.g === undefined ? 90 : o.g, life: o.life || 0.7, max: o.life || 0.7, col: U.choice(cols), size: o.size || 1 });
      }
    },
    ring(x, y, col = '#d8f0ff', r = 2, vr = 16, life = 0.8) { this.list.push({ k: 'ring', x, y, r, vr, life, max: life, col }); },
    dust(x, y) { this.list.push({ k: 'px', x: x + U.rand(-3, 3), y: y - 1, vx: U.rand(-6, 6), vy: -6, g: 0, life: 0.35, max: 0.35, col: 'rgba(230,210,170,0.8)', size: 2 }); },
    sparkle(x, y, n = 6) { this.burst(x, y, ['#ffffff', '#ffe27a', '#bff2ff'], n, 30, { g: 0, up: 10, life: 0.9 }); },
    firework(x, y) {
      const cols = U.choice([['#ff6a8a', '#ffd0dc'], ['#ffd23f', '#fff6c8'], ['#6ab0ff', '#d8f0ff'], ['#7dff8a', '#e0ffe4'], ['#c87aff', '#f0d8ff']]);
      for (let i = 0; i < 48; i++) {
        const a = (i / 48) * Math.PI * 2, s = (i % 2 ? 38 : 62) + Math.random() * 18;
        this.list.push({ k: 'px', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, g: 26, life: 1.6, max: 1.6, col: cols[i % 2], size: i % 3 ? 1 : 2, drag: 0.965 });
      }
      this.list.push({ k: 'ring', x, y, r: 3, vr: 60, life: 0.35, max: 0.35, col: '#ffffff' });
    },
    update(dt) {
      for (const p of this.list) {
        p.life -= dt;
        if (p.k === 'px') { if (p.drag) { p.vx *= p.drag; p.vy *= p.drag; } p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
        else if (p.k === 'ring') p.r += p.vr * dt;
        else { p.x += (p.vx || 0) * dt; p.y += p.vy * dt; }
      }
      this.list = this.list.filter((p) => p.life > 0);
    },
    draw(ctx) {
      for (const p of this.list) {
        const a = U.clamp(p.life / p.max * 1.6, 0, 1);
        ctx.globalAlpha = a;
        if (p.k === 'text') ctx.drawImage(p.spr, Math.round(p.x - p.spr.width / 2), Math.round(p.y));
        else if (p.k === 'spr') G.draw(ctx, p.name, p.x, p.y);
        else if (p.k === 'px') { ctx.fillStyle = p.col; ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size); }
        else if (p.k === 'ring') {
          ctx.strokeStyle = p.col; ctx.lineWidth = 1;
          const r = Math.round(p.r);
          ctx.fillStyle = p.col;
          for (let i = 0; i < 24; i++) { const an = (i / 24) * Math.PI * 2; ctx.fillRect(Math.round(p.x + Math.cos(an) * r), Math.round(p.y + Math.sin(an) * r * 0.45), 1, 1); }
        }
      }
      ctx.globalAlpha = 1;
    },
  };

  PV.Ent = { Prop, Actor, Player, NPC, Animal, shadow };
  PV.FX = FX;
})(window.PV);

</script>
<script>/* js/game/data.js */
/* Lembah Piksel — database item, resep, ikan, kuis, dan buku lore */
(function (PV) {
  'use strict';

  const ITEMS = {
    // bibit (ikon dari aset Spring Crops)
    bibit_stroberi: { name: 'Bibit Stroberi', cat: 'Bibit', buy: 20, price: 6, desc: 'Tanam di ladang. Sukai air setiap tahap.' },

<script>/* js/game/state.js */
/* Lembah Piksel — state permainan, inventaris, simpan/muat, misi utama & permintaan harian */
(function (PV) {
  'use strict';
  const U = PV.U;
  const SAVE_KEY = 'lembahPiksel.save.v1';

  function fresh() {
    return {
      v: 1, coins: 60, day: 1,
      inv: { bibit_stroberi: 3, bibit_kentang: 2, penyiram: 1 },
      quest: 0, qbase: {}, flags: {},
      stats: { fish: 0, orders: 0, harvest: 0, crafted: 0, eggs: 0, milk: 0, quizBest: 0, earned: 0, requests: 0, forage: 0 },
      fishLog: {}, farm: Array.from({ length: 24 }, () => null), log: [],
      daily: null, mailDay: 0, wellDay: 0, wishDay: 0, luck: 0,
      pos: { map: 'desa', x: 11 * 16, y: 70 * 16 + 12, dir: 'down' },
      playTime: 0,
    };
  }

  const State = {
    S: fresh(),
    reset() { this.S = fresh(); PV.S = this.S; },
    has(id, n = 1) { return (this.S.inv[id] || 0) >= n; },
    count(id) { return this.S.inv[id] || 0; },
    add(id, n = 1, silent) {
      this.S.inv[id] = (this.S.inv[id] || 0) + n;
      if (!silent) {
        const it = PV.DATA.ITEMS[id];
        PV.UI.toast(`+${n} ${it ? it.name : id}`, id);
      }
      PV.UI.refresh();
      PV.Quests.check();
    },
    take(id, n = 1) {
      if (!this.has(id, n)) return false;
      this.S.inv[id] -= n;
      if (this.S.inv[id] <= 0) delete this.S.inv[id];
      PV.UI.refresh();
      return true;
    },
    coins(n, why) {
      this.S.coins = Math.max(0, this.S.coins + n);
      if (n > 0) this.S.stats.earned += n;
      PV.UI.coinPulse(n);
      if (why) this.log(`${n > 0 ? '+' : ''}${n} koin — ${why}`);
      PV.UI.refresh();
    },
    stat(k, n = 1) { this.S.stats[k] = (this.S.stats[k] || 0) + n; PV.Quests.check(); },
    flag(k, v = true) { this.S.flags[k] = v; PV.Quests.check(); },
    log(msg) {
      this.S.log.unshift(`H${this.S.day} · ${msg}`);
      if (this.S.log.length > 40) this.S.log.length = 40;
    },
    save(silent) {
      const pl = PV.Game.player, w = PV.Game.world;
      if (pl && w) this.S.pos = { map: w.id, x: pl.x, y: pl.y, dir: pl.dir };
      const ok = U.storage.set(SAVE_KEY, JSON.stringify(this.S));
      if (!silent) PV.UI.toast(ok ? 'Permainan tersimpan' : 'Gagal menyimpan (penyimpanan browser diblokir)', ok ? 'buku' : null);
      return ok;
    },
    hasSave() { return !!U.storage.get(SAVE_KEY); },
    load() {
      const raw = U.storage.get(SAVE_KEY);
      if (!raw) return false;
      try {
        const d = JSON.parse(raw);
        const base = fresh();
        this.S = Object.assign(base, d);
        this.S.stats = Object.assign(fresh().stats, d.stats || {});
        if (!Array.isArray(this.S.farm) || this.S.farm.length !== 24) this.S.farm = fresh().farm;
        PV.S = this.S;
        return true;
      } catch (e) { return false; }
    },
    wipe() { U.storage.del(SAVE_KEY); },
  };
  PV.State = State;
  PV.S = State.S;

  // ================= MISI UTAMA =================
  const st = () => State.S;
  const prog = (k) => st().stats[k] || 0; // kumulatif: hasil yang didapat lebih awal tetap dihitung
  const QUESTS = [
    { id: 'kenalan', title: 'Selamat Datang di Lembah', where: 'Alun-Alun',
      obj: () => 'Bicara dengan Pak Kades di dekat air mancur', done: () => st().flags.metKades, reward: { coins: 30 } },
    { id: 'panen', title: 'Panen Pertama', where: 'Rumah & Kebunku',
      obj: () => `Tanam, siram & panen di kebunmu (${Math.min(1, prog('harvest'))}/1)`, done: () => prog('harvest') >= 1, reward: { coins: 40, items: { bibit_stroberi: 2 } } },
    { id: 'mancing', title: 'Kail Pertama', where: 'Dermaga Danau Biru',
      obj: () => (State.has('joran') || State.has('joran_pro') ? `Tangkap ikan di danau (${Math.min(3, prog('fish'))}/3)` : 'Temui Pak Bayu di dermaga untuk meminjam joran'),
      done: () => prog('fish') >= 3, reward: { coins: 60, items: { umpan: 5 } } },
    { id: 'kafe', title: 'Barista Magang', where: 'Kafe Senja',
      obj: () => `Sajikan pesanan di Kafe Senja (${Math.min(5, prog('orders'))}/5)`, done: () => prog('orders') >= 5, reward: { coins: 80 } },
    { id: 'ternak', title: 'Pagi di Peternakan', where: 'Peternakan Ratna',
      obj: () => `Kumpulkan telur (${Math.min(2, prog('eggs'))}/2) & perah susu (${Math.min(1, prog('milk'))}/1)`,
      done: () => prog('eggs') >= 2 && prog('milk') >= 1, reward: { coins: 60 } },
    { id: 'kuis', title: 'Ujian Cendekia', where: 'Perpustakaan',
      obj: () => 'Lulus kuis Bu Laras (min. 4 dari 5 benar)', done: () => st().flags.quizPassed, reward: { coins: 100, items: { lencana: 1 } } },
    { id: 'lentera', title: 'Lentera Pertama', where: 'Bengkel Mas Joko',
      obj: () => `Rakit Lentera (Kayu ${Math.min(2, State.count('kayu'))}/2 · Besi ${Math.min(1, State.count('besi'))}/1 · Kaca ${Math.min(1, State.count('kaca'))}/1)`,
      done: () => st().flags.craftedLentera, reward: { coins: 80 } },
    { id: 'harta', title: 'Rahasia Lembah', where: 'Perpustakaan → Hutan',
      obj: () => (st().flags.treasureKnown ? 'Gali di batu berlumut, barat laut api unggun hutan' : 'Cari petunjuk Kristal Cahaya di perpustakaan'),
      done: () => State.has('kristal'), reward: { coins: 150 } },
    { id: 'festival', title: 'Festival Lentera', where: 'Alun-Alun',
      obj: () => 'Bawa Lentera & Kristal Cahaya kepada Pak Kades', done: () => st().flags.festivalDone, reward: { coins: 300 } },
    { id: 'bebas', title: 'Kehidupan Lembah', where: 'Di mana saja',
      obj: () => `Penuhi permintaan warga (${st().stats.requests}) · Koleksi ikan ${Object.keys(st().fishLog).length}/${PV.DATA.FISH.length}`, done: () => false },
  ];

  const Quests = {
    list: QUESTS,
    current() { return QUESTS[Math.min(st().quest, QUESTS.length - 1)]; },
    begin() { st().qbase = Object.assign({}, st().stats); },
    check() {
      const q = this.current();
      if (!q || !q.done || this.busy) return;
      if (q.done()) {
        this.busy = true;
        const r = q.reward || {};
        PV.Audio.sfx('quest');
        PV.UI.banner('MISI SELESAI', q.title);
        State.log(`Misi selesai: ${q.title}`);
        if (r.coins) State.coins(r.coins, 'hadiah misi');
        if (r.items) for (const k in r.items) State.add(k, r.items[k]);
        st().quest++;
        this.begin();
        this.busy = false;
        const nq = this.current();
        setTimeout(() => PV.UI.toast(`Misi baru: ${nq.title}`, 'gulungan'), 1400);
        PV.UI.refresh();
        this.check();
      }
      PV.UI.refreshQuest();
    },
    // ---------- permintaan harian (papan pengumuman) ----------
    ensureDaily() {
      const S = st();
      if (S.daily && S.daily.day === S.day) return S.daily;
      const pool = [
        { who: 'Mbak Sari', item: 'telur', n: 2, pay: 70 }, { who: 'Mbak Sari', item: 'stroberi', n: 2, pay: 100 },
        { who: 'Bu Laras', item: 'jamur', n: 2, pay: 55 }, { who: 'Bu Laras', item: 'bunga', n: 1, pay: 45 },
        { who: 'Pak Darto', item: 'kayu', n: 4, pay: 50 }, { who: 'Pak Darto', item: 'kentang', n: 2, pay: 120 },
        { who: 'Mas Joko', item: 'batu', n: 3, pay: 35 }, { who: 'Mas Joko', item: 'besi', n: 1, pay: 60 },
        { who: 'Pak Bayu', item: 'umpan', n: 3, pay: 30 }, { who: 'Pak Bayu', item: 'nila', n: 1, pay: 60 },
        { who: 'Bu Ratna', item: 'beri', n: 3, pay: 50 }, { who: 'Nenek Sumi', item: 'ikan_mas', n: 1, pay: 50 },
        { who: 'Raka', item: 'beri', n: 2, pay: 35 }, { who: 'Putri', item: 'bunga', n: 1, pay: 40 },
        { who: 'Pak Kades', item: 'susu', n: 1, pay: 65 }, { who: 'Dimas', item: 'daun_bawang', n: 2, pay: 80 },
      ];
      const r = U.rng(S.day * 7919 + 13);
      const picks = [];
      while (picks.length < 3) { const p = r.pick(pool); if (!picks.includes(p)) picks.push(p); }
      S.daily = { day: S.day, reqs: picks.map((p) => Object.assign({ done: false }, p)) };
      return S.daily;
    },
  };
  PV.Quests = Quests;
})(window.PV);

</script>
<script>/* js/game/activities.js */
/* Lembah Piksel — aktivitas & interaksi setiap lokasi (dialog NPC, kebun, ternak, hutan, harta, festival) */
(function (PV) {
  'use strict';
  const U = PV.U, G = PV.G;
  const { Prop, Animal } = PV.Ent;
  const St = () => PV.State;
  const S = () => PV.State.S;
  const D = PV.DATA;
  const C = (t) => t * 16 + 8;
  const now = () => PV.Game.time;

  const Act = {};

  // ======================= DIALOG NPC =======================
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  Act.talk = function (n) {
    if (!n) return;
    const UI = PV.UI, q = S().quest;
    const who = { name: n.name, char: n.char };
    const hint = () => `Misi saat ini: "${PV.Quests.current().title}" — ${PV.Quests.current().obj()}.`;
    n.talking = true;
    const end = () => { n.talking = false; };
    switch (n.id) {
      case 'kades':
        if (q === 0) {
          UI.dialog(who, [
            'Selamat datang di Lembah Piksel, Nak! Aku Wiryo, kepala desa di sini.',
            'Dulu setiap tahun kami merayakan Festival Lentera. Tapi sejak Kristal Cahaya hilang, lembah ini jadi sepi...',
            'Maukah kamu membantu warga? Mulailah dari kebun di rumahmu — tanam bibit yang sudah kusiapkan!',
            'Tekan [I] untuk tas, [Q] untuk misi, dan [M] untuk peta. Semoga betah!',
          ], { onEnd: () => { end(); St().flag('metKades'); } });
        } else if (q === 8 && St().has('lentera') && St().has('kristal')) {
          UI.dialog(who, [
            'Itu... Lentera buatanmu! Dan Kristal Cahaya yang legendaris!',
            'Ayo semua, berkumpul di alun-alun! FESTIVAL LENTERA DIMULAI!',
          ], { onEnd: () => { end(); Act.festival(); } });
        } else if (S().flags.festivalDone) {
          UI.dialog(who, [pick(['Lembah kembali bercahaya berkat kamu. Terima kasih!', 'Lentera-lentera itu akan menyala setiap malam sekarang.', 'Jangan lupa cek papan pengumuman, warga sering butuh bantuan.'])], { onEnd: end });
        } else {
          UI.dialog(who, [pick(['Bagaimana harimu? Lembah ini indah, bukan?', 'Warga senang ada wajah baru di sini.', 'Kristal Cahaya... konon disimpan Penjaga Hutan. Bu Laras mungkin tahu lebih banyak.']), hint()], { onEnd: end });
        }
        break;
      case 'sari':
        UI.dialog(who, [
          q === 3 ? 'Halo! Kafe lagi ramai banget, aku butuh barista magang. Mau bantu satu shift?' : pick(['Selamat datang di Kafe Senja! Kopi kami pakai gula aren asli lho.', 'Pelanggan suka banget Smoothie Stroberi dari kebun warga.', 'Kalau bawa telur atau kentang, menu spesial bisa muncul!']),
        ], { choices: [{ label: 'Mulai shift kafe', action: () => { end(); Act.cafe(true); } }, { label: 'Nanti saja', action: end }] });
        break;
      case 'bayu':
        if (!St().has('joran') && !St().has('joran_pro')) {
          UI.dialog(who, [
            'Heh, anak muda! Mau memancing? Ini, pakai joran bambu lamaku.',
            'Hadap ke air, tekan E untuk melempar. Saat tanda "!" muncul, tekan cepat!',
            'Lalu tekan tepat saat penanda ada di zona hijau. Ikan langka zonanya lebih kecil!',
          ], { onEnd: () => { end(); St().add('joran', 1); St().add('umpan', 3); St().log('Dapat Joran Bambu dari Pak Bayu'); } });
        } else {
          const fishIds = D.FISH.filter((f) => !f.junk).map((f) => f.id);
          const total = fishIds.reduce((a, id) => a + St().count(id) * Math.round(D.ITEMS[id].price * 1.2), 0);
          UI.dialog(who, [pick(['Danau ini menyimpan Arwana Emas. Aku pernah melihatnya sekali!', 'Umpan cacing bikin ikan langka lebih sering menggigit.', 'Sampah di danau? Bawa saja ke toko, Pak Darto mau beli murah.']),
            total > 0 ? `Aku bisa beli semua ikanmu 20% lebih mahal: ${total} koin. Mau?` : 'Bawa ikan ke sini, aku beli lebih mahal dari toko!'],
          { choices: total > 0 ? [{ label: `Jual semua ikan (${total} koin)`, action: () => { end(); for (const id of fishIds) { const c = St().count(id); if (c) St().take(id, c); } St().coins(total, 'jual ikan ke Pak Bayu'); PV.Audio.sfx('coin'); } }, { label: 'Tidak', action: end }] : null, onEnd: end });
        }
        break;
      case 'laras':
        UI.dialog(who, [q === 5 ? 'Ah, kamu yang dibicarakan Pak Kades! Siap mengikuti Ujian Cendekia? Butuh 4 dari 5 jawaban benar.' : pick(['Selamat datang di Perpustakaan Lembah. Silakan membaca!', 'Buku tua di podium itu milik Penjaga Hutan. Penuh rahasia...', 'Teka-teki di meja itu menyimpan gambar peta lama.'])],
          { choices: [{ label: 'Ikut kuis', action: () => { end(); PV.Mini.quiz.open(); } }, { label: 'Minta petunjuk', action: () => { UI.dialog(who, ['Jawaban kuis banyak ada di buku-buku rak. Tentang Kristal... bacalah buku tua di podium, atau selesaikan teka-teki geser di meja hijau.'], { onEnd: end }); } }, { label: 'Pamit', action: end }] });
        break;
      case 'darto':
        UI.dialog(who, [pick(['Toko Serba Ada Pak Darto! Bibit, besi, kaca, umpan — semua ada!', 'Hasil kebunmu bisa dijual di sini. Kualitas emas harganya lebih tinggi!', 'Besi dan kaca diperlukan Mas Joko untuk merakit lentera.'])],
          { choices: [{ label: 'Buka toko', action: () => { end(); Act.shop(); } }, { label: 'Nanti saja', action: end }] });
        break;
      case 'joko':
        UI.dialog(who, [q === 6 ? 'Lentera festival? Bisa! Bawa 2 Kayu dari hutan, 1 Besi dan 1 Kaca dari toko. Lalu tempa di landasan!' : pick(['Tempa itu soal irama. Ikuti urutan panahnya!', 'Joran Pro buatanku bisa menangkap Arwana, katanya.', 'Penyiram Emas bikin tanamanmu tumbuh dua kali lebih cepat.'])],
          { choices: [{ label: 'Rakit barang', action: () => { end(); Act.craft(); } }, { label: 'Nanti saja', action: end }] });
        break;
      case 'ratna':
        UI.dialog(who, [pick(['Ayam-ayamku bertelur di sekitar kandang. Ambil saja kalau ketemu!', 'Sapi betina bisa diperah. Tekan kiri-kanan bergantian dengan cepat!', 'Elus hewan-hewanku, mereka suka perhatian.']), q === 4 ? hint() : 'Telur & susu laris di kafe, lho.'], { onEnd: end });
        break;
      case 'putri':
        if (St().has('bunga') && S().flags.putriDay !== S().day) {
          UI.dialog(who, ['Wah, bunga! Boleh buatku? Aku suka sekali!'], { choices: [{ label: 'Berikan bunga', action: () => { end(); St().take('bunga'); S().flags.putriDay = S().day; St().coins(35, 'hadiah dari Putri'); n.bubble = 'bub_heart'; setTimeout(() => { n.bubble = null; }, 3000); PV.Audio.sfx('heart'); } }, { label: 'Jangan sekarang', action: end }] });
        } else UI.dialog(who, [pick(['Aku suka bunga! Di hutan banyak bunga liar lho.', 'Kak, katanya kincir angin itu bisa bicara kalau malam... hihi bohong.', 'Raka selalu kalah kalau main petak umpet!'])], { onEnd: end });
        break;
      case 'raka':
        UI.dialog(who, [pick(['Aku pernah lihat cahaya aneh di hutan barat laut!', 'Kalau lari, tahan Shift! Wuuush!', 'Kata kakek, batu berlumut di hutan itu menyimpan sesuatu...', 'Pak Darto jual umpan murah. Aku mau jadi pemancing hebat!'])], { onEnd: end });
        break;
      case 'dimas':
        UI.dialog(who, [pick(['Kincir ini dibangun kakekku. Dulu berputar setiap Festival Lentera.', 'Dari sini aku bisa melihat seluruh lembah. Indah, kan?', 'Bu Laras punya teka-teki geser yang belum pernah kupecahkan.'])], { onEnd: end });
        break;
      case 'sumi':
        UI.dialog(who, [pick(['Dulu nenek menari di Festival Lentera... ah, kenangan indah.', 'Duduk sini, Nak. Lembah ini penuh cerita.', 'Ikan mas bakar buatan nenek paling enak sedesa!']), 'Kalau kamu bawa ikan mas, taruh di papan pengumuman ya, nenek pasang permintaan.'], { onEnd: end });
        break;
      default:
        UI.dialog(who, ['...'], { onEnd: end });
    }
  };

  // ======================= KEBUN =======================
  Act.buildFarm = function (w, x0, y0, cols, rows) {
    let i = 0;
    for (let ry = 0; ry < rows; ry++) for (let cx = 0; cx < cols; cx++) {
      const idx = i++, tx = x0 + cx, ty = y0 + ry;
      const x = C(tx), y = ty * 16 + 15;
      w.decals.push({ x, y: ty * 16, draw: (ctx) => { const p = S().farm[idx]; if (p && p.wet) w.blit(ctx, 't_soil_wet', tx * 16, ty * 16); } });
      const plotEnt = { x, y, get sortY() { return y - 2; }, update() {}, draw(ctx, t) {
        const p = S().farm[idx];
        if (!p) return;
        const cr = D.CROPS[p.crop];
        const ready = p.stage >= cr.stages - 1;
        const bob = ready ? Math.round(Math.sin(t * 3 + idx) * 0.6) : 0;
        G.draw(ctx, `crop_${p.crop}_${Math.min(p.stage, cr.stages - 1)}`, x, y + bob);
        if (ready && Math.sin(t * 2 + idx) > 0.9) ctx.fillStyle = '#fff', ctx.fillRect(x + 4, y - 12, 1, 1);
      } };
      w.add(plotEnt);
      w.addInteract({ x, y: y - 6, r: 11, h: 20, plot: idx, label: () => Act.plotLabel(idx), action: () => Act.plotAction(idx, x, y) });
    }
  };
  Act.plotLabel = function (i) {
    const p = S().farm[i];
    if (!p) return Object.keys(D.CROPS).some((k) => St().has(D.CROPS[k].seed)) ? 'Tanam bibit' : 'Tanah kosong (beli bibit di toko)';
    const cr = D.CROPS[p.crop];
    if (p.stage >= cr.stages - 1) return 'Panen ' + D.ITEMS[p.crop].name;
    if (!p.wet) return 'Siram ' + D.ITEMS[p.crop].name;
    return `Tumbuh... ${Math.floor(((p.stage + p.t / cr.time) / (cr.stages - 1)) * 100)}%`;
  };
  Act.plotAction = function (i, x, y) {
    const p = S().farm[i];
    const A = PV.Audio;
    if (!p) {
      const seeds = Object.keys(D.CROPS).filter((k) => St().has(D.CROPS[k].seed));
      if (!seeds.length) { PV.UI.toast('Tidak punya bibit. Beli di Toko Pak Darto!'); A.sfx('error'); return; }
      const plant = (k) => {
        St().take(D.CROPS[k].seed);
        S().farm[i] = { crop: k, stage: 0, wet: false, t: 0 };
        A.sfx('plant'); PV.FX.burst(x, y - 4, ['#6e4630', '#8a5a3e'], 6, 20);
        PV.UI.toast(`Menanam ${D.ITEMS[k].name}. Jangan lupa siram!`, D.CROPS[k].seed);
      };
      if (seeds.length === 1) plant(seeds[0]);
      else PV.UI.choose('Pilih bibit', seeds.map((k) => ({ label: `${D.ITEMS[D.CROPS[k].seed].name} (${St().count(D.CROPS[k].seed)})`, icon: D.CROPS[k].seed, action: () => plant(k) })));
      return;
    }
    const cr = D.CROPS[p.crop];
    if (p.stage >= cr.stages - 1) {
      const r = Math.random();
      const q = r < 0.03 ? '_iridium' : r < 0.12 ? '_gold' : r < 0.32 ? '_silver' : '';
      St().add(p.crop + q, 1);
      if (Math.random() < 0.35) St().add(p.crop, 1);
      S().farm[i] = null;
      St().stat('harvest');
      St().log(`Panen ${D.ITEMS[p.crop + q].name}`);
      A.sfx('harvest'); PV.FX.sparkle(x, y - 10, 10);
      return;
    }
    if (!p.wet) {
      if (!St().has('penyiram') && !St().has('penyiram_emas')) { PV.UI.toast('Butuh penyiram!'); return; }
      p.wet = true; A.sfx('water');
      PV.FX.burst(x, y - 14, ['#8fd0f5', '#d8f0ff', '#3f8fd0'], 12, 26, { g: 120, up: 10 });
      return;
    }
    if (St().has('pupuk')) {
      PV.UI.choose('Tanaman sedang tumbuh', [
        { label: 'Pakai Pupuk Super (+1 tahap)', icon: 'pupuk', action: () => { St().take('pupuk'); p.stage = Math.min(cr.stages - 1, p.stage + 1); p.t = 0; A.sfx('sparkle'); PV.FX.sparkle(x, y - 10, 12); } },
        { label: 'Biarkan tumbuh', action: () => {} },
      ]);
    } else PV.UI.toast('Tanaman sedang tumbuh. Sabar ya!');
  };
  Act.updateFarm = function (dt) {
    const mul = St().has('penyiram_emas') ? 2 : 1;
    for (const p of S().farm) {
      if (!p || !p.wet) continue;
      const cr = D.CROPS[p.crop];
      if (p.stage >= cr.stages - 1) continue;
      p.t += dt * mul;
      if (p.t >= cr.time) {
        p.t = 0; p.stage++;
        if (p.stage < cr.stages - 1) p.wet = false;
      }
    }
  };

  // ======================= PETERNAKAN =======================
  Act.buildRanch = function (w, area) {
    const animals = [
      new Animal('cow_female', U.rand(area[0] + 20, area[2] - 20), area[1] + 30, area),
      new Animal('cow_male', U.rand(area[0] + 20, area[2] - 20), area[1] + 40, area),
      new Animal('chicken_red', U.rand(area[0], area[2]), area[1] + 10, area),
      new Animal('chicken_red', U.rand(area[0], area[2]), area[1] + 20, area),
      new Animal('chicken_blonde', U.rand(area[0], area[2]), area[1] + 15, area),
      new Animal('chick', U.rand(area[0], area[2]), area[1] + 25, area),
      new Animal('chick', U.rand(area[0], area[2]), area[1] + 25, area),
    ];
    for (const a of animals) {
      w.add(a);
      const isMilk = a.kind === 'cow_female';
      w.addInteract({ owner: a, get x() { return a.x; }, get y() { return a.y - 6; }, r: a.isCow ? 18 : 12, h: a.isCow ? 30 : 16,
        label: () => (isMilk ? (a.cooldown > 0 ? `Elus sapi (perah lagi ${Math.ceil(a.cooldown)}d)` : 'Perah susu sapi') : a.isCow ? 'Elus sapi jantan' : a.isChick ? 'Elus anak ayam' : 'Elus ayam'),
        action: () => {
          if (isMilk && a.cooldown <= 0) { PV.Mini.milk.open(a); return; }
          a.heart = 1; a.hop = 4; PV.Audio.sfx(a.isCow ? 'moo' : 'cluck'); PV.Audio.sfx('heart');
          if (!S().flags['pet_' + S().day + '_' + a.kind]) { S().flags['pet_' + S().day + '_' + a.kind] = 1; PV.FX.text(a.x, a.y - 30, '♥', '#ff8aa0'); }
        } });
    }
    // penelur
    const spawnArea = [19 * 16, 52 * 16 + 4, 27 * 16, 54 * 16 + 8];
    const eggs = [];
    const spawnEgg = () => {
      if (eggs.length >= 3) return;
      const ex = U.rand(spawnArea[0], spawnArea[2]), ey = U.rand(spawnArea[1], spawnArea[3]);
      const e = w.add(new Prop(ex, ey, 'egg_0', { anim: ['egg_0', 'egg_1', 'egg_2', 'egg_3', 'egg_0', 'egg_0'], fps: 3, phase: Math.random() * 6 }));
      eggs.push(e);
      const it = w.addInteract({ owner: e, x: ex, y: ey - 4, r: 12, h: 14, label: 'Ambil telur', action: () => {
        St().add('telur', 1); St().stat('eggs'); PV.Audio.sfx('egg'); PV.FX.sparkle(ex, ey - 6, 5);
        w.remove(e); eggs.splice(eggs.indexOf(e), 1);
        w.interactables = w.interactables.filter((o) => o !== it);
      } });
    };
    spawnEgg(); spawnEgg();
    w.add({ x: 0, y: -9999, sortY: -9999, t: 0, update(dt) { this.t += dt; if (this.t > 28) { this.t = 0; spawnEgg(); } }, draw() {} });
  };

  // ======================= HUTAN =======================
  Act.setupTrees = function (trees) {
    for (const tr of trees) {
      // pohon di tepi peta tidak bisa dijangkau — tidak perlu interaksi
      const tx = tr.x / 16, ty = tr.y / 16;
      if (tx < 3 || tx > 108 || ty < 3 || ty > 81) continue;
      tr.world.addInteract({ x: tr.x, y: tr.y - 2, r: 13, h: 48, label: () => (now() < tr.cool ? 'Pohon (baru digoyang)' : 'Goyangkan pohon'), action: () => {
        tr.shake = 0.45; PV.Audio.sfx('shake');
        PV.FX.burst(tr.x, tr.y - 30, [PV.PAL.g3, PV.PAL.g4, PV.PAL.g2], 10, 30, { g: 60 });
        if (now() < tr.cool) { PV.UI.toast('Tidak ada yang jatuh lagi. Coba nanti.'); return; }
        tr.cool = now() + 45;
        const r = Math.random();
        if (r < 0.55) { St().add('kayu', r < 0.2 ? 2 : 1); St().stat('forage'); }
        else if (r < 0.75) { St().add('beri', 1); St().stat('forage'); }
        else if (r < 0.85) { St().add('bunga', 1); }
        else if (r < 0.9) { St().coins(5, 'koin tersangkut di pohon'); PV.Audio.sfx('coin'); }
        else PV.UI.toast('Hanya daun yang berguguran...');
      } });
    }
  };
  Act.addBerryBush = function (w, x, y) {
    const b = w.add(new Prop(x, y, 'bush_berry', { box: { x: -7, y: -5, w: 14, h: 5 } }));
    b.regrow = 0;
    w.addInteract({ x, y: y - 6, r: 13, h: 18, label: () => (b.spr === 'bush_berry' ? 'Petik beri' : 'Semak (beri belum tumbuh)'), action: () => {
      if (b.spr !== 'bush_berry') { PV.UI.toast('Beri belum tumbuh lagi.'); return; }
      b.spr = 'bush'; b.regrow = now() + 70; b.shake = 0.3;
      St().add('beri', U.randInt(1, 3)); St().stat('forage'); PV.Audio.sfx('pop');
    } });
    w.add({ x, y: -9999, sortY: -9999, update() { if (b.spr === 'bush' && now() > b.regrow) b.spr = 'bush_berry'; }, draw() {} });
  };
  Act.addMushroom = function (w, x, y) {
    const m = w.add(new Prop(x, y, Math.random() < 0.6 ? 'mushroom' : 'mushroom_b'));
    m.back = 0;
    w.addInteract({ x, y: y - 3, r: 11, h: 12, enabled: () => !m.hidden, label: 'Ambil jamur', action: () => {
      m.hidden = true; m.back = now() + U.rand(70, 110);
      St().add('jamur', 1); St().stat('forage'); PV.Audio.sfx('pop'); PV.FX.sparkle(x, y - 4, 4);
    } });
    w.add({ x, y: -9999, sortY: -9999, update() { if (m.hidden && now() > m.back) m.hidden = false; }, draw() {} });
  };
  Act.addRock = function (w, x, y) {
    const rk = w.add(new Prop(x, y, 'rock', { box: { x: -7, y: -5, w: 14, h: 5 } }));
    rk.hits = 0; rk.back = 0;
    w.addInteract({ x, y: y - 5, r: 13, h: 16, enabled: () => !rk.hidden, label: () => `Pecahkan batu (${rk.hits}/3)`, action: () => {
      rk.hits++; rk.shake = 0.25; PV.Audio.sfx('rock'); PV.FX.burst(x, y - 6, ['#9a8a8a', '#b8a8a4', '#5a4a52'], 6, 30);
      if (rk.hits >= 3) {
        rk.hits = 0; rk.hidden = true; rk.back = now() + 90;
        if (rk._collider) rk._collider.disabled = true;
        St().add('batu', 2); St().stat('forage');
      }
    } });
    w.add({ x, y: -9999, sortY: -9999, update() { if (rk.hidden && now() > rk.back) { rk.hidden = false; if (rk._collider) rk._collider.disabled = false; } }, draw() {} });
  };

  // ======================= HARTA KARUN =======================
  Act.buildTreasure = function (w, x, y) {
    const rock = w.add(new Prop(x, y, 'rock_moss', { box: { x: -8, y: -6, w: 16, h: 6 } }));
    const chest = w.add(new Prop(x + 18, y + 2, 'chest_open'));
    chest.hidden = !S().flags.treasureFound;
    Act._treasure = { rock, chest };
    w.addInteract({ x, y: y - 6, r: 15, h: 22, label: () => (S().flags.treasureFound ? 'Batu berlumut (sudah digali)' : S().flags.treasureKnown ? 'GALI di sini!' : 'Periksa batu berlumut'), action: () => {
      if (S().flags.treasureFound) { PV.UI.say('Batu Berlumut', 'Lubang galianmu masih ada. Kristal sudah aman bersamamu.'); return; }
      if (!S().flags.treasureKnown) { PV.UI.say('Batu Berlumut', 'Batu besar berlumut lembut. Tanah di sekitarnya tampak pernah digali... tapi kamu belum tahu harus apa.'); return; }
      Act.dig(x + 18, y + 2, chest);
    } });
  };
  Act.dig = function (cx, cy, chest) {
    const pl = PV.Game.player;
    pl.frozen = true;
    let n = 0;
    const step = () => {
      n++;
      PV.Audio.sfx('dig'); PV.FX.burst(cx, cy - 4, ['#6e4630', '#a8784a', '#4f3022'], 10, 35);
      PV.Game.shake = 2;
      if (n < 4) setTimeout(step, 420);
      else {
        chest.hidden = false; chest.spr = 'chest';
        setTimeout(() => {
          chest.spr = 'chest_open'; PV.Audio.sfx('chest'); PV.FX.sparkle(cx, cy - 10, 18); PV.FX.ring(cx, cy - 4, '#ffe27a', 2, 30, 1);
          S().flags.treasureFound = true;
          St().add('kristal', 1); St().coins(120, 'harta karun hutan'); St().log('Menemukan Kristal Cahaya!');
          pl.frozen = false;
          PV.UI.dialog({ name: 'Peti Penjaga Hutan' }, ['Di dalam peti tua, sebuah kristal berpendar lembut — KRISTAL CAHAYA!', 'Ada juga kantong koin dan catatan: "Bawa kristal ini kepada kepala desa."']);
        }, 600);
      }
    };
    step();
  };

  // ======================= FESTIVAL =======================
  Act.festival = function () {
    St().take('lentera'); St().take('kristal');
    S().flags.festivalDone = true;
    PV.Game.festivalUntil = now() + 18; PV.Game.festivalStart = now();
    PV.Audio.playMusic('pesta');
    PV.UI.banner('FESTIVAL LENTERA', 'Lembah kembali bercahaya!');
    St().log('Festival Lentera digelar!');
    // NPC berkumpul di alun-alun
    for (const o of PV.Game.world.objects) if (o.id && o.area && !o.still) { o.area = [47, 45, 63, 51]; }
    setTimeout(() => PV.Quests.check(), 500);
    setTimeout(() => PV.UI.ending(), 16500);
  };
  // lampion di alun-alun (digambar setelah festival)
  Act.lanternData = function () {
    if (Act._lan) return Act._lan;
    const lines = [[[44, 34], [55, 40], [66, 34]], [[44, 53], [55, 47], [66, 53]], [[44, 34], [50, 43], [44, 53]], [[66, 34], [60, 43], [66, 53]]];
    const cols = ['#ff6a5a', '#ffd23f', '#ff9a3a', '#ff7eb6', '#7ad8ff'];
    const rope = [], lamps = [];
    lines.forEach((pts, li) => {
      for (let s = 0; s < pts.length - 1; s++) {
        const [x0, y0] = pts[s], [x1, y1] = pts[s + 1];
        const ax = x0 * 16 + 8, ay = y0 * 16 - 22, bx = x1 * 16 + 8, by = y1 * 16 - 22;
        const n = Math.max(8, Math.round(Math.hypot(bx - ax, by - ay)));
        for (let i = 0; i <= n; i++) {
          const u = i / n, x = Math.round(ax + (bx - ax) * u), y = Math.round(ay + (by - ay) * u + Math.sin(u * Math.PI) * 12);
          rope.push([x, y]);
          if (i % 30 === 15) lamps.push({ x, y, c: cols[(lamps.length + li) % cols.length], ph: lamps.length });
        }
      }
    });
    return (Act._lan = { rope, lamps });
  };
  Act.drawLanterns = function (ctx, t) {
    if (!S().flags.festivalDone || PV.Game.world.id !== 'desa') return;
    const { rope, lamps } = Act.lanternData();
    ctx.fillStyle = '#3a2a2a';
    for (const [x, y] of rope) ctx.fillRect(x, y, 1, 1);
    for (const l of lamps) {
      const sw = Math.round(Math.sin(t * 2 + l.ph) * 1);
      const x = l.x + sw, y = l.y + 1;
      ctx.fillStyle = '#3a2a2a'; ctx.fillRect(x, y - 1, 1, 2);
      ctx.fillStyle = '#1c0a18'; ctx.fillRect(x - 3, y + 1, 7, 8); ctx.fillRect(x - 2, y, 5, 10);
      ctx.fillStyle = l.c; ctx.fillRect(x - 2, y + 1, 5, 8);
      ctx.fillStyle = '#fff6c8'; ctx.fillRect(x, y + 3, 1, 3);
      ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(x - 2, y + 4, 5, 1);
    }
  };
  Act.drawFestivalGlow = function (ctx, t, objects) {
    const glow = (x, y, r, rgb, a) => {
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
      ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
    };
    ctx.globalCompositeOperation = 'lighter';
    for (const o of objects) if (o.spr === 'lamp') glow(o.x, o.y - 33, 34, '255,190,100', 0.42);
    if (S().flags.festivalDone) for (const l of Act.lanternData().lamps) {
      const rgb = l.c === '#7ad8ff' ? '120,200,255' : l.c === '#ff7eb6' ? '255,120,180' : '255,170,90';
      glow(l.x, l.y + 5, 18 + Math.sin(t * 3 + l.ph) * 2, rgb, 0.5);
    }
    const pl = PV.Game.player;
    glow(pl.x, pl.y - 12, 26, '255,230,180', 0.18);
    ctx.globalCompositeOperation = 'source-over';
  };

  // ======================= LAIN-LAIN =======================
  Act.mailbox = function () {
    if (S().mailDay >= S().day) { PV.UI.say('Kotak Surat', 'Kosong. Surat baru datang besok pagi.'); return; }
    S().mailDay = S().day;
    const gifts = [
      { text: 'Nak, ibu kirim bibit stroberi. Jaga kesehatan ya!', item: 'bibit_stroberi', n: 2 },
      { text: 'Ayah titip umpan cacing. Semoga dapat ikan besar!', item: 'umpan', n: 4 },
      { text: 'Kakek bilang: rajin menyiram, panen melimpah. Ini bibit kentang.', item: 'bibit_kentang', n: 2 },
      { text: 'Uang saku dari ibu. Jangan boros ya!', coins: 40 },
      { text: 'Bibit bawang dari tetangga lama kita.', item: 'bibit_bawang', n: 2 },
    ];
    const g = gifts[(S().day - 1) % gifts.length];
    PV.Audio.sfx('page');
    if (g.item) St().add(g.item, g.n);
    if (g.coins) { St().coins(g.coins, 'surat dari rumah'); PV.Audio.sfx('coin'); }
    PV.UI.dialog({ name: 'Surat dari Rumah', icon: g.item || 'koin' }, [g.text]);
  };
  Act.well = function () {
    PV.Audio.sfx('splash');
    if (S().wellDay < S().day) { S().wellDay = S().day; St().coins(5, 'koin di sumur'); PV.UI.say('Sumur', 'Kamu menimba air segar... ada koin berkilau di embernya! (+5 koin)'); }
    else PV.UI.say('Sumur', 'Airnya jernih dan dingin. Segar sekali!');
  };
  Act.wish = function () {
    if (S().wishDay >= S().day) { PV.UI.say('Air Mancur', 'Kamu sudah membuat permohonan hari ini. Kembali besok!'); return; }
    if (S().coins < 1) { PV.UI.say('Air Mancur', 'Kamu tidak punya koin untuk dilempar.'); return; }
    S().wishDay = S().day; St().coins(-1); S().luck = 1;
    PV.Audio.sfx('sparkle'); PV.FX.sparkle(PV.Game.player.x, PV.Game.player.y - 30, 12);
    PV.UI.say('Air Mancur', 'Plung! Kamu memohon keberuntungan... Tangkapan ikanmu berikutnya akan lebih istimewa!');
  };
  Act.bench = function () {
    const pl = PV.Game.player;
    pl.sitting = true; PV.Audio.sfx('pop');
    PV.UI.dialog({ name: 'Lamunan' }, [pick(D.THOUGHTS)]);
  };
  Act.campfire = function () {
    if (St().has('jamur')) {
      PV.UI.choose('Api Unggun', [
        { label: `Bakar jamur (${St().count('jamur')})`, icon: 'jamur', action: () => { St().take('jamur'); PV.Audio.sfx('hammer'); setTimeout(() => { St().add('jamur_bakar', 1); PV.FX.burst(C(17) + 4, 17 * 16, ['#ff9a1a', '#ffe27a'], 8, 20); }, 300); } },
        { label: 'Hangatkan diri saja', action: () => PV.UI.say('Api Unggun', 'Hangat... Siapa yang menyalakan api ini di tengah hutan?') },
      ]);
    } else PV.UI.say('Api Unggun', 'Apinya hangat. Kalau punya jamur, kamu bisa membakarnya di sini.');
  };
  Act.sleep = function () {
    PV.UI.choose('Tidur sampai besok?', [
      { label: 'Tidur & simpan permainan', icon: 'buku', action: () => {
        PV.Game.fade(() => {
          S().day++; St().log(`Hari ke-${S().day} dimulai`);
          St().save(true);
          PV.UI.banner(`HARI KE-${S().day}`, 'Permainan tersimpan');
          PV.Audio.sfx('success');
          PV.UI.refresh();
        });
      } },
      { label: 'Simpan saja', action: () => St().save() },
      { label: 'Belum ngantuk', action: () => {} },
    ]);
  };
  Act.grandpaChest = function (chest) {
    if (S().flags.grandpaChest) { PV.UI.say('Peti Kakek', 'Peti ini sudah kosong. Hanya ada foto lama kakek dengan lentera.'); return; }
    S().flags.grandpaChest = true; chest.spr = 'chest_open';
    PV.Audio.sfx('chest');
    St().add('bibit_daun_bawang', 3); St().add('bibit_bawang', 2); St().coins(30, 'peti kakek');
    PV.UI.dialog({ name: 'Peti Kakek', icon: 'lentera' }, ['Di dalam peti ada bibit, beberapa koin, dan catatan kakek: "Lentera dibuat dari kayu, besi, dan kaca."']);
  };
  Act.readBook = function (i) {
    PV.Audio.sfx('page');
    const b = D.BOOKS[i];
    PV.UI.book(b, () => {
      if (b.secret && !S().flags.treasureKnown) {
        St().flag('treasureKnown'); PV.UI.toast('Petunjuk baru: batu berlumut di hutan!', 'peta'); PV.Audio.sfx('quest');
        St().log('Menemukan petunjuk Kristal Cahaya');
      }
      if (!S().flags['read' + i]) { S().flags['read' + i] = true; St().coins(5, 'membaca buku'); }
    });
  };
  Act.cafe = function (skipIntro) {
    if (!S().flags.cafeIntro && !skipIntro) {
      S().flags.cafeIntro = true;
      PV.UI.dialog({ name: 'Mbak Sari', char: 'sari' }, ['Selamat datang di Kafe Senja! Aku Sari.', 'Racik pesanan sesuai resep di layar sebelum kesabaran pelanggan habis. Siap?'], { onEnd: () => PV.Mini.cafe.open() });
      return;
    }
    PV.Mini.cafe.open();
  };
  Act.shop = () => PV.Mini.shop.open();
  Act.craft = () => PV.Mini.craft.open();
  Act.puzzle = () => PV.Mini.puzzle.open();
  Act.board = () => PV.Mini.board.open();

  PV.Act = Act;
})(window.PV);

</script>
<script>/* js/world/maps.js */
/* Lembah Piksel — pembangun peta: overworld (112x84 tile) + interior rumah & perpustakaan */
(function (PV) {
  'use strict';
  const U = PV.U, G = PV.G, T = PV.T;
  const { Prop, NPC, Animal } = PV.Ent;
  const C = (t) => t * 16 + 8; // pusat tile -> px
  const Maps = {};

  // ---------- definisi tampilan NPC (palette swap sprite karakter milikmu) ----------
  Maps.makeCharacters = function () {
    G.makeChar('player', {});
    G.makeChar('kades', { hair: 'uban', shirt: '#3f8a3a', pants: '#4a3a2a', skin: 'sawo', acc: 'cap', accColor: '#2a2a34' });
    G.makeChar('sari', { hair: 'cokelat', shirt: '#d8343a', pants: '#3a2a2a', skin: 'kuning', acc: 'long', accColor: '#ffe27a' });
    G.makeChar('bayu', { hair: 'uban', shirt: '#e0a020', pants: '#2a4a6a', skin: 'gelap', acc: 'straw' });
    G.makeChar('laras', { hair: 'ungu', shirt: '#7d4bb3', pants: '#2a2a3a', acc: 'bun', accColor: '#ffcf3a' });
    G.makeChar('darto', { hair: 'hitam', shirt: '#e0682b', pants: '#3a3a48', skin: 'sawo', acc: 'beanie', accColor: '#3f9a3a' });
    G.makeChar('joko', { hair: 'merah', shirt: '#4a4a58', pants: '#6b4a2a', skin: 'kuning', acc: 'cap', accColor: '#d8343a' });
    G.makeChar('ratna', { hair: 'pirang', shirt: '#5fb04a', pants: '#6b4a2a', acc: 'long', accColor: '#ff7eb6' });
    G.makeChar('raka', { hair: 'cokelat', shirt: '#3a7ad8', pants: '#3a3a48', skin: 'sawo', acc: 'cap', accColor: '#ffcf3a' });
    G.makeChar('putri', { hair: 'hitam', shirt: '#f59ab5', pants: '#7d4bb3', acc: 'bun', accColor: '#ff7eb6' });
    G.makeChar('dimas', { hair: 'biru', shirt: '#2a8a8a', pants: '#2a2a3a', skin: 'kuning' });
    G.makeChar('sumi', { hair: 'uban', shirt: '#a86a9a', pants: '#5a3a5a', skin: 'sawo', acc: 'bun', accColor: '#c0c0d0' });
  };

  function npc(w, def) {
    const n = w.add(new NPC(def));
    w.addInteract({ owner: n, get x() { return n.x; }, get y() { return n.y - 6; }, r: 16, h: 30, label: () => 'Bicara: ' + n.name, action: () => PV.Act.talk(n) });
    return n;
  }
  function prop(w, x, y, spr, o) { return w.add(new Prop(x, y, spr, o)); }
  function tree(w, tx, ty, kind) {
    const p = prop(w, C(tx), ty * 16 + 14, kind, { box: { x: -5, y: -5, w: 10, h: 5 }, phase: Math.random() * 4 });
    p.tag = 'tree'; p.cool = 0;
    w.mark(tx - 1, ty - 2, tx + 1, ty);
    return p;
  }
  function sign(w, x, y, text, msg) {
    const p = new PV.Paint.P(Math.max(20, text.length * 4 + 7), 22);
    const bw = p.w;
    p.rect(Math.floor(bw / 2) - 1, 9, 2, 13, PV.PAL.woodD2);
    p.rect(0, 0, bw, 10, PV.PAL.woodL); p.hline(0, 0, bw, '#d8864a'); p.hline(0, 9, bw, PV.PAL.woodD);
    p.g.drawImage(PV.Paint.textSprite(text, '#fff2c8', PV.PAL.woodD), 2, 1);
    p.outline(PV.PAL.out);
    const name = 'sign_' + text;
    if (!G.has(name)) G.defCanvas(name, p.c, Math.floor(bw / 2), 21);
    const s = prop(w, x, y, name, { box: { x: -2, y: -3, w: 4, h: 3 } });
    if (msg) w.addInteract({ x, y: y - 4, r: 14, h: 26, label: 'Baca papan', action: () => PV.UI.say('Papan', msg) });
    return s;
  }
  function deco(w, tx, ty, spr) { w.decals.push({ x: C(tx) + U.randInt(-4, 4), y: ty * 16 + 12 + U.randInt(-3, 3), spr }); w.mark(tx, ty, tx, ty); }
  function fenceRun(w, cells) {
    const set = new Set(cells.map(([x, y]) => x + ',' + y));
    for (const [x, y] of cells) {
      const m = (set.has(x + ',' + (y - 1)) ? 1 : 0) | (set.has((x + 1) + ',' + y) ? 2 : 0) | (set.has(x + ',' + (y + 1)) ? 4 : 0) | (set.has((x - 1) + ',' + y) ? 8 : 0);
      prop(w, C(x), y * 16 + 15, 'fence_' + m, { box: { x: -8, y: -6, w: 16, h: 6 } });
      w.mark(x, y, x, y);
    }
  }
  function rectFence(w, x0, y0, x1, y1, gaps = []) {
    const cells = [];
    const gap = (x, y) => gaps.some(([gx, gy]) => gx === x && gy === y);
    for (let x = x0; x <= x1; x++) { if (!gap(x, y0)) cells.push([x, y0]); if (!gap(x, y1)) cells.push([x, y1]); }
    for (let y = y0 + 1; y < y1; y++) { if (!gap(x0, y)) cells.push([x0, y]); if (!gap(x1, y)) cells.push([x1, y]); }
    fenceRun(w, cells);
  }
  function building(w, spr, cx, by, box, door) {
    const p = prop(w, cx, by, spr, { box });
    const s = G.spr[spr];
    w.mark(Math.floor((cx - s.ax) / 16), Math.floor((by - s.ay + 30) / 16), Math.floor((cx - s.ax + s.w - 1) / 16), Math.floor(by / 16));
    if (door) w.addInteract(Object.assign({ x: cx, y: by - 6, r: 14, h: 30 }, door));
    return p;
  }

  // ======================= OVERWORLD =======================
  Maps.buildDesa = function () {
    const W = 112, H = 84;
    const w = new PV.World('desa', W, H, { name: 'Lembah Piksel', music: 'desa', bg: '#2d594f' });
    const r = U.rng(2026);

    // --- danau ---
    w.fillEllipse(89, 15, 17, 11.5, T.SAND, 0.2, 5);
    w.fillEllipse(89, 15, 14.5, 9, T.WATER, 0.22, 6);
    // --- kolam padang ---
    w.fillEllipse(82, 73, 6, 3.6, T.SAND, 0.2, 8);
    w.fillEllipse(82, 73, 4.6, 2.6, T.WATER, 0.15, 9);
    // --- alun-alun & pelataran perpustakaan ---
    w.fill(44, 34, 66, 53, T.PLAZA);
    w.fill(49, 16, 61, 19, T.PLAZA);
    // --- jalan ---
    w.path([[5, 44], [106, 44]], 3, T.DIRT);
    w.path([[55, 20], [55, 34]], 3, T.DIRT);
    w.path([[55, 53], [55, 79]], 3, T.DIRT);
    w.path([[86, 45], [86, 26]], 3, T.DIRT);
    w.path([[24, 43], [24, 34], [21, 28], [19, 23], [17, 19]], 2, T.DIRT);
    w.fillEllipse(17.5, 17, 3.2, 2.6, T.DIRT, 0.4, 11);
    w.path([[33, 46], [33, 71], [11, 71]], 2, T.DIRT);   // jalan ke rumah
    w.path([[11, 70], [11, 71]], 2, T.DIRT);
    w.path([[19, 69], [19, 71]], 2, T.DIRT);             // gerbang kebun
    w.path([[28, 52], [33, 52]], 2, T.DIRT);             // gerbang peternakan
    w.path([[56, 64], [100, 64]], 2, T.DIRT);            // jalan permukiman
    w.path([[75, 41], [75, 43]], 2, T.DIRT);
    for (const hx of [72, 83, 94]) w.path([[hx, 61], [hx, 63]], 2, T.DIRT);
    w.path([[98, 64], [98, 72]], 2, T.DIRT);
    // --- dermaga ---
    w.fill(85, 17, 86, 26, T.PLANKV);
    w.fill(83, 14, 88, 16, T.PLANK);
    // --- ladang ---
    w.fill(17, 64, 22, 67, T.SOIL);

    // ================= ZONA =================
    w.addZone('Perpustakaan Lembah', 44, 2, 66, 21);
    w.addZone('Danau Biru & Dermaga', 70, 2, 109, 33);
    w.addZone('Kafe Senja', 42, 26, 50, 38);
    w.addZone('Toko Pak Darto', 60, 26, 69, 38);
    w.addZone('Alun-Alun Lembah', 42, 26, 69, 54);
    w.addZone('Hutan Maple', 2, 2, 41, 41);
    w.addZone('Peternakan Ratna', 3, 46, 30, 59);
    w.addZone('Rumah & Kebunku', 3, 60, 35, 81);
    w.addZone('Bengkel Mas Joko', 56, 54, 68, 66);
    w.addZone('Padang Kincir', 60, 66, 109, 81);
    w.addZone('Permukiman Timur', 69, 34, 109, 65);
    w.addZone('Jalan Desa', 0, 0, W, H);

    // ================= BANGUNAN =================
    // rumah pemain
    building(w, 'house_player', C(11) - 8, 70 * 16, { x: -34, y: -60, w: 68, h: 54 },
      { label: 'Masuk Rumah', action: () => PV.Game.changeMap('rumah', C(6) + 8, 9 * 16 + 8, 'up') });
    prop(w, C(14) + 2, 70 * 16 + 4, 'mailbox', { box: { x: -3, y: -3, w: 6, h: 3 } });
    w.addInteract({ x: C(14) + 2, y: 70 * 16, r: 12, h: 18, label: 'Kotak Surat', action: () => PV.Act.mailbox() });
    prop(w, C(14) + 4, 66 * 16 + 14, 'well', { box: { x: -12, y: -10, w: 24, h: 10 } }); w.mark(13, 64, 15, 66);
    w.addInteract({ x: C(14) + 4, y: 66 * 16 + 4, r: 16, h: 36, label: 'Timba air sumur', action: () => PV.Act.well() });
    // kebun + pagar
    rectFence(w, 16, 63, 23, 68, [[19, 68], [20, 68]]);
    PV.Act.buildFarm(w, 17, 64, 6, 4);
    prop(w, C(25), 65 * 16 + 14, 'scarecrow', { box: { x: -3, y: -3, w: 6, h: 3 } }); w.mark(25, 64, 25, 65);
    prop(w, C(16) - 4, 62 * 16 + 14, 'cropsign_stroberi'); prop(w, C(23) + 4, 62 * 16 + 14, 'cropsign_kentang');
    sign(w, C(29), 70 * 16 + 4, 'KEBUNKU', 'Rumah & Kebunku — tanam bibit, siram, dan panen hasilmu!');

    // peternakan
    building(w, 'barn', 11 * 16, 52 * 16, { x: -42, y: -48, w: 84, h: 46 },
      { label: 'Lihat lumbung', action: () => PV.UI.say('Lumbung', 'Lumbung penuh jerami harum. Sapi-sapi tidur di sini saat hujan.') });
    building(w, 'coop', 24 * 16, 51 * 16, { x: -20, y: -26, w: 40, h: 24 },
      { label: 'Intip kandang ayam', action: () => PV.UI.say('Kandang', 'Ayam bertelur di sekitar kandang. Ambil telurnya kalau terlihat!') });
    const ranchCells = [];
    for (let x = 5; x <= 28; x++) { if (x < 7 || x > 15) ranchCells.push([x, 47]); ranchCells.push([x, 58]); }
    for (let y = 48; y < 58; y++) { ranchCells.push([5, y]); if (y !== 52 && y !== 53) ranchCells.push([28, y]); }
    fenceRun(w, ranchCells);
    prop(w, C(17), 55 * 16 + 9, 'trough', { box: { x: -14, y: -6, w: 28, h: 6 } });
    prop(w, C(7), 55 * 16 + 14, 'hay', { box: { x: -10, y: -6, w: 20, h: 6 } });
    prop(w, C(26), 56 * 16 + 14, 'hay', { box: { x: -10, y: -6, w: 20, h: 6 } });
    const area = [7 * 16, 53 * 16 + 4, 27 * 16, 57 * 16 + 8];
    PV.Act.buildRanch(w, area);
    sign(w, C(31), 51 * 16 + 14, 'PETERNAKAN', 'Peternakan Ratna — telur segar & susu sapi. Masuk lewat gerbang timur.');

    // perpustakaan
    building(w, 'library', C(55) - 8, 16 * 16, { x: -72, y: -82, w: 144, h: 66 },
      { label: 'Masuk Perpustakaan', action: () => PV.Game.changeMap('pustaka', C(10) + 8, 13 * 16 + 4, 'up') });
    for (const x of [50, 60]) prop(w, C(x), 19 * 16 + 13, 'flowerbed', { box: { x: -16, y: -6, w: 32, h: 6 } });
    for (const x of [48, 62]) prop(w, C(x), 16 * 16 + 14, 'lamp', { box: { x: -3, y: -4, w: 6, h: 4 } });
    sign(w, C(59) + 4, 21 * 16 + 14, 'PUSTAKA', 'Perpustakaan Lembah — buku, kuis, dan teka-teki. Bu Laras menunggumu!');

    // alun-alun
    const ft = prop(w, C(55) - 8, 44 * 16 + 8, 'fountain', { box: { x: -26, y: -14, w: 52, h: 14 } });

    w.addInteract({ x: C(68) + 4, y: 62 * 16, r: 16, h: 22, label: 'Duduk sejenak', action: () => PV.Act.bench() });

    // ================= POHON =================
    const allTrees = [];
    const tryTree = (x, y, kind) => {
      if (!w.isFree(x - 1, y - 2, x + 1, y)) return;
      const nb = [[0, 1], [0, 2], [1, 1], [-1, 1]];
      for (const [dx, dy] of nb) { const t = w.get(x + dx, y + dy); if (t !== T.GRASS && t !== T.SOIL) return; }
      allTrees.push(tree(w, x, y, kind));
    };
    // pembatas tepi peta (rapat)
    for (let y = 1; y < H; y += 2) for (let x = 1; x < W; x += 2) {
      const edge = x < 4 || x > W - 5 || y < 4 || y > H - 4;
      if (edge) tryTree(x + (y % 4 === 1 ? 1 : 0), y, r() < 0.6 ? 'tree_big' : 'tree_mid');
    }
    // hutan lebat
    for (let y = 4; y < 40; y += 3) for (let x = 4; x < 41; x += 3) {
      const jx = x + r.int(-1, 1), jy = y + r.int(0, 1);
      if (r() < 0.82) tryTree(jx, jy, r() < 0.55 ? 'tree_big' : 'tree_mid');
    }
    // pohon di sekitar perpustakaan & danau & padang
    for (const [x0, y0, x1, y1, d] of [[42, 3, 48, 15], [62, 3, 70, 15], [70, 28, 82, 40], [44, 56, 53, 80], [60, 72, 76, 81], [68, 46, 108, 52], [104, 28, 109, 45], [36, 47, 52, 56], [36, 22, 44, 41]].map((a) => a.concat(0.55))) {
      for (let y = y0; y <= y1; y += 3) for (let x = x0; x <= x1; x += 3) if (r() < d) tryTree(x + r.int(-1, 1), y + r.int(0, 1), r() < 0.5 ? 'tree_big' : 'tree_mid');
    }
    // pohon kecil & tunggul
    for (let i = 0; i < 40; i++) {
      const x = r.int(4, W - 5), y = r.int(4, H - 5);
      if (w.isFree(x, y, x, y)) { prop(w, C(x), y * 16 + 14, r() < 0.6 ? 'sapling' : 'stump', { box: { x: -4, y: -4, w: 8, h: 4 } }); w.mark(x, y, x, y); }
    }
    PV.Act.setupTrees(allTrees);

    // ================= HUTAN: semak beri, jamur, batu =================
    const forestSpots = [];
    for (let y = 5; y < 40; y++) for (let x = 4; x < 40; x++) if (w.isFree(x, y, x, y)) forestSpots.push([x, y]);
    U.shuffle(forestSpots);
    let bi = 0;
    for (let i = 0; i < 9 && bi < forestSpots.length; bi++) {
      const [x, y] = forestSpots[bi];
      if (!w.isFree(x, y, x, y)) continue;
      PV.Act.addBerryBush(w, C(x), y * 16 + 13); w.mark(x, y, x, y); i++;
    }
    for (let i = 0; i < 14 && bi < forestSpots.length; bi++) {
      const [x, y] = forestSpots[bi];
      if (!w.isFree(x, y, x, y)) continue;
      PV.Act.addMushroom(w, C(x) + r.int(-3, 3), y * 16 + 12); w.mark(x, y, x, y); i++;
    }
    for (let i = 0; i < 8 && bi < forestSpots.length; bi++) {
      const [x, y] = forestSpots[bi];
      if (!w.isFree(x, y, x, y)) continue;
      PV.Act.addRock(w, C(x), y * 16 + 13); w.mark(x, y, x, y); i++;
    }
    for (const [x, y] of [[66, 66], [52, 60], [104, 56], [40, 50], [70, 72]]) if (w.isFree(x, y, x, y)) { PV.Act.addRock(w, C(x), y * 16 + 13); w.mark(x, y, x, y); }
    for (const [x, y] of [[42, 60], [104, 66], [70, 50], [38, 30]]) if (w.isFree(x, y, x, y)) { PV.Act.addBerryBush(w, C(x), y * 16 + 13); w.mark(x, y, x, y); }

    // ================= HIASAN DATAR & SEMAK =================
    for (let y = 3; y < H - 3; y++) for (let x = 3; x < W - 3; x++) {
      if (!w.isFree(x, y, x, y)) continue;
      const h = U.hash2(x, y, 77);
      const inMeadow = x > 60 && y > 66;
      if (h < (inMeadow ? 0.2 : 0.045)) deco(w, x, y, G.flowerKeys[Math.floor(U.hash2(x, y, 5) * G.flowerKeys.length)]);
      else if (h < (inMeadow ? 0.26 : 0.08)) deco(w, x, y, 'tallgrass' + (h * 100 % 2 | 0));
      else if (h < 0.088) { prop(w, C(x), y * 16 + 14, U.choice(['bush', 'bush', 'bush_flower', 'bush_white']), { box: { x: -7, y: -5, w: 14, h: 5 } }); w.mark(x, y, x, y); }
    }

    // ================= NPC =================
    npc(w, { id: 'kades', name: 'Pak Kades', char: 'kades', x: C(55), y: 48 * 16 + 8, area: [47, 45, 63, 51], speed: 20,
      bubble: () => (PV.S.quest === 0 || (PV.S.quest === 8 && PV.State.has('lentera') && PV.State.has('kristal')) ? 'bub_quest' : null) });
    npc(w, { id: 'sari', name: 'Mbak Sari', char: 'sari', x: C(48), y: 35 * 16 + 10, still: true, dir: 'down', bubble: () => (PV.S.quest === 3 ? 'bub_quest' : null) });
    npc(w, { id: 'darto', name: 'Pak Darto', char: 'darto', x: C(65), y: 38 * 16 + 14, area: [63, 37, 68, 39], speed: 16 });
    npc(w, { id: 'bayu', name: 'Pak Bayu', char: 'bayu', x: C(87) + 8, y: 27 * 16 + 4, area: [84, 26, 89, 29], speed: 14,
      bubble: () => (!PV.State.has('joran') && !PV.State.has('joran_pro') ? 'bub_quest' : null) });
    npc(w, { id: 'joko', name: 'Mas Joko', char: 'joko', x: 62 * 16 - 40, y: 62 * 16 + 10, area: [58, 62, 64, 63], speed: 16, bubble: () => (PV.S.quest === 6 ? 'bub_quest' : null) });
    npc(w, { id: 'ratna', name: 'Bu Ratna', char: 'ratna', x: C(30), y: 50 * 16, area: [29, 49, 31, 55], speed: 16, bubble: () => (PV.S.quest === 4 ? 'bub_quest' : null) });
    npc(w, { id: 'raka', name: 'Raka', char: 'raka', x: C(58), y: 50 * 16, area: [45, 45, 66, 52], speed: 34 });
    npc(w, { id: 'putri', name: 'Putri', char: 'putri', x: C(76), y: 68 * 16, area: [64, 66, 96, 78], speed: 30 });
    npc(w, { id: 'dimas', name: 'Dimas', char: 'dimas', x: C(97), y: 72 * 16, area: [92, 70, 100, 78], speed: 22 });
    npc(w, { id: 'sumi', name: 'Nenek Sumi', char: 'sumi', x: C(68) + 4, y: 62 * 16 + 14, still: true, dir: 'down' });

    w.finalize();
    return w;
  };

    w.fill(10, 6, 11, 13, T.CARPET);
    w.addZone('Perpustakaan', 0, 0, W, H);
    const B = PV.DATA.BOOKS;
    // rak buku di dinding atas
    const shelves = [[2, 0], [4, 2], [6, 3], [15, 4], [17, 0], [19, 2]];
    shelves.forEach(([tx, bi], i) => {
      prop(w, tx * 16, 4 * 16 + 2, i % 2 ? 'bookshelf2' : 'bookshelf', { box: { x: -16, y: -10, w: 32, h: 10 } });
      const bk = bi === 1 ? 0 : bi; // buku rahasia ada di podium, bukan di rak
      w.addInteract({ x: tx * 16, y: 4 * 16 + 4, r: 16, h: 42, label: 'Baca: ' + B[bk].title, action: () => PV.Act.readBook(bk) });
    });
    for (const x of [9, 13]) prop(w, x * 16, 2 * 16 + 14, 'lib_window', { sortOff: -200 });
