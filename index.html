    prop(w, 11 * 16, 6 * 16 + 4, 'lib_desk', { box: { x: -24, y: -12, w: 48, h: 12 } });
    for (const y of [7, 10]) { prop(w, C(1) - 2, y * 16 + 14, 'bookshelf_s', { box: { x: -8, y: -10, w: 16, h: 10 } }); prop(w, C(20) + 2, y * 16 + 14, 'bookshelf_s', { box: { x: -8, y: -10, w: 16, h: 10 } }); }
    for (const [x, y] of [[5, 8], [17, 8]]) {
      prop(w, x * 16, y * 16 + 6, 'lib_table', { box: { x: -14, y: -8, w: 28, h: 8 } });
      prop(w, x * 16 - 8, y * 16 + 14, 'in_chair_b', { box: { x: -5, y: -4, w: 10, h: 4 } });
      prop(w, x * 16 + 8, y * 16 + 14, 'in_chair_b', { box: { x: -5, y: -4, w: 10, h: 4 } });
    }
    prop(w, 5 * 16, 12 * 16 + 4, 'puzzle_table', { box: { x: -12, y: -8, w: 24, h: 8 } });
    w.addInteract({ x: 5 * 16, y: 12 * 16 - 2, r: 18, h: 24, label: 'Teka-teki geser', action: () => PV.Act.puzzle() });
    prop(w, 17 * 16, 12 * 16 + 4, 'lectern', { box: { x: -6, y: -5, w: 12, h: 5 } });
    w.addInteract({ x: 17 * 16, y: 12 * 16 - 2, r: 16, h: 28, label: 'Baca buku tua di podium', action: () => PV.Act.readBook(1) });
    prop(w, C(19), 5 * 16 + 14, 'globe', { box: { x: -6, y: -4, w: 12, h: 4 } });
    w.addInteract({ x: C(19), y: 5 * 16 + 8, r: 14, h: 26, label: 'Putar bola dunia', action: () => { PV.Audio.sfx('slide'); PV.UI.say('Bola Dunia', 'Kamu memutar bola dunia... jarimu berhenti di Indonesia. Ribuan pulau, ribuan cerita!'); } });
    for (const [x, y] of [[1, 12], [20, 12], [1, 4], [20, 4]]) prop(w, C(x), y * 16 + 14, 'big_plant', { box: { x: -6, y: -4, w: 12, h: 4 } });
    npc(w, { id: 'laras', name: 'Bu Laras', char: 'laras', x: 11 * 16, y: 5 * 16, still: true, dir: 'down', bubble: () => (PV.S.quest === 5 ? 'bub_quest' : null) });
    w.addInteract({ x: 11 * 16, y: 6 * 16 + 10, r: 18, h: 30, label: 'Bicara: Bu Laras', action: () => PV.Act.talk(w.objects.find((o) => o.id === 'laras')) });
    w.addTrigger({ x0: 10 * 16, y0: 14 * 16 + 6, x1: 12 * 16, y1: 15 * 16, action: () => PV.Game.changeMap('desa', C(55) - 8, 16 * 16 + 10, 'down') });
    w.finalize();
    return w;
  };

  PV.Maps = Maps;
})(window.PV);

</script>
<script>/* js/ui/ui.js */
/* Lembah Piksel — UI HTML bergaya pixel: HUD, dialog, toast, banner, modal, tas, jurnal, peta, buku, ending */
(function (PV) {
  'use strict';
  const U = PV.U, G = PV.G;
  const $ = (s, r = document) => r.querySelector(s);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; };
  const icon = (id, cls = 'ico') => `<img class="${cls}" src="${G.iconURL(id)}" alt="">`;

  const UI = {
    dlg: null, modalOpen: false, modalOnClose: null,

    init() {
      document.querySelectorAll('[data-icon]').forEach((im) => { im.src = G.iconURL(im.getAttribute('data-icon')); });
      document.querySelectorAll('#hud [data-act]').forEach((b) => b.addEventListener('click', () => this.hotkey(b.getAttribute('data-act'))));
      $('#modal .close').addEventListener('click', () => this.closeModal());
      $('#modal').addEventListener('mousedown', (e) => { if (e.target.id === 'modal' && !this.modalLocked) this.closeModal(); });
      PV.Input.onKey((e) => this.onKey(e));
      $('#questCard').addEventListener('click', () => this.hotkey('quest'));
      $('#dialog').addEventListener('click', (e) => { if (!e.target.closest('.dchoice')) this.dialogAdvance(); });
    },
    busy() { return !!this.dlg || this.modalOpen; },
    icon,

    onKey(e) {
      if (!PV.Game.started) return;
      if (this.dlg) {
        const d = this.dlg;
        if (d.choicesShown) {
          if (['ArrowUp', 'KeyW'].includes(e.code)) { d.sel = (d.sel - 1 + d.choices.length) % d.choices.length; this.renderChoiceSel(); PV.Audio.sfx('blip'); }
          if (['ArrowDown', 'KeyS'].includes(e.code)) { d.sel = (d.sel + 1) % d.choices.length; this.renderChoiceSel(); PV.Audio.sfx('blip'); }
          if (['Enter', 'Space', 'KeyE', 'NumpadEnter'].includes(e.code)) this.pickChoice(d.sel);
          if (e.code === 'Escape' && d.choices.length) this.pickChoice(d.choices.length - 1);
          if (/^Digit[1-9]$/.test(e.code)) { const i = +e.code.slice(5) - 1; if (i < d.choices.length) this.pickChoice(i); }
        } else if (['Enter', 'Space', 'KeyE', 'NumpadEnter', 'Escape'].includes(e.code)) this.dialogAdvance();
        PV.Input.consume('KeyE', 'Space', 'Enter');
        return;
      }
      if (this.modalOpen) {
        if (e.code === 'Escape' && !this.modalLocked) { this.closeModal(); PV.Input.consume('Escape'); }
        const map = { KeyI: 'bag', KeyQ: 'quest', KeyM: 'map', KeyH: 'help' };
        if (map[e.code] && this.modalKind === map[e.code]) this.closeModal();
        return;
      }
      if (PV.Game.activeMini) return;
      const map = { KeyI: 'bag', Tab: 'bag', KeyQ: 'quest', KeyJ: 'quest', KeyM: 'map', KeyN: 'sound', KeyH: 'help', KeyP: 'save' };
      if (map[e.code]) this.hotkey(map[e.code]);
    },
    hotkey(a) {
      if (!PV.Game.started) return;
      if (a === 'sound') { this.toggleSound(); return; }
      if (this.dlg || PV.Game.activeMini) return;
      if (this.modalOpen && this.modalKind === a) { this.closeModal(); return; }
      if (this.modalOpen) this.closeModal();
      PV.Audio.sfx('select');
      if (a === 'bag') this.openBag();
      else if (a === 'quest') this.openQuests();
      else if (a === 'map') this.openMap();
      else if (a === 'help') this.openHelp();
      else if (a === 'save') PV.State.save();
    },
    toggleSound() {
      const A = PV.Audio;
      const state = !A.musicOn ? 0 : A.sfxOn ? 2 : 1;
      // urutan: semua nyala -> musik mati -> semua mati -> semua nyala
      if (A.musicOn && A.sfxOn) { A.setMusic(false); this.toast('Musik dimatikan (SFX tetap)'); }
      else if (!A.musicOn && A.sfxOn) { A.setSfx(false); this.toast('Semua suara dimatikan'); }
      else { A.setMusic(true); A.setSfx(true); this.toast('Suara dinyalakan'); A.sfx('select'); }
      void state;
      $('#hud [data-act="sound"]').classList.toggle('off', !A.musicOn);
    },

    // ---------- HUD ----------
    refresh() {
      const S = PV.S;
      $('#coinTxt').textContent = U.fmt(S.coins);
      $('#dayTxt').textContent = `Hari ${S.day}`;
      this.refreshQuest();
      if (this.modalOpen && this.modalKind === 'bag') this.renderBag();
    },
    refreshQuest() {
      const q = PV.Quests.current();
      $('#questCard .qt').textContent = q.title;
      $('#questCard .qo').textContent = q.obj();
      $('#questCard .qw').textContent = '📍 ' + q.where;
    },
    coinPulse(n) {
      const c = $('.pill.coins');
      c.classList.remove('pulse'); void c.offsetWidth; c.classList.add('pulse');
      if (n) {
        const f = el('div', 'coinfloat ' + (n > 0 ? 'up' : 'down'), (n > 0 ? '+' : '') + n);
        c.appendChild(f); setTimeout(() => f.remove(), 1100);
      }
    },
    toast(msg, ic) {
      const box = $('#toasts');
      const t = el('div', 'toast', (ic ? icon(ic) : '') + `<span>${U.esc(msg)}</span>`);
      box.appendChild(t);
      while (box.children.length > 5) box.firstChild.remove();
      setTimeout(() => t.classList.add('out'), 3000);
      setTimeout(() => t.remove(), 3500);
    },
    banner(title, sub) {
      const b = $('#banner');
      b.innerHTML = `<div class="bt">${U.esc(title)}</div>${sub ? `<div class="bs">${U.esc(sub)}</div>` : ''}`;
      b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
    },
    area(name) {
      const a = $('#areaBanner');
      a.textContent = name;
      a.classList.remove('show'); void a.offsetWidth; a.classList.add('show');
    },

    // ---------- DIALOG ----------
    dialog(who, lines, opts = {}) {
      if (this.dlg) { const prev = this.dlg; this.closeDialog(true); if (prev.opts.onEnd && prev !== this.dlg) { /* tetap lanjut */ } }
      this.dlg = { who, lines: lines.filter((l) => l !== undefined && l !== null), i: 0, chars: 0, opts, choices: opts.choices || null, sel: 0, choicesShown: false, typing: true };
      const box = $('#dialog');
      box.classList.remove('hidden');
      $('.dname', box).textContent = who.name || '';
      const pc = $('.portrait', box);
      if (who.char && G.chars[who.char]) {
        pc.style.display = 'block';
        const g = U.ctx(pc); g.clearRect(0, 0, 20, 20);
        g.drawImage(G.chars[who.char].idle, 6, 3, 20, 20, 0, 0, 20, 20);
      } else if (who.icon) {
        pc.style.display = 'block';
        const g = U.ctx(pc); g.clearRect(0, 0, 20, 20); g.drawImage(G.icons[who.icon], 2, 2);
      } else pc.style.display = 'none';
      $('.dchoices', box).innerHTML = '';
      this.dlgLine();
    },
    say(title, text, onEnd) { this.dialog({ name: title }, [text], { onEnd }); },
    choose(title, options) { this.dialog({ name: '' }, [title], { choices: options.concat(options.some((o) => /batal|nanti|tidak|belum/i.test(o.label)) ? [] : [{ label: 'Batal', action: () => {} }]) }); },
    dlgLine() {
      const d = this.dlg;
      d.chars = 0; d.typing = true;
      $('#dialog .dtext').textContent = '';
      $('#dialog .dnext').style.visibility = 'hidden';
    },
    dialogUpdate(dt) {
      const d = this.dlg;
      if (!d || !d.typing) return;
      const line = d.lines[d.i] || '';
      const before = Math.floor(d.chars);
      d.chars += dt * 55;
      const n = Math.min(line.length, Math.floor(d.chars));
      if (n !== before && n % 3 === 0) PV.Audio.sfx('type');
      $('#dialog .dtext').textContent = line.slice(0, n);
      if (n >= line.length) this.dlgDone();
    },
    dlgDone() {
      const d = this.dlg;
      d.typing = false;
      $('#dialog .dtext').textContent = d.lines[d.i] || '';
      const last = d.i >= d.lines.length - 1;
      if (last && d.choices && d.choices.length) this.showChoices();
      else $('#dialog .dnext').style.visibility = 'visible';
    },
    dialogAdvance() {
      const d = this.dlg;
      if (!d) return;
      if (d.typing) { this.dlgDone(); return; }
      if (d.choicesShown) return;
      if (d.i < d.lines.length - 1) { d.i++; PV.Audio.sfx('blip'); this.dlgLine(); return; }
      this.closeDialog();
    },
    showChoices() {
      const d = this.dlg;
      d.choicesShown = true;
      const box = $('#dialog .dchoices');
      box.innerHTML = '';
      d.choices.forEach((c, i) => {
        const b = el('button', 'dchoice', `<b>${i + 1}</b>${c.icon ? icon(c.icon) : ''}<span>${U.esc(c.label)}</span>`);
        b.addEventListener('click', (e) => { e.stopPropagation(); this.pickChoice(i); });
        b.addEventListener('mouseenter', () => { d.sel = i; this.renderChoiceSel(); });
        box.appendChild(b);
      });
      this.renderChoiceSel();
    },
    renderChoiceSel() { document.querySelectorAll('#dialog .dchoice').forEach((b, i) => b.classList.toggle('sel', i === this.dlg.sel)); },
    pickChoice(i) {
      const d = this.dlg;
      const c = d.choices[i];
      PV.Audio.sfx('select');
      this.closeDialog(true);
      if (c && c.action) c.action();
    },
    closeDialog(silent) {
      const d = this.dlg;
      this.dlg = null;
      $('#dialog').classList.add('hidden');
      if (!silent && d && d.opts.onEnd) d.opts.onEnd();
      PV.Input.consume('KeyE', 'Space', 'Enter');
      PV.Game.interactLock = 0.15;
    },

    // ---------- MODAL ----------
    openModal(title, body, opts = {}) {
      const m = $('#modal');
      m.classList.remove('hidden');
      m.querySelector('.panel').className = 'panel' + (opts.wide ? ' wide' : '') + (opts.dark ? ' dark' : '') + (opts.cls ? ' ' + opts.cls : '');
      $('.ptitle', m).innerHTML = title;
      const pb = $('.pbody', m);
      pb.innerHTML = '';
      if (typeof body === 'string') pb.innerHTML = body; else if (body) pb.appendChild(body);
      this.modalOpen = true; this.modalKind = opts.kind || null; this.modalOnClose = opts.onClose || null; this.modalLocked = !!opts.locked;
      $('#modal .close').style.display = opts.locked ? 'none' : '';
      return pb;
    },
    closeModal() {
      if (!this.modalOpen) return;
      $('#modal').classList.add('hidden');
      this.modalOpen = false; this.modalKind = null;
      const cb = this.modalOnClose; this.modalOnClose = null;
      PV.Audio.sfx('cancel');
      PV.Game.interactLock = 0.2;
      if (cb) cb();
    },

    // ---------- TAS ----------
    openBag() { this.openModal(icon('tas') + ' Tas', '', { kind: 'bag', wide: true }); this.renderBag(); },
    renderBag() {
      const pb = $('#modal .pbody');
      const inv = PV.S.inv, ITEMS = PV.DATA.ITEMS;
      const ids = Object.keys(inv).filter((k) => inv[k] > 0).sort((a, b) => ((ITEMS[a] || {}).cat || '').localeCompare((ITEMS[b] || {}).cat || '') || a.localeCompare(b));
      const wrap = el('div', 'bag');
      const grid = el('div', 'grid');
      const info = el('div', 'iteminfo', '<p class="muted">Klik item untuk melihat detail.</p>');
      const slots = Math.max(30, Math.ceil(ids.length / 6) * 6);
      for (let i = 0; i < slots; i++) {
        const id = ids[i];
        const s = el('button', 'slot' + (id ? '' : ' empty'));
        if (id) {
          s.innerHTML = icon(id, 'sico') + `<span class="cnt">${inv[id]}</span>`;
          s.title = (ITEMS[id] || {}).name || id;
          s.addEventListener('click', () => {
            grid.querySelectorAll('.slot').forEach((x) => x.classList.remove('sel')); s.classList.add('sel');
            const it = ITEMS[id] || { name: id, desc: '' };
            info.innerHTML = `<div class="ih">${icon(id, 'bigico')}<div><b>${U.esc(it.name)}</b><div class="tag">${U.esc(it.cat || '')}</div></div></div>
              <p>${U.esc(it.desc || '')}</p><p class="muted">Jumlah: ${inv[id]}${it.price ? ` · Harga jual: ${it.price} koin` : ''}</p>`;
            PV.Audio.sfx('blip');
          });
        }
        grid.appendChild(s);
      }
      wrap.appendChild(grid); wrap.appendChild(info);
      const pbx = $('#modal .pbody'); pbx.innerHTML = ''; pbx.appendChild(wrap);
      void pb;
    },

    // ---------- JURNAL MISI ----------
    openQuests(tab = 'misi') {
      const pb = this.openModal(icon('gulungan') + ' Jurnal', '', { kind: 'quest', wide: true });
      const tabs = el('div', 'tabs');
      const body = el('div', 'tabbody');
      const T = { misi: 'Misi', ikan: 'Koleksi Ikan', log: 'Log Aktivitas', stat: 'Statistik' };
      const render = (k) => {
        tabs.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.k === k));
        const S = PV.S;
        if (k === 'misi') {
          body.innerHTML = '<ol class="qlist">' + PV.Quests.list.map((q, i) => {
            const st = i < S.quest ? 'done' : i === S.quest ? 'now' : 'todo';
            return `<li class="${st}"><span class="qmark">${st === 'done' ? '✔' : st === 'now' ? '▶' : '•'}</span><div><b>${U.esc(q.title)}</b>
              <div class="muted">${st === 'todo' ? '???' : U.esc(st === 'now' ? q.obj() : 'Selesai')}</div>${st === 'now' ? `<div class="qwhere">📍 ${U.esc(q.where)}</div>` : ''}</div></li>`;
          }).join('') + '</ol>';
        } else if (k === 'ikan') {
          body.innerHTML = '<div class="fishdex">' + PV.DATA.FISH.map((f) => {
            const n = S.fishLog[f.id] || 0; const it = PV.DATA.ITEMS[f.id];
            return `<div class="fd ${n ? '' : 'unk'}">${icon(f.id, 'bigico')}<b>${n ? U.esc(it.name) : '???'}</b><span class="muted">${n ? `Tertangkap ${n}×` : f.rare ? 'Langka' : 'Belum'}</span></div>`;
          }).join('') + '</div>';
        } else if (k === 'log') {
          body.innerHTML = S.log.length ? '<ul class="loglist">' + S.log.map((l) => `<li>${U.esc(l)}</li>`).join('') + '</ul>' : '<p class="muted">Belum ada aktivitas.</p>';
        } else {
          const st = S.stats;
          const rows = [['Hari', S.day], ['Koin sekarang', S.coins], ['Total koin didapat', st.earned], ['Ikan ditangkap', st.fish], ['Pesanan kafe', st.orders], ['Panen', st.harvest],
            ['Barang dirakit', st.crafted], ['Telur', st.eggs], ['Susu', st.milk], ['Skor kuis terbaik', `${st.quizBest}/5`], ['Permintaan warga', st.requests], ['Bahan dikumpulkan', st.forage]];
          body.innerHTML = '<table class="stats">' + rows.map(([a, b]) => `<tr><td>${a}</td><td>${U.fmt(b) === 'NaN' ? b : b}</td></tr>`).join('') + '</table>';
        }
      };
      for (const k in T) { const b = el('button', '', T[k]); b.dataset.k = k; b.addEventListener('click', () => { PV.Audio.sfx('blip'); render(k); }); tabs.appendChild(b); }
      pb.appendChild(tabs); pb.appendChild(body);
      render(tab);
    },

    // ---------- PETA ----------
    openMap() {
      const w = PV.Game.worlds.desa;
      const pb = this.openModal(icon('peta') + ' Peta Lembah', '', { kind: 'map', wide: true });
      const wrap = el('div', 'mapwrap');
      const c = U.canvas(w.w * 2, w.h * 2);
      const g = U.ctx(c);
      const col = { 0: '#5fae4a', 1: '#c99a63', 2: '#3f8fd0', 3: '#ead29c', 4: '#b4a07f', 5: '#6e4630', 6: '#ae4924', 7: '#ae4924' };
      for (let y = 0; y < w.h; y++) for (let x = 0; x < w.w; x++) { g.fillStyle = col[w.get(x, y)] || '#333'; g.fillRect(x * 2, y * 2, 2, 2); }
      for (const o of w.objects) {
        if (o.spr === 'tree_big' || o.spr === 'tree_mid') { g.fillStyle = '#2f6a3a'; g.fillRect(Math.round(o.x / 8) - 1, Math.round(o.y / 8) - 2, 3, 3); }
        else if (o.spr && /^(house_|library|barn|workshop|coop|windmill)/.test(o.spr)) {
          const s = G.spr[o.spr];
          g.fillStyle = '#7a3a2a'; g.fillRect(Math.round((o.x - s.ax) / 8), Math.round((o.y - s.ay + 20) / 8), Math.round(s.w / 8), Math.round((s.h - 20) / 8));
        }
      }
      wrap.appendChild(c);
      const labels = [['Perpustakaan', 55, 9], ['Danau Biru', 89, 13], ['Dermaga', 86, 22], ['Kafe', 47, 30], ['Toko', 64, 30], ['Alun-Alun', 55, 50], ['Hutan Maple', 18, 24],
        ['Peternakan', 16, 49], ['Rumahku', 11, 66], ['Kebun', 20, 62], ['Bengkel', 62, 58], ['Permukiman', 83, 56], ['Kincir', 101, 70], ['Rumah Kades', 75, 36]];
      for (const [t, x, y] of labels) { const l = el('div', 'mlabel', t); l.style.left = (x / w.w * 100) + '%'; l.style.top = (y / w.h * 100) + '%'; wrap.appendChild(l); }
      if (PV.S.flags.treasureKnown && !PV.S.flags.treasureFound) { const x = el('div', 'mx', '✕'); x.style.left = (13.5 / w.w * 100) + '%'; x.style.top = (14 / w.h * 100) + '%'; wrap.appendChild(x); }
      const pl = PV.Game.player;
      const inDesa = PV.Game.world.id === 'desa';
      const pos = inDesa ? { x: pl.x, y: pl.y } : PV.Game.lastDesaPos;
      if (pos) { const m = el('div', 'mplayer'); m.style.left = (pos.x / 16 / w.w * 100) + '%'; m.style.top = (pos.y / 16 / w.h * 100) + '%'; wrap.appendChild(m); }
      pb.appendChild(wrap);
      pb.appendChild(el('p', 'muted center', `Lokasimu: <b>${U.esc(PV.Game.currentArea || '-')}</b> · Misi: ${U.esc(PV.Quests.current().where)}`));
    },

    // ---------- BANTUAN ----------
    openHelp() {
      this.openModal('❔ Cara Bermain', `
        <div class="help">
          <div><kbd>WASD</kbd>/<kbd>←↑→↓</kbd> Bergerak · <kbd>Shift</kbd> Lari</div>
          <div><kbd>E</kbd>/<kbd>Spasi</kbd> Interaksi / lanjut dialog</div>
          <div><kbd>I</kbd> Tas · <kbd>Q</kbd> Jurnal misi · <kbd>M</kbd> Peta · <kbd>N</kbd> Suara · <kbd>P</kbd> Simpan · <kbd>Esc</kbd> Tutup</div>
          <hr>
          <ul>
            <li><b>Kebun</b>: tanam bibit, siram tiap tahap, panen. Kualitas ★ bisa muncul!</li>
            <li><b>Danau</b>: dapat joran dari Pak Bayu, hadap ke air, tekan E. Tekan saat penanda di zona hijau.</li>
            <li><b>Kafe Senja</b>: racik pesanan sesuai resep sebelum kesabaran pelanggan habis.</li>
            <li><b>Perpustakaan</b>: baca buku, ikut kuis Bu Laras, pecahkan teka-teki geser.</li>
            <li><b>Toko & Bengkel</b>: jual hasil, beli bahan, rakit barang dengan mini-game tempa.</li>
            <li><b>Peternakan & Hutan</b>: telur, susu, kayu, beri, jamur, batu — bahan untuk semua aktivitas.</li>
          </ul>
          <p class="muted">Progres tersimpan otomatis setiap 30 detik dan saat tidur.</p>
        </div>`, { kind: 'help' });
    },

    // ---------- BUKU ----------
    book(b, onEnd) {
      let p = 0;
      const pb = this.openModal('📖 ' + U.esc(b.title), '', { kind: 'book', cls: 'bookpanel', onClose: onEnd });
      const page = el('div', 'bookpage');
      const nav = el('div', 'booknav');
      const prev = el('button', 'btn', '◀ Sebelumnya'), next = el('button', 'btn', 'Berikutnya ▶'), num = el('span', 'muted');
      nav.append(prev, num, next);
      const render = () => {
        page.textContent = b.pages[p]; num.textContent = `${p + 1} / ${b.pages.length}`;
        prev.disabled = p === 0; next.textContent = p === b.pages.length - 1 ? 'Tutup buku' : 'Berikutnya ▶';
      };
      prev.onclick = () => { if (p > 0) { p--; PV.Audio.sfx('page'); render(); } };
      next.onclick = () => { if (p < b.pages.length - 1) { p++; PV.Audio.sfx('page'); render(); } else this.closeModal(); };
      pb.append(page, nav);
      render();
      this.bookKeys = (code) => { if (['ArrowRight', 'KeyD', 'Space', 'KeyE', 'Enter'].includes(code)) next.onclick(); if (['ArrowLeft', 'KeyA'].includes(code)) prev.onclick(); };
    },

    // ---------- ENDING ----------
    ending() {
      const S = PV.S;
      this.openModal('🏮 Festival Lentera', `
        <div class="ending">
          <p>Lentera buatanmu menyala bersama Kristal Cahaya. Untuk pertama kalinya setelah bertahun-tahun, seluruh Lembah Piksel bercahaya.</p>
          <p>Warga menari, kembang api bermekaran, dan Pak Kades menobatkanmu sebagai <b>Penjaga Lentera</b> yang baru.</p>
          <div class="estats">
            <div>${icon('koin')} ${U.fmt(S.stats.earned)} koin didapat</div><div>${icon('ikan_mas')} ${S.stats.fish} ikan</div>
            <div>${icon('kopi_susu_aren')} ${S.stats.orders} pesanan</div><div>${icon('stroberi')} ${S.stats.harvest} panen</div>
            <div>${icon('lencana')} Hari ke-${S.day}</div><div>${icon('lentera')} ${S.stats.crafted} rakitan</div>
          </div>
          <p class="muted">Petualangan berlanjut! Penuhi permintaan warga, lengkapi koleksi ikan, dan cari Arwana Emas.</p>
          <p class="credit">Aset karakter, tanaman, hewan, rumah & interior: Farm RPG FREE 16x16 Tiny Asset Pack · Aset tambahan, musik & SFX: dibuat prosedural di kode.</p>
        </div>`, { kind: 'ending' });
    },
  };

  PV.UI = UI;
})(window.PV);

</script>
<script>/* js/minigames/cafe.js */
/* Lembah Piksel — Mini-game KAFE SENJA: racik pesanan dengan batas waktu */
(function (PV) {
  'use strict';
  const U = PV.U, G = PV.G, D = PV.DATA;
  const Mini = (PV.Mini = PV.Mini || {});
  const icon = (id, c) => PV.UI.icon(id, c);
  const BASE_KEYS = ['Digit1', 'Digit2', 'Digit3', 'Digit4', 'Digit5', 'Digit6', 'Digit7', 'Digit8'];
  const SPECIAL_KEYS = ['KeyZ', 'KeyX', 'KeyC', 'KeyV', 'KeyB'];
  const SHIFT = 75;
  const CUSTOMERS = ['kades', 'raka', 'putri', 'dimas', 'sumi', 'ratna', 'bayu', 'darto', 'joko', 'laras'];

  const cafe = {
    open() {
      this.root = PV.UI.openModal(icon('kopi_susu_aren') + ' Kafe Senja — Shift Barista', '', { wide: true, locked: true, kind: 'mini', cls: 'cafepanel', onClose: () => this.cleanup() });
      PV.Game.activeMini = this;
      PV.Audio.playMusic('main');
      this.intro();
    },
    intro() {
      this.phase = 'intro';
      const avail = this.availRecipes();
      this.root.innerHTML = `
        <div class="mg-intro">
          <p>Pelanggan datang dengan pesanan. Klik bahan (atau tekan tombol angka) untuk mengisi gelas, lalu <b>Sajikan</b> (Enter). Pesanan bisa disajikan ke pelanggan mana pun yang cocok.</p>
          <div class="recipes">${avail.map((r) => this.recipeRow(r)).join('')}</div>
          ${D.RECIPES.some((r) => r.special && !avail.includes(r)) ? '<p class="muted">Menu spesial (★) muncul jika kamu membawa stroberi, telur, kentang, atau nila + daun bawang di tas.</p>' : ''}
          <div class="row center"><button class="btn green" id="cStart">Mulai Shift (${SHIFT} detik)</button><button class="btn" id="cExit">Keluar</button></div>
        </div>`;
      this.root.querySelector('#cStart').onclick = () => this.start();
      this.root.querySelector('#cExit').onclick = () => this.close();
    },
    recipeRow(r) {
      return `<div class="rcp ${r.special ? 'sp' : ''}">${icon(r.id)}<b>${r.special ? '★ ' : ''}${U.esc(r.name)}</b><span class="ings">${r.ing.map((i) => icon(i)).join('<i>+</i>')}</span><span class="pay">${r.pay}${icon('koin')}</span></div>`;
    },
    availRecipes() {
      return D.RECIPES.filter((r) => {
        if (!r.special) return true;
        const need = {};
        for (const i of r.ing) if (D.CAFE_SPECIAL.includes(i)) need[i] = (need[i] || 0) + 1;
        return Object.keys(need).every((k) => PV.State.has(k, need[k]));
      });
    },
    start() {
      this.phase = 'play';
      Object.assign(this, { time: SHIFT, served: 0, missed: 0, earned: 0, combo: 0, best: 0, cup: [], slots: [null, null, null], spawnT: 1, msg: '', msgT: 0, steam: [] });
      this.root.innerHTML = `
        <div class="cafe">
          <div class="cbar"><div class="ctime"><div class="fill"></div></div>
            <span>${icon('koin')} <b id="cEarn">0</b></span><span>Dilayani <b id="cServed">0</b></span><span>Kombo <b id="cCombo">0</b></span></div>
          <canvas id="cScene" width="240" height="96"></canvas>
          <div class="cmid">
            <div class="cupbox"><span class="lbl">Gelas:</span><div id="cCup" class="cup"></div>
              <button class="btn green" id="cServe">Sajikan ⏎</button><button class="btn red" id="cTrash">Buang ⌫</button></div>
            <div id="cMsg" class="cmsg"></div>
          </div>
          <div id="cIngs" class="ings-grid"></div>
          <details class="cbook"><summary>📖 Buku resep</summary><div class="recipes small">${this.availRecipes().map((r) => this.recipeRow(r)).join('')}</div></details>
        </div>`;
      this.canvas = this.root.querySelector('#cScene');
      this.ctx = U.ctx(this.canvas);
      this.root.querySelector('#cServe').onclick = () => this.serve();
      this.root.querySelector('#cTrash').onclick = () => this.trash();
      this.buildIngs();
      this.renderCup();
    },
    buildIngs() {
      const box = this.root.querySelector('#cIngs');
      box.innerHTML = '';
      this.ingButtons = [];
      D.CAFE_ING.forEach((ing, i) => {
        const b = document.createElement('button');
        b.className = 'ingbtn';
        b.innerHTML = `${icon(ing.id)}<span>${ing.name}</span><kbd>${i + 1}</kbd>`;
        b.onclick = () => this.addIng(ing.id);
        box.appendChild(b);
        this.ingButtons.push({ id: ing.id, key: BASE_KEYS[i], b });
      });
      D.CAFE_SPECIAL.forEach((id, i) => {
        const b = document.createElement('button');
        b.className = 'ingbtn special';
        b.onclick = () => this.addIng(id);
        box.appendChild(b);
        this.ingButtons.push({ id, key: SPECIAL_KEYS[i], b, special: true });
      });
      this.refreshIngs();
    },
    reserved(id) { return this.cup.filter((x) => x === id).length; },
    refreshIngs() {
      for (const ib of this.ingButtons) {
        if (!ib.special) continue;
        const left = PV.State.count(ib.id) - this.reserved(ib.id);
        ib.b.innerHTML = `${icon(ib.id)}<span>${D.ITEMS[ib.id].name} ×${left}</span><kbd>${ib.key.slice(3)}</kbd>`;
        ib.b.disabled = left <= 0;
      }
    },
    addIng(id) {
      if (this.phase !== 'play') return;
      if (this.cup.length >= 4) { this.flash('Gelas penuh!', true); PV.Audio.sfx('error'); return; }
      if (D.CAFE_SPECIAL.includes(id) && PV.State.count(id) - this.reserved(id) <= 0) { PV.Audio.sfx('error'); return; }
      this.cup.push(id);
      PV.Audio.sfx(id === 'es' ? 'tick' : id === 'susu' || id === 'air_panas' || id === 'espresso' ? 'pour' : 'pop');
      if (id === 'espresso' || id === 'air_panas') for (let i = 0; i < 4; i++) this.steam.push({ x: 222 + U.rand(-3, 3), y: 40, life: 1 });
      this.renderCup(); this.refreshIngs();
    },
    trash() { if (!this.cup.length) return; this.cup = []; PV.Audio.sfx('cancel'); this.renderCup(); this.refreshIngs(); },
    renderCup() {
      const c = this.root.querySelector('#cCup');
      c.innerHTML = this.cup.length ? this.cup.map((i) => icon(i)).join('') : '<span class="muted">kosong</span>';
    },
    flash(m, bad) { const e = this.root.querySelector('#cMsg'); e.textContent = m; e.className = 'cmsg ' + (bad ? 'bad' : 'good'); this.msgT = 1.6; },
    match(r) {
      if (r.ing.length !== this.cup.length) return false;
      const a = [...r.ing].sort().join(','), b = [...this.cup].sort().join(',');
      return a === b;
    },
    serve() {
      if (this.phase !== 'play' || !this.cup.length) return;
      let idx = -1;
      for (let i = 0; i < 3; i++) { const s = this.slots[i]; if (s && s.state === 'wait' && this.match(s.r)) { if (idx < 0 || s.pat < this.slots[idx].pat) idx = i; } }
      if (idx < 0) {
        this.combo = 0; this.flash('Tidak ada yang memesan itu!', true); PV.Audio.sfx('error');
        const first = this.slots.find((s) => s && s.state === 'wait'); if (first) first.pat -= 4;
        this.cup = []; this.renderCup(); this.refreshIngs(); return;
      }
      const s = this.slots[idx];
      for (const i of this.cup) if (D.CAFE_SPECIAL.includes(i)) PV.State.take(i, 1);
      const tip = Math.round(s.r.pay * 0.6 * (s.pat / s.max));
      this.combo++; this.best = Math.max(this.best, this.combo);
      const bonus = this.combo >= 3 ? (this.combo - 2) * 2 : 0;
      const total = s.r.pay + tip + bonus;
      this.earned += total; this.served++;
      PV.State.coins(total); PV.State.stat('orders');
      PV.Audio.sfx('serve'); setTimeout(() => PV.Audio.sfx('coin'), 120);
      this.flash(`${s.r.name}! +${total} koin${tip ? ` (tip ${tip})` : ''}${bonus ? ` · kombo +${bonus}` : ''}`);
      s.state = 'happy'; s.t = 1.2;
      this.cup = []; this.renderCup(); this.refreshIngs();
    },
    spawn() {
      const free = this.slots.map((s, i) => (s ? -1 : i)).filter((i) => i >= 0);
      if (!free.length) return;
      const i = U.choice(free);
      const avail = this.availRecipes();
      const specials = avail.filter((r) => r.special);
      const r = specials.length && Math.random() < 0.3 ? U.choice(specials) : U.choice(avail.filter((x) => !x.special));
      const max = U.rand(20, 27) - (SHIFT - this.time) * 0.07;
      this.slots[i] = { r, char: U.choice(CUSTOMERS), pat: max, max, state: 'walk', t: 0.8, x: i * 80 + 40 };
    },
    update(dt) {
      const In = PV.Input;
      if (this.phase === 'play') {
        for (const ib of this.ingButtons) if (In.wasPressed(ib.key)) this.addIng(ib.id);
        if (In.wasPressed('Enter', 'NumpadEnter', 'Space')) this.serve();
        if (In.wasPressed('Backspace', 'Delete')) this.trash();
        if (In.wasPressed('Escape')) { this.end(); return; }
        this.time -= dt;
        this.spawnT -= dt;
        if (this.spawnT <= 0) { this.spawn(); this.spawnT = U.rand(3.2, 5.5) - (SHIFT - this.time) * 0.012; }
        for (let i = 0; i < 3; i++) {
          const s = this.slots[i];
          if (!s) continue;
          if (s.state === 'walk') { s.t -= dt; if (s.t <= 0) s.state = 'wait'; }
          else if (s.state === 'wait') { s.pat -= dt; if (s.pat <= 0) { s.state = 'angry'; s.t = 1.2; this.missed++; this.combo = 0; PV.Audio.sfx('fail'); this.flash('Pelanggan pergi kesal...', true); } }
          else { s.t -= dt; if (s.t <= 0) this.slots[i] = null; }
        }
        if (this.msgT > 0) { this.msgT -= dt; if (this.msgT <= 0) this.root.querySelector('#cMsg').textContent = ''; }
        for (const p of this.steam) { p.y -= dt * 14; p.x += Math.sin(p.y * 0.3) * 0.2; p.life -= dt * 0.8; }
        this.steam = this.steam.filter((p) => p.life > 0);
        if (Math.random() < dt * 1.5) this.steam.push({ x: 222 + U.rand(-2, 2), y: 40, life: 0.8 });
        this.root.querySelector('.ctime .fill').style.width = Math.max(0, (this.time / SHIFT) * 100) + '%';
        this.root.querySelector('#cEarn').textContent = this.earned;
        this.root.querySelector('#cServed').textContent = this.served;
        this.root.querySelector('#cCombo').textContent = this.combo;
        this.draw();
        if (this.time <= 0) this.end();
      } else if (this.phase === 'intro' || this.phase === 'done') {
        if (this.phase === 'done' && (this.doneT = (this.doneT || 0) - dt) > 0) return;
        if (In.wasPressed('Escape')) this.close();
        if (In.wasPressed('Enter', 'Space')) this.start();
      }
    },
    draw() {
      const g = this.ctx, t = PV.Game.time;
      // dinding & rak
      g.fillStyle = '#5a3a2a'; g.fillRect(0, 0, 240, 96);
      g.fillStyle = '#6b4632'; for (let x = 0; x < 240; x += 12) g.fillRect(x, 0, 6, 60);
      g.fillStyle = '#3a2418'; g.fillRect(0, 14, 240, 3); g.fillRect(0, 34, 240, 3);
      for (let x = 8; x < 200; x += 18) { g.drawImage(G.icons[['kopi_tubruk', 'teh_manis', 'coklat_panas', 'es_kopi_susu'][(x / 18) % 4 | 0]], x, 0, 16, 16); }
      g.fillStyle = '#ffe27a'; g.globalAlpha = 0.25 + 0.05 * Math.sin(t * 2);
      g.fillRect(100, 18, 40, 14); g.globalAlpha = 1;
      g.drawImage(PV.Paint.textSprite('KAFE SENJA', '#ffe27a', '#3a2418'), 100, 21);
      // pelanggan
      for (let i = 0; i < 3; i++) {
        const s = this.slots[i];
        if (!s) continue;
        const ch = G.chars[s.char];
        const walkIn = s.state === 'walk' ? s.t / 0.8 : 0;
        const leave = (s.state === 'happy' || s.state === 'angry') ? 1 - s.t / 1.2 : 0;
        const x = s.x - 16 + (walkIn - leave) * 90 * (i === 0 ? -1 : 1);
        const moving = s.state === 'walk' || leave > 0;
        const sheet = moving ? ch.walk : ch.idle;
        const f = Math.floor(t * (moving ? 10 : 4)) % (moving ? 6 : 4);
        g.drawImage(sheet, f * 32, (moving ? 2 : 0) * 32, 32, 32, Math.round(x), 38, 32, 32);
        if (s.state === 'wait') {
          // balon pesanan
          const bx = s.x - 12, by = 14 + Math.round(Math.sin(t * 3 + i) * 1);
          g.fillStyle = '#1c0a18'; g.fillRect(bx - 1, by - 1, 26, 22); g.fillStyle = '#fffaf0'; g.fillRect(bx, by, 24, 20);
          g.drawImage(G.icons[s.r.id], bx + 4, by + 1);
          const f2 = s.pat / s.max;
          g.fillStyle = '#3a2418'; g.fillRect(bx + 1, by + 17, 22, 2);
          g.fillStyle = f2 > 0.5 ? '#5fb04a' : f2 > 0.25 ? '#ffcf3a' : '#e8412e'; g.fillRect(bx + 1, by + 17, Math.round(22 * f2), 2);
          if (s.r.special) { g.fillStyle = '#ffcf3a'; g.fillRect(bx + 21, by + 1, 2, 2); }
        } else if (s.state === 'happy') G.draw(g, 'bub_heart', s.x, 36);
        else if (s.state === 'angry') G.draw(g, 'bub_excl', s.x, 36);
      }
      // meja bar
      g.fillStyle = '#8a3625'; g.fillRect(0, 64, 240, 32);
      g.fillStyle = '#ae4924'; g.fillRect(0, 62, 240, 5);
      g.fillStyle = '#c46120'; g.fillRect(0, 62, 240, 1);
      g.fillStyle = '#4a2123'; for (let x = 10; x < 240; x += 30) g.fillRect(x, 70, 1, 26);
      // mesin kopi
      g.fillStyle = '#5a5a6a'; g.fillRect(210, 40, 26, 22); g.fillStyle = '#8a8a9a'; g.fillRect(212, 42, 22, 4); g.fillStyle = '#2a2a38'; g.fillRect(219, 50, 8, 6);
      g.fillStyle = '#e8412e'; g.fillRect(230, 44, 2, 2);
      for (const p of this.steam) { g.globalAlpha = Math.max(0, p.life) * 0.7; g.fillStyle = '#f0f0ff'; g.fillRect(Math.round(p.x), Math.round(p.y), 2, 2); }
      g.globalAlpha = 1;
      // gelas di meja
      this.cup.forEach((id, i) => g.drawImage(G.icons[id], 90 + i * 16, 66));
    },
    end() {
      this.phase = 'done'; this.doneT = 1;
      const bonus = this.served >= 8 ? 20 : 0;
      if (bonus) PV.State.coins(bonus);
      PV.State.log(`Shift kafe: ${this.served} pesanan, ${this.earned + bonus} koin`);
      PV.Audio.sfx(this.served > this.missed ? 'success' : 'fail');
      const stars = this.served >= 10 ? 3 : this.served >= 6 ? 2 : this.served >= 2 ? 1 : 0;
      this.root.innerHTML = `
        <div class="mg-result">
          <div class="stars">${'★'.repeat(stars)}${'☆'.repeat(3 - stars)}</div>
          <h3>Shift selesai!</h3>
          <p>Dilayani: <b>${this.served}</b> · Kabur: <b>${this.missed}</b> · Kombo terbaik: <b>${this.best}</b></p>
          <p>Pendapatan: <b>${this.earned}</b> koin ${bonus ? `+ bonus sibuk <b>${bonus}</b>` : ''}</p>
          <p class="muted">${stars >= 2 ? 'Mbak Sari: "Wah, kamu berbakat jadi barista!"' : 'Mbak Sari: "Latihan lagi ya, pasti makin cepat!"'}</p>
          <div class="row center"><button class="btn green" id="cAgain">Shift lagi</button><button class="btn" id="cExit">Keluar</button></div>
        </div>`;
      this.root.querySelector('#cAgain').onclick = () => this.start();
      this.root.querySelector('#cExit').onclick = () => this.close();
    },
    close() { PV.UI.closeModal(); },
    cleanup() { PV.Game.activeMini = null; PV.Audio.playMusic(PV.Game.world.music); PV.UI.refresh(); },
  };
  Mini.cafe = cafe;
})(window.PV);

</script>
<script>/* js/minigames/fishing.js */
/* Lembah Piksel — Mini-game MEMANCING (di dunia game): lempar, tunggu gigitan, tekan tepat di zona hijau */
(function (PV) {
  'use strict';
  const U = PV.U, G = PV.G, D = PV.DATA;
  const Mini = (PV.Mini = PV.Mini || {});

  const fish = {
    active: false,
    canFish() { return PV.State.has('joran') || PV.State.has('joran_pro'); },
    start(tx, ty) {
      const pl = PV.Game.player;
      this.active = true; PV.Game.activeMini = this;
      pl.frozen = true; pl.moving = false;
      this.pro = PV.State.has('joran_pro');
      this.bait = PV.State.take('umpan', 1);
      this.lucky = PV.S.luck > 0;
      this.state = 'cast'; this.t = 0;
      this.from = { x: pl.x + ({ left: -8, right: 8 }[pl.dir] || 0), y: pl.y - 22 };
      const dv = { down: [0, 1], up: [0, -1], left: [-1, 0], right: [1, 0] }[pl.dir];
      const W = PV.Game.world;
      for (let s = 4; s >= 1; s--) {
        const cx = tx + dv[0] * s, cy = ty + dv[1] * s;
        let ok = true;
        for (let k = 0; k <= s; k++) if (W.get(tx + dv[0] * k, ty + dv[1] * k) !== PV.T.WATER) { ok = false; break; }
        if (ok) { tx = cx; ty = cy; break; }
      }
      this.to = { x: tx * 16 + 8 + U.rand(-3, 3), y: ty * 16 + 9 + U.rand(-2, 2) };
      this.bob = { x: this.from.x, y: this.from.y };
      PV.Audio.sfx('cast');
      if (this.bait) PV.UI.toast('Umpan terpasang (ikan langka lebih sering)', 'umpan');
    },
    pickFish() {
      const mult = (this.bait ? 2.2 : 1) * (this.pro ? 1.8 : 1) * (this.lucky ? 3 : 1);
      const list = D.FISH.map((f) => ({ f, w: f.rare ? f.w * mult : f.junk ? f.w * (this.pro ? 0.5 : 1) : f.id === 'lobster' || f.id === 'gurame' ? f.w * (this.bait ? 1.4 : 1) : f.w }));
      return U.weighted(list).f;
    },
    update(dt) {
      const In = PV.Input, pl = PV.Game.player;
      this.t += dt;
      const press = In.wasPressed('KeyE', 'Space', 'Enter');
      if (In.wasPressed('Escape') && this.state !== 'reel') { this.finish('Kamu menggulung tali.'); return; }
      switch (this.state) {
        case 'cast': {
          const k = Math.min(1, this.t / 0.55);
          this.bob.x = U.lerp(this.from.x, this.to.x, k);
          this.bob.y = U.lerp(this.from.y, this.to.y, k) - Math.sin(k * Math.PI) * 26;
          if (k >= 1) {
            this.state = 'wait'; this.t = 0;
            this.wait = U.rand(1.6, 4.6) * (this.bait ? 0.7 : 1);
            PV.Audio.sfx('splash'); PV.FX.ring(this.to.x, this.to.y, '#d8f0ff', 2, 16, 0.7);
          }
          break;
        }
        case 'wait':
          this.bob.y = this.to.y + Math.round(Math.sin(this.t * 3));
          if (Math.random() < dt * 0.8) { PV.FX.ring(this.to.x, this.to.y + 1, '#d8f0ff', 1, 8, 0.5); }
          if (press) { this.finish('Terlalu cepat! Ikannya kabur.'); PV.Audio.sfx('miss'); return; }
          if (this.t >= this.wait) {
            this.state = 'bite'; this.t = 0; this.fish = this.pickFish();
            PV.Audio.sfx('bite'); PV.FX.ring(this.to.x, this.to.y, '#ffffff', 2, 24, 0.5);
          }
          break;
        case 'bite':
          this.bob.y = this.to.y + 3;
          if (press) { this.beginReel(); return; }
          if (this.t > 0.95) { this.finish('Ikannya lepas... terlalu lambat!'); PV.Audio.sfx('miss'); }
          break;
        case 'reel': this.updateReel(dt, press); break;
        case 'show':
          if (this.t > 1.6 || (press && this.t > 0.4)) this.end();
          break;
      }
      void pl;
    },
    beginReel() {
      this.state = 'reel'; this.t = 0;
      const diff = this.fish.diff;
      this.zoneW = U.clamp(0.34 - diff * 0.22 + (this.pro ? 0.08 : 0), 0.08, 0.4);
      this.speed = 0.55 + diff * 1.25;
      this.cursor = 0; this.dirc = 1; this.hits = 0; this.misses = 0; this.need = this.fish.rare ? 4 : 3;
      this.zone = U.rand(0.1, 0.9 - this.zoneW);
      this.timeLeft = 12;
      const ov = document.getElementById('fishbar');
      ov.classList.remove('hidden');
      ov.innerHTML = `<div class="fb-title">Tekan <kbd>E</kbd>/<kbd>Spasi</kbd> saat penanda di zona hijau!</div>
        <canvas id="fbCanvas" width="160" height="14"></canvas>
        <div class="fb-row"><span id="fbHits"></span><span id="fbTime"></span></div>`;
      this.fbc = U.ctx(document.getElementById('fbCanvas'));
      PV.Audio.sfx('hit');
    },
    updateReel(dt, press) {
      this.cursor += this.dirc * this.speed * dt;
      if (this.fish.diff > 0.5) this.cursor += Math.sin(this.t * 7) * dt * this.fish.diff * 0.35; // ikan sulit bergerak liar
      if (this.cursor > 1) { this.cursor = 1; this.dirc = -1; }
      if (this.cursor < 0) { this.cursor = 0; this.dirc = 1; }
      this.timeLeft -= dt;
      this.bob.y = this.to.y + 2 + Math.round(Math.sin(this.t * 20));
      if (Math.random() < dt * 6) PV.Audio.sfx('reel');
      if (press) {
        if (this.cursor >= this.zone && this.cursor <= this.zone + this.zoneW) {
          this.hits++; PV.Audio.sfx('hit'); PV.FX.burst(this.to.x, this.to.y, ['#d8f0ff', '#ffffff'], 6, 25);
          this.zone = U.rand(0.05, 0.95 - this.zoneW);
          this.speed *= 1.08;
        } else { this.misses++; PV.Audio.sfx('miss'); PV.Game.shake = 1.5; }
      }
      // gambar bar
      const g = this.fbc;
      g.fillStyle = '#1c0a18'; g.fillRect(0, 0, 160, 14);
      g.fillStyle = '#2d6fae'; g.fillRect(1, 1, 158, 12);
      g.fillStyle = '#5fb04a'; g.fillRect(1 + Math.round(this.zone * 158), 1, Math.round(this.zoneW * 158), 12);
      g.fillStyle = '#a5e07a'; g.fillRect(1 + Math.round(this.zone * 158), 1, Math.round(this.zoneW * 158), 2);
      const cx = 1 + Math.round(this.cursor * 157);
      g.fillStyle = '#ffffff'; g.fillRect(cx - 1, 0, 3, 14); g.fillStyle = '#e8412e'; g.fillRect(cx, 2, 1, 10);
      document.getElementById('fbHits').innerHTML = `Tarikan: ${'●'.repeat(this.hits)}${'○'.repeat(Math.max(0, this.need - this.hits))} &nbsp; Gagal: ${'✕'.repeat(this.misses)}${'·'.repeat(Math.max(0, 3 - this.misses))}`;
      document.getElementById('fbTime').textContent = `${Math.max(0, this.timeLeft).toFixed(1)} d`;
      if (this.hits >= this.need) this.caught();
      else if (this.misses >= 3 || this.timeLeft <= 0) { this.hideBar(); this.finish(this.fish.rare ? 'Ikan besar lepas! Sayang sekali...' : 'Ikannya berhasil kabur.'); PV.Audio.sfx('fail'); }
    },
    hideBar() { const ov = document.getElementById('fishbar'); ov.classList.add('hidden'); ov.innerHTML = ''; },
    caught() {
      this.hideBar();
      const f = this.fish, it = D.ITEMS[f.id];
      const first = !PV.S.fishLog[f.id];
      PV.S.fishLog[f.id] = (PV.S.fishLog[f.id] || 0) + 1;
      if (this.lucky) PV.S.luck = 0;
      PV.State.add(f.id, 1, true);
      if (!f.junk) PV.State.stat('fish');
      PV.State.log(`Menangkap ${it.name}`);
      PV.Audio.sfx(f.rare ? 'quest' : f.junk ? 'pop' : 'success');
      this.state = 'show'; this.t = 0; this.shown = f.id;
      PV.UI.toast(`${first ? 'BARU! ' : ''}${it.name} tertangkap!`, f.id);
      PV.FX.sparkle(PV.Game.player.x, PV.Game.player.y - 34, f.rare ? 20 : 8);
      PV.Game.player.hop = 0;
    },
    finish(msg) { if (msg) PV.UI.toast(msg); this.end(); },
    end() {
      this.hideBar();
      this.active = false; this.state = null; this.shown = null;
      PV.Game.activeMini = null; PV.Game.player.frozen = false;
      PV.Game.interactLock = 0.3;
    },
    // gambar tali, pelampung, dan ikan yang diangkat (dipanggil dari render dunia)
    drawWorld(ctx, t) {
      if (!this.active) return;
      const pl = PV.Game.player;
      const tip = { x: pl.x + ({ left: -14, right: 14, up: 4, down: -6 }[pl.dir] || 0), y: pl.y - 26 };
      // joran
      ctx.fillStyle = this.pro ? '#2a6ad0' : '#8a5a30';
      const rx = pl.x + ({ left: -4, right: 4, up: 2, down: -2 }[pl.dir] || 0), ry = pl.y - 14;
      for (let i = 0; i <= 10; i++) ctx.fillRect(Math.round(U.lerp(rx, tip.x, i / 10)), Math.round(U.lerp(ry, tip.y, i / 10)), 1, 1);
      if (this.state === 'show') {
        const k = Math.min(1, this.t / 0.4);
        ctx.drawImage(G.icons[this.shown], Math.round(pl.x - 8), Math.round(pl.y - 44 - k * 6));
        return;
      }
      // tali melengkung
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      const sag = this.state === 'reel' ? 2 : 8;
      for (let i = 0; i <= 24; i++) {
        const u = i / 24;
        ctx.fillRect(Math.round(U.lerp(tip.x, this.bob.x, u)), Math.round(U.lerp(tip.y, this.bob.y, u) + Math.sin(u * Math.PI) * sag), 1, 1);
      }
      G.draw(ctx, 'bobber', this.bob.x, this.bob.y);
      if (this.state === 'bite') G.draw(ctx, 'bub_excl', pl.x, pl.y - 30 + Math.round(Math.sin(t * 20)));
    },
  };
  Mini.fish = fish;
})(window.PV);

</script>
<script>/* js/minigames/library.js */
/* Lembah Piksel — Mini-game PERPUSTAKAAN: kuis cendekia & teka-teki geser bergambar peta */
(function (PV) {
  'use strict';
  const U = PV.U, G = PV.G, D = PV.DATA;
  const Mini = (PV.Mini = PV.Mini || {});
  const icon = (id, c) => PV.UI.icon(id, c);

  // ======================= KUIS =======================
  const quiz = {
    open() {
      this.root = PV.UI.openModal(icon('lencana') + ' Ujian Cendekia Bu Laras', '', { wide: true, locked: true, kind: 'mini', onClose: () => this.cleanup() });
      PV.Game.activeMini = this;
      this.qs = U.shuffle(D.QUIZ.slice()).slice(0, 5);
      this.i = 0; this.score = 0; this.phase = 'q';
      this.show();
    },
    show() {
      const q = this.qs[this.i];
      this.time = 15; this.phase = 'q';
      this.order = U.shuffle([0, 1, 2, 3]);
      this.root.innerHTML = `
        <div class="quiz">
          <div class="qhead"><span>Soal ${this.i + 1}/5</span><span>Benar: <b>${this.score}</b></span></div>
          <div class="qtimer"><div class="fill"></div></div>
          <div class="qq">${U.esc(q.q)}</div>
          <div class="qans">${this.order.map((oi, k) => `<button class="btn ans" data-k="${k}"><kbd>${k + 1}</kbd> ${U.esc(q.a[oi])}</button>`).join('')}</div>
          <div class="qfb"></div>
        </div>`;
      this.root.querySelectorAll('.ans').forEach((b) => { b.onclick = () => this.answer(+b.dataset.k); });
    },
    answer(k) {
      if (this.phase !== 'q') return;
      this.phase = 'fb'; this.fbT = 1.5;
      const q = this.qs[this.i];
      const correctK = this.order.indexOf(q.c);
      const ok = k === correctK;
      if (ok) { this.score++; PV.Audio.sfx('success'); } else PV.Audio.sfx('fail');
      const btns = this.root.querySelectorAll('.ans');
      btns.forEach((b, i) => { b.disabled = true; if (i === correctK) b.classList.add('right'); else if (i === k) b.classList.add('wrong'); });
      this.root.querySelector('.qfb').textContent = k < 0 ? `Waktu habis! Jawaban: ${q.a[q.c]}` : ok ? 'Benar! Hebat!' : `Kurang tepat. Jawaban: ${q.a[q.c]}`;
    },
    update(dt) {
      const In = PV.Input;
      if (this.phase === 'q') {
        this.time -= dt;
        const f = this.root.querySelector('.qtimer .fill'); if (f) f.style.width = Math.max(0, this.time / 15 * 100) + '%';
        for (let k = 0; k < 4; k++) if (In.wasPressed('Digit' + (k + 1))) this.answer(k);
        if (this.time <= 0) this.answer(-1);
        if (In.wasPressed('Escape')) this.close();
      } else if (this.phase === 'fb') {
        this.fbT -= dt;
        if (this.fbT <= 0 || (In.wasPressed('Enter', 'Space') && this.fbT < 1.2)) { this.i++; if (this.i < 5) this.show(); else this.result(); }
      } else if (this.phase === 'end') {
        if (In.wasPressed('Escape', 'Enter')) this.close();
      }
    },
    result() {
      this.phase = 'end';
      const S = PV.S, pass = this.score >= 4;
      S.stats.quizBest = Math.max(S.stats.quizBest, this.score);
      const coins = this.score * 8;
      if (coins) PV.State.coins(coins, `kuis (${this.score}/5)`);
      if (pass && !S.flags.quizPassed) PV.State.flag('quizPassed');
      PV.Audio.sfx(pass ? 'quest' : 'cancel');
      this.root.innerHTML = `<div class="mg-result">
        <div class="stars">${'★'.repeat(this.score)}${'☆'.repeat(5 - this.score)}</div>
        <h3>${pass ? 'LULUS! Selamat, Cendekia!' : 'Belum lulus'}</h3>
        <p>Skor: <b>${this.score}/5</b> · Hadiah: <b>${coins}</b> koin</p>
        <p class="muted">${pass ? 'Bu Laras: "Kamu benar-benar rajin membaca!"' : 'Bu Laras: "Coba baca buku-buku di rak dulu, lalu ulangi ya."'}</p>
        <div class="row center"><button class="btn green" id="qAgain">Ulangi kuis</button><button class="btn" id="qExit">Selesai</button></div></div>`;
      this.root.querySelector('#qAgain').onclick = () => { this.qs = U.shuffle(D.QUIZ.slice()).slice(0, 5); this.i = 0; this.score = 0; this.show(); };
      this.root.querySelector('#qExit').onclick = () => this.close();
    },
    close() { PV.UI.closeModal(); },
    cleanup() { PV.Game.activeMini = null; PV.UI.refresh(); },
  };
  Mini.quiz = quiz;

  // ======================= TEKA-TEKI GESER 3x3 =======================
  function puzzleImage() {
    const P = PV.Paint.P, PAL = PV.PAL;
    const p = P(96, 96);
    p.rect(0, 0, 96, 96, '#f2deaa');
    p.speckle(0, 0, 96, 96, ['#e8cf94', '#f7e8c0'], 0.2, 4);
    p.frame(0, 0, 96, 96, '#8a6a4a'); p.frame(2, 2, 92, 92, '#c8a86a');
    // danau
    p.ellipse(74, 18, 14, 9, '#7ab8e0'); p.ellipse(74, 18, 11, 6, '#9fd0f0');
    // pohon-pohon hutan
    const r = U.rng(5);
    for (let i = 0; i < 26; i++) { const x = r.int(6, 50), y = r.int(8, 60); if (Math.hypot(x - 28, y - 34) < 10) continue; p.ellipse(x, y, 3, 3, '#3f8a3a'); p.px(x - 1, y - 1, '#6ebd3c'); p.vline(x, y + 3, 2, '#6b3a1e'); }
    // jalan setapak
    for (let i = 0; i < 40; i++) p.px(30 + Math.round(Math.sin(i * 0.3) * 3), 40 + i, '#a8784a');
    for (let i = 0; i < 50; i++) p.px(30 + i, 82, '#a8784a');
    // api unggun & batu & X
    p.rect(27, 33, 4, 3, '#e8412e'); p.px(28, 32, '#ffcf3a');
    p.ellipse(19, 26, 4, 3, '#8a8a8a'); p.ellipse(19, 25, 3, 1, '#3f9a3a');
    p.line(14, 19, 22, 27, '#d8343a'); p.line(22, 19, 14, 27, '#d8343a'); p.line(15, 19, 23, 27, '#d8343a'); p.line(23, 19, 15, 27, '#d8343a');
    // rumah & kompas
    p.rect(60, 70, 10, 7, '#c0392b'); p.rect(61, 74, 8, 6, '#f7dbc6'); p.rect(78, 66, 12, 8, '#34446e'); p.rect(79, 70, 10, 7, '#cdbf9b');
    p.ellipse(84, 86, 5, 5, '#c8a86a'); p.vline(84, 81, 11, '#8a6a4a'); p.hline(79, 86, 11, '#8a6a4a'); p.px(84, 80, '#d8343a');
    p.g.drawImage(PV.Paint.textSprite('HUTAN', '#6b3a1e', null), 6, 64);
    void PAL;
    return p.c;
  }
  const puzzle = {
    open() {
      if (!this.img) this.img = puzzleImage();
      this.root = PV.UI.openModal('🧩 Teka-teki Geser: Peta Lama', '', { locked: true, kind: 'mini', onClose: () => this.cleanup() });
      PV.Game.activeMini = this;
      this.root.innerHTML = `<div class="puzzle">
        <p class="muted center">Susun kembali potongan peta. Klik potongan di sebelah ruang kosong, atau pakai tombol panah.</p>
        <canvas id="pzC" width="96" height="96"></canvas>
        <div class="row center"><span>Langkah: <b id="pzMoves">0</b></span><button class="btn" id="pzShuffle">Acak ulang</button><button class="btn" id="pzExit">Keluar</button></div></div>`;
      this.c = this.root.querySelector('#pzC'); this.g = U.ctx(this.c);
      this.c.onclick = (e) => {
        const r = this.c.getBoundingClientRect();
        const x = Math.floor(((e.clientX - r.left) / r.width) * 3), y = Math.floor(((e.clientY - r.top) / r.height) * 3);
        this.clickTile(x, y);
      };
      this.root.querySelector('#pzShuffle').onclick = () => this.shuffle();
      this.root.querySelector('#pzExit').onclick = () => this.close();
      this.shuffle();
    },
    shuffle() {
      this.b = [0, 1, 2, 3, 4, 5, 6, 7, 8]; // 8 = kosong
      let blank = 8, last = -1;
      for (let i = 0; i < 80; i++) {
        const nb = this.neighbors(blank).filter((n) => n !== last);
        const n = U.choice(nb);
        [this.b[blank], this.b[n]] = [this.b[n], this.b[blank]];
        last = blank; blank = n;
      }
      if (this.solved()) return this.shuffle();
      this.moves = 0; this.done = false; this.anim = null;
      this.draw();
    },
    neighbors(i) { const x = i % 3, y = (i / 3) | 0, r = []; if (x > 0) r.push(i - 1); if (x < 2) r.push(i + 1); if (y > 0) r.push(i - 3); if (y < 2) r.push(i + 3); return r; },
    solved() { return this.b.every((v, i) => v === i); },
    clickTile(x, y) {
      if (this.done) return;
      const i = y * 3 + x, blank = this.b.indexOf(8);
      if (!this.neighbors(blank).includes(i)) { PV.Audio.sfx('error'); return; }
      [this.b[blank], this.b[i]] = [this.b[i], this.b[blank]];
      this.moves++; PV.Audio.sfx('slide');
      this.draw();
      if (this.solved()) this.win();
    },
    win() {
      this.done = true;
      PV.Audio.sfx('quest');
      const S = PV.S;
      this.draw(true);
      const first = !S.flags.puzzleSolved;
      S.flags.puzzleSolved = true;
      if (first) { PV.State.add('peta', 1); PV.State.coins(30, 'teka-teki peta'); if (!S.flags.treasureKnown) PV.State.flag('treasureKnown'); }
      else PV.State.coins(10, 'teka-teki peta');
      const msg = document.createElement('p');
      msg.className = 'center good';
      msg.innerHTML = `Selesai dalam <b>${this.moves}</b> langkah! ${first ? 'Kamu mendapat <b>Peta Harta</b>: tanda X di batu berlumut dekat api unggun hutan!' : '+10 koin'}`;
      this.root.querySelector('.puzzle').appendChild(msg);
    },
    draw(full) {
      const g = this.g;
      g.fillStyle = '#3a2418'; g.fillRect(0, 0, 96, 96);
      for (let i = 0; i < 9; i++) {
        const v = this.b[i];
        if (v === 8 && !full) continue;
        const sx = (v % 3) * 32, sy = ((v / 3) | 0) * 32, dx = (i % 3) * 32, dy = ((i / 3) | 0) * 32;
        g.drawImage(this.img, sx, sy, 32, 32, dx, dy, 32, 32);
        if (!full) { g.fillStyle = 'rgba(28,10,24,0.6)'; g.fillRect(dx, dy, 32, 1); g.fillRect(dx, dy, 1, 32); }
      }
    },
    update() {
      const In = PV.Input;
      if (In.wasPressed('Escape')) { this.close(); return; }
      if (this.done) { if (In.wasPressed('Enter', 'Space')) this.close(); return; }
      const blank = this.b.indexOf(8), bx = blank % 3, by = (blank / 3) | 0;
      // panah: geser potongan KE arah ruang kosong
      if (In.wasPressed('ArrowLeft', 'KeyA') && bx < 2) this.clickTile(bx + 1, by);
      if (In.wasPressed('ArrowRight', 'KeyD') && bx > 0) this.clickTile(bx - 1, by);
      if (In.wasPressed('ArrowUp', 'KeyW') && by < 2) this.clickTile(bx, by + 1);
      if (In.wasPressed('ArrowDown', 'KeyS') && by > 0) this.clickTile(bx, by - 1);
      const m = this.root.querySelector('#pzMoves'); if (m) m.textContent = this.moves;
    },
    close() { PV.UI.closeModal(); },
    cleanup() { PV.Game.activeMini = null; PV.UI.refresh(); },
  };
  Mini.puzzle = puzzle;
})(window.PV);

</script>
<script>/* js/minigames/shop.js */
/* Lembah Piksel — TOKO (jual-beli) & PAPAN PENGUMUMAN (permintaan harian warga) */
(function (PV) {
  'use strict';
  const U = PV.U, D = PV.DATA;
  const Mini = (PV.Mini = PV.Mini || {});
  const icon = (id, c) => PV.UI.icon(id, c);
  const St = () => PV.State;

  const STOCK = ['bibit_stroberi', 'bibit_daun_bawang', 'bibit_kentang', 'bibit_bawang', 'umpan', 'besi', 'kaca'];

  const shop = {
    open(tab = 'beli') {
      this.root = PV.UI.openModal(icon('koin') + ' Toko Serba Ada Pak Darto', '', { wide: true, kind: 'mini', onClose: () => this.cleanup() });
      PV.Game.activeMini = this;
      this.tab = tab;
      this.render();
    },
    render() {
      const S = PV.S;
      const wrap = document.createElement('div');
      wrap.className = 'shop';
      wrap.innerHTML = `<div class="tabs"><button data-t="beli" class="${this.tab === 'beli' ? 'on' : ''}">Beli</button><button data-t="jual" class="${this.tab === 'jual' ? 'on' : ''}">Jual</button>
        <span class="wallet">${icon('koin')} <b>${U.fmt(S.coins)}</b></span></div><div class="slist"></div>`;
      const list = wrap.querySelector('.slist');
      if (this.tab === 'beli') {
        for (const id of STOCK) {
          const it = D.ITEMS[id];
          const row = document.createElement('div');
          row.className = 'srow';
          row.innerHTML = `${icon(id, 'bigico')}<div class="sinfo"><b>${U.esc(it.name)}</b><span class="muted">${U.esc(it.desc)}</span><span class="muted">Dimiliki: ${St().count(id)}</span></div>
            <div class="sprice">${it.buy}${icon('koin')}</div><button class="btn green" data-n="1">Beli 1</button><button class="btn" data-n="5">×5</button>`;
          row.querySelectorAll('button').forEach((b) => {
            const n = +b.dataset.n; const cost = it.buy * n;
            b.disabled = S.coins < cost;
            b.onclick = () => { if (S.coins < cost) return; St().coins(-cost); St().add(id, n, true); PV.Audio.sfx('coin'); PV.UI.toast(`Membeli ${n} ${it.name}`, id); this.render(); };
          });
          list.appendChild(row);
        }
      } else {
        const ids = Object.keys(S.inv).filter((id) => D.ITEMS[id] && D.ITEMS[id].price > 0 && S.inv[id] > 0);
        if (!ids.length) list.innerHTML = '<p class="muted center">Belum ada barang yang bisa dijual. Panen, mancing, atau cari bahan di hutan!</p>';
        let total = 0;
        for (const id of ids) {
          const it = D.ITEMS[id], n = S.inv[id];
          total += it.price * n;
          const row = document.createElement('div');
          row.className = 'srow';
          row.innerHTML = `${icon(id, 'bigico')}<div class="sinfo"><b>${U.esc(it.name)}</b><span class="muted">${U.esc(it.cat)} · dimiliki ${n}</span></div>
            <div class="sprice">${it.price}${icon('koin')}</div><button class="btn" data-n="1">Jual 1</button><button class="btn green" data-n="${n}">Semua</button>`;
          row.querySelectorAll('button').forEach((b) => {
            b.onclick = () => { const k = Math.min(+b.dataset.n, St().count(id)); if (!k) return; St().take(id, k); St().coins(it.price * k, `jual ${k} ${it.name}`); PV.Audio.sfx('coin'); this.render(); };
          });
          list.appendChild(row);
        }
        if (ids.length) {
          const all = document.createElement('div');
          all.className = 'row center';
          all.innerHTML = `<button class="btn green">Jual semua hasil (${total} koin)</button>`;
          all.querySelector('button').onclick = () => { for (const id of ids) { const k = St().count(id); St().take(id, k); } St().coins(total, 'jual semua di toko'); PV.Audio.sfx('coin'); this.render(); };
          list.appendChild(all);
        }
      }
      wrap.querySelectorAll('.tabs button').forEach((b) => { b.onclick = () => { this.tab = b.dataset.t; PV.Audio.sfx('blip'); this.render(); }; });
      this.root.innerHTML = ''; this.root.appendChild(wrap);
    },
    update() { if (PV.Input.wasPressed('Escape')) PV.UI.closeModal(); },
    cleanup() { PV.Game.activeMini = null; PV.UI.refresh(); },
  };
  Mini.shop = shop;

  const board = {
    open() {
      this.root = PV.UI.openModal(icon('gulungan') + ' Papan Pengumuman', '', { wide: true, kind: 'mini', onClose: () => this.cleanup() });
      PV.Game.activeMini = this;
      this.render();
    },
    render() {
      const d = PV.Quests.ensureDaily();
      const html = [`<p class="muted center">Permintaan warga untuk <b>Hari ${PV.S.day}</b>. Berganti setiap kamu tidur.</p><div class="reqs">`];
      d.reqs.forEach((r, i) => {
        const it = D.ITEMS[r.item], have = St().count(r.item);
        html.push(`<div class="req ${r.done ? 'done' : ''}"><div class="pin"></div><b>${U.esc(r.who)}</b><div class="rq">${icon(r.item, 'bigico')}<span>${r.n}× ${U.esc(it.name)}</span></div>
          <div class="muted">Kamu punya: ${have}</div><div class="rw">Hadiah: ${r.pay}${icon('koin')}</div>
          ${r.done ? '<div class="stamp">SELESAI</div>' : `<button class="btn green" data-i="${i}" ${have >= r.n ? '' : 'disabled'}>Kirim</button>`}</div>`);
      });
      html.push('</div>');
      this.root.innerHTML = html.join('');
      this.root.querySelectorAll('button[data-i]').forEach((b) => {
        b.onclick = () => {
          const r = d.reqs[+b.dataset.i];
          if (r.done || !St().take(r.item, r.n)) return;
          r.done = true; St().coins(r.pay, `permintaan ${r.who}`); St().stat('requests'); PV.Audio.sfx('quest');
          PV.UI.toast(`${r.who}: "Terima kasih banyak!"`, 'hati');
          this.render();
        };
      });
    },
    update() { if (PV.Input.wasPressed('Escape')) PV.UI.closeModal(); },
    cleanup() { PV.Game.activeMini = null; PV.UI.refresh(); },
  };
  Mini.board = board;
})(window.PV);

</script>
<script>/* js/minigames/workshop.js */
/* Lembah Piksel — BENGKEL: daftar resep + mini-game TEMPA (ikuti urutan panah sebelum waktu habis)
   + PERAH SUSU di peternakan (tekan kiri-kanan bergantian) */
(function (PV) {
  'use strict';
  const U = PV.U, G = PV.G, D = PV.DATA;
  const Mini = (PV.Mini = PV.Mini || {});
  const icon = (id, c) => PV.UI.icon(id, c);
  const St = () => PV.State;
  const ARROWS = [{ k: 'ArrowLeft', a: 'KeyA', s: '←' }, { k: 'ArrowUp', a: 'KeyW', s: '↑' }, { k: 'ArrowRight', a: 'KeyD', s: '→' }, { k: 'ArrowDown', a: 'KeyS', s: '↓' }];

  const craft = {
    open() {
      this.root = PV.UI.openModal(icon('besi') + ' Bengkel Mas Joko', '', { wide: true, locked: true, kind: 'mini', onClose: () => this.cleanup() });
      PV.Game.activeMini = this;
      this.list();
    },
    canMake(r) { return Object.keys(r.need).every((k) => St().has(k, r.need[k])); },
    list() {
      this.phase = 'list';
      const rows = D.CRAFT.map((r, i) => {
        const it = D.ITEMS[r.id];
        const owned = r.tool && St().has(r.id);
        const needs = Object.keys(r.need).map((k) => `<span class="need ${St().has(k, r.need[k]) ? 'ok' : 'no'}">${icon(k)} ${St().count(k)}/${r.need[k]}</span>`).join('');
        return `<div class="srow">${icon(r.id, 'bigico')}<div class="sinfo"><b>${U.esc(it.name)}</b><span class="muted">${U.esc(r.desc)}</span><div class="needs">${needs}</div></div>
          <button class="btn green" data-i="${i}" ${this.canMake(r) && !owned ? '' : 'disabled'}>${owned ? 'Sudah punya' : 'Tempa!'}</button></div>`;
      }).join('');
      this.root.innerHTML = `<div class="craft"><p class="muted center">Pilih barang lalu tempa: tekan panah sesuai urutan sebelum waktu habis. Salah tekan = ulang dari awal.</p>
        <div class="slist">${rows}</div><div class="row center"><button class="btn" id="kExit">Keluar</button></div></div>`;
      this.root.querySelectorAll('button[data-i]').forEach((b) => { b.onclick = () => this.forge(D.CRAFT[+b.dataset.i]); });
      this.root.querySelector('#kExit').onclick = () => this.close();
    },
    forge(r) {
      this.phase = 'forge'; this.r = r;
      this.seq = Array.from({ length: r.seq }, () => U.randInt(0, 3));
      this.pos = 0; this.time = r.seq * 1.25 + 2.5; this.maxTime = this.time; this.sparks = []; this.hammer = 0; this.fails = 0;
      this.root.innerHTML = `<div class="forge">
        <div class="fhead">${icon(r.id, 'bigico')}<b>Menempa ${U.esc(D.ITEMS[r.id].name)}</b></div>
        <canvas id="fgC" width="120" height="60"></canvas>
        <div class="seq">${this.seq.map((s, i) => `<span class="arr" data-i="${i}">${ARROWS[s].s}</span>`).join('')}</div>
        <div class="qtimer"><div class="fill"></div></div>
        <div class="arrowpad">${ARROWS.map((a, i) => `<button class="btn" data-a="${i}">${a.s}</button>`).join('')}</div>
        <p class="muted center">Gunakan tombol panah / WASD, atau klik tombol di atas.</p></div>`;
      this.c = U.ctx(this.root.querySelector('#fgC'));
      this.root.querySelectorAll('[data-a]').forEach((b) => { b.onclick = () => this.press(+b.dataset.a); });
      PV.Audio.playMusic('main');
      this.paint();
    },
    press(a) {
      if (this.phase !== 'forge') return;
      if (a === this.seq[this.pos]) {
        this.pos++; this.hammer = 0.18; PV.Audio.sfx('hammer');
        for (let i = 0; i < 10; i++) this.sparks.push({ x: 60, y: 28, vx: U.rand(-40, 40), vy: U.rand(-50, -10), life: 0.5 });
        if (this.pos >= this.seq.length) this.success();
      } else {
        this.pos = 0; this.fails++; PV.Audio.sfx('error');
        this.root.querySelector('.seq').classList.remove('shake'); void this.root.querySelector('.seq').offsetWidth; this.root.querySelector('.seq').classList.add('shake');
      }
      this.paint();
    },
    paint() {
      this.root.querySelectorAll('.arr').forEach((e, i) => { e.classList.toggle('done', i < this.pos); e.classList.toggle('cur', i === this.pos); });
    },
    success() {
      this.phase = 'result';
      const r = this.r;
      for (const k in r.need) St().take(k, r.need[k]);
      St().add(r.id, 1, true); St().stat('crafted');
      if (r.id === 'lentera') St().flag('craftedLentera');
      St().log(`Merakit ${D.ITEMS[r.id].name}`);
      PV.Audio.sfx('quest');
      setTimeout(() => {
        this.root.innerHTML = `<div class="mg-result">${icon(r.id, 'hugeico')}<h3>${U.esc(D.ITEMS[r.id].name)} jadi!</h3>
          <p class="muted">${r.fails ? '' : ''}Mas Joko: "${this.fails ? 'Lumayan, makin lama makin luwes!' : 'Tempaan sempurna! Kamu berbakat!'}"</p>
          <div class="row center"><button class="btn green" id="kBack">Rakit lagi</button><button class="btn" id="kExit">Keluar</button></div></div>`;
        this.root.querySelector('#kBack').onclick = () => { PV.Audio.playMusic(PV.Game.world.music); this.list(); };
        this.root.querySelector('#kExit').onclick = () => this.close();
      }, 450);
    },
    fail() {
      this.phase = 'result';
      PV.Audio.sfx('fail');
      this.root.innerHTML = `<div class="mg-result"><h3>Besinya keburu dingin!</h3><p class="muted">Bahan tidak terpakai. Coba lagi dengan ritme lebih cepat.</p>
        <div class="row center"><button class="btn green" id="kRetry">Coba lagi</button><button class="btn" id="kBack">Kembali</button></div></div>`;
      this.root.querySelector('#kRetry').onclick = () => this.forge(this.r);
      this.root.querySelector('#kBack').onclick = () => { PV.Audio.playMusic(PV.Game.world.music); this.list(); };
    },
    update(dt) {
      const In = PV.Input;
      if (this.phase === 'forge') {
        ARROWS.forEach((a, i) => { if (In.wasPressed(a.k, a.a)) this.press(i); });
        this.time -= dt; this.hammer = Math.max(0, this.hammer - dt);
        const f = this.root.querySelector('.qtimer .fill'); if (f) f.style.width = Math.max(0, this.time / this.maxTime * 100) + '%';
        for (const s of this.sparks) { s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 160 * dt; s.life -= dt; }
        this.sparks = this.sparks.filter((s) => s.life > 0);
        this.drawForge();
        if (this.time <= 0 && this.phase === 'forge') this.fail();
        if (In.wasPressed('Escape')) { PV.Audio.playMusic(PV.Game.world.music); this.list(); }
      } else if (In.wasPressed('Escape')) this.close();
    },
    drawForge() {
      const g = this.c, t = PV.Game.time;
      g.fillStyle = '#2a1a14'; g.fillRect(0, 0, 120, 60);
      g.fillStyle = '#ff9a1a'; g.globalAlpha = 0.15 + 0.05 * Math.sin(t * 8); g.fillRect(0, 0, 120, 60); g.globalAlpha = 1;
      g.save(); g.scale(2, 2); G.draw(g, 'anvil', 30, 29); g.restore();
      const hot = this.pos / this.seq.length;
      g.fillStyle = hot > 0.6 ? '#ffcf3a' : '#c8641a'; g.fillRect(48, 30, 22, 4); g.fillStyle = '#fff0a0'; g.fillRect(50, 30, Math.round(16 * hot) + 2, 1);
      // palu
      const ang = this.hammer > 0 ? 0.15 : -0.9;
      g.save(); g.translate(92, 30); g.rotate(ang);
      g.fillStyle = '#8a5a30'; g.fillRect(-22, -2, 22, 3); g.fillStyle = '#5a5a6a'; g.fillRect(-28, -6, 8, 10); g.fillStyle = '#8a8a9a'; g.fillRect(-28, -6, 8, 2);
      g.restore();
      for (const s of this.sparks) { g.fillStyle = s.life > 0.25 ? '#ffe27a' : '#ff9a1a'; g.fillRect(Math.round(s.x), Math.round(s.y), 1, 1); }
    },
    close() { PV.UI.closeModal(); },
    cleanup() { PV.Game.activeMini = null; PV.Audio.playMusic(PV.Game.world.music); PV.UI.refresh(); },
  };
  Mini.craft = craft;

  // ======================= PERAH SUSU =======================
  const milk = {
    open(cow) {
      this.cow = cow;
      this.root = PV.UI.openModal(icon('susu') + ' Perah Susu', '', { locked: true, kind: 'mini', onClose: () => this.cleanup() });
      PV.Game.activeMini = this;
      this.phase = 'ready'; this.fill = 0; this.last = -1; this.time = 7; this.need = 20;
      this.root.innerHTML = `<div class="milk"><canvas id="mkC" width="96" height="64"></canvas>
        <p class="center">Tekan <kbd>←</kbd> dan <kbd>→</kbd> (atau <kbd>A</kbd>/<kbd>D</kbd>) <b>bergantian</b> secepatnya!</p>
        <div class="qtimer"><div class="fill"></div></div>
        <div class="row center"><button class="btn" data-s="0">← Kiri</button><button class="btn" data-s="1">Kanan →</button></div></div>`;
      this.g = U.ctx(this.root.querySelector('#mkC'));
      this.root.querySelectorAll('[data-s]').forEach((b) => { b.onclick = () => this.squeeze(+b.dataset.s); });
      this.phase = 'play';
      this.draw();
    },
    squeeze(side) {
      if (this.phase !== 'play') return;
      if (side === this.last) { PV.Audio.sfx('tick'); return; }
      this.last = side; this.fill++; this.squirt = 0.12; this.side = side;
      PV.Audio.sfx('milk');
      if (this.fill >= this.need) this.done(true);
    },
    update(dt) {
      const In = PV.Input;
      if (this.phase === 'play') {
        if (In.wasPressed('ArrowLeft', 'KeyA')) this.squeeze(0);
        if (In.wasPressed('ArrowRight', 'KeyD')) this.squeeze(1);
        this.time -= dt; this.squirt = Math.max(0, (this.squirt || 0) - dt);
        const f = this.root.querySelector('.qtimer .fill'); if (f) f.style.width = Math.max(0, this.time / 7 * 100) + '%';
        if (this.time <= 0) this.done(false);
        if (In.wasPressed('Escape')) this.close();
        this.draw();
      } else if (In.wasPressed('Escape', 'Enter', 'Space') && this.endT <= 0) this.close();
      if (this.endT > 0) this.endT -= dt;
    },
    draw() {
      const g = this.g;
      g.fillStyle = '#b8e0a0'; g.fillRect(0, 0, 96, 64);
      g.fillStyle = '#e8c84a'; g.fillRect(0, 50, 96, 14);
      g.save(); g.scale(2, 2); G.draw(g, 'cow_female_1_0', 24, 30); g.restore();
      // ember
      g.fillStyle = '#1c0a18'; g.fillRect(63, 33, 22, 24); g.fillStyle = '#9aa4b0'; g.fillRect(64, 34, 20, 22);
      const lv = Math.round((this.fill / this.need) * 20);
      g.fillStyle = '#ffffff'; g.fillRect(64, 56 - lv, 20, lv);
      g.fillStyle = '#c8d0d8'; g.fillRect(64, 34, 20, 2);
      if (this.squirt > 0) { g.fillStyle = '#ffffff'; for (let i = 0; i < 5; i++) g.fillRect(52 + i * 3 + (this.side ? 2 : 0), 40 + i * 2, 2, 2); }
    },
    done(ok) {
      this.phase = 'end'; this.endT = 0.6;
      if (ok) {
        const n = this.time > 3 ? 2 : 1;
        St().add('susu', n); St().stat('milk'); this.cow.cooldown = 90; this.cow.heart = 1;
        PV.Audio.sfx('success'); PV.Audio.sfx('moo');
        this.root.querySelector('.milk p').innerHTML = `<b>Berhasil!</b> +${n} Susu Segar ${n > 1 ? '(cepat sekali!)' : ''}`;
      } else {
        this.cow.cooldown = 15; PV.Audio.sfx('fail');
        this.root.querySelector('.milk p').innerHTML = '<b>Waktu habis!</b> Sapinya bosan menunggu. Coba lagi sebentar lagi.';
      }
      setTimeout(() => { if (PV.Game.activeMini === this) this.close(); }, 1600);
    },
    close() { PV.UI.closeModal(); },
    cleanup() { PV.Game.activeMini = null; PV.UI.refresh(); },
  };
  Mini.milk = milk;
})(window.PV);

</script>
<script>/* js/main.js */
/* Lembah Piksel — game loop utama, kamera, interaksi, transisi peta, layar judul */
(function (PV) {
  'use strict';
  const U = PV.U, G = PV.G, T = PV.T;

  const Game = {
    started: false, time: 0, worlds: {}, world: null, player: null,
    cam: { x: 0, y: 0, w: 480, h: 270 }, scale: 3,
    activeMini: null, interactLock: 0, shake: 0, fading: null, focus: null,
    currentArea: null, lastDesaPos: null, festivalUntil: 0, festivalStart: 0, saveT: 0, fwT: 0,

    async boot() {
      this.canvas = document.getElementById('game');
      this.ctx = U.ctx(this.canvas);
      PV.Input.init();
      this.resize();
      window.addEventListener('resize', () => this.resize());
      setLoading(0.15, 'Memuat sprite sheet...');
      await G.load();
      setLoading(0.4, 'Menggambar tile & ikon prosedural...');
      await tick();
      PV.Gen.tiles(); PV.Gen.ui(); PV.Gen.icons();
      setLoading(0.6, 'Membangun gedung & dekorasi...');
      await tick();
      PV.Gen.props(); PV.Gen.buildings();
      G.icons.jamur_bakar = U.recolor(G.icons.jamur, { '216,52,58': [138, 74, 36], '160,30,40': [96, 48, 22], '255,255,255': [240, 200, 140] });
      G.defCanvas('item_journal', G.icons.buku, 8, 14);
      PV.Maps.makeCharacters();
      setLoading(0.8, 'Menata lembah...');
      await tick();
      PV.UI.init();
      this.buildWorlds();
      this.setWorld('desa', 55 * 16, 46 * 16, 'down', true);
      this.cam.x = 40 * 16; this.cam.y = 30 * 16;
      setLoading(1, 'Siap!');
      this.setupTitle();
      let last = performance.now();
      const loop = (ts) => {
        const dt = Math.min(0.05, (ts - last) / 1000); last = ts;
        try { this.update(dt); this.render(); } catch (e) { console.error(e); }
        PV.Input.endFrame();
        requestAnimationFrame(loop);
      };
      requestAnimationFrame(loop);
    },

    resize() {
      const w = window.innerWidth, h = window.innerHeight;
      this.scale = U.clamp(Math.floor(Math.min(w / 420, h / 250)), 2, 6);
      const cw = Math.ceil(w / this.scale), ch = Math.ceil(h / this.scale);
      this.canvas.width = cw; this.canvas.height = ch;
      this.canvas.style.width = cw * this.scale + 'px'; this.canvas.style.height = ch * this.scale + 'px';
      this.ctx.imageSmoothingEnabled = false;
      this.cam.w = cw; this.cam.h = ch;
      document.documentElement.style.setProperty('--px', this.scale + 'px');
    },

    buildWorlds() {
      PV.FX.clear();
      this.worlds = { desa: PV.Maps.buildDesa(), rumah: PV.Maps.buildRumah(), pustaka: PV.Maps.buildPustaka() };
      this.player = new PV.Ent.Player(0, 0);
    },
    setWorld(id, x, y, dir, snap) {
      if (this.world) { this.world.objects = this.world.objects.filter((o) => o !== this.player); if (this.world.id === 'desa') this.lastDesaPos = { x: this.player.x, y: this.player.y }; }
      this.world = this.worlds[id];
      this.player.x = x; this.player.y = y; this.player.dir = dir || 'down';
      this.world.add(this.player);
      this.player.frozen = false;
      if (snap !== false) this.snapCam();
      if (this.started) PV.Audio.playMusic(this.festivalUntil > this.time && id === 'desa' ? 'pesta' : this.world.music);
      this.currentArea = null;
    },
    changeMap(id, x, y, dir) {
      if (this.fading) return;
      PV.Audio.sfx('door');
      this.fade(() => this.setWorld(id, x, y, dir));
    },
    fade(cb) { this.fading = { t: 0, cb, called: false }; },
    snapCam() {
      const c = this.cam, w = this.world;
      c.x = this.player.x - c.w / 2; c.y = this.player.y - 16 - c.h / 2;
      this.clampCam();
    },
    clampCam() {
      const c = this.cam, w = this.world, W = w.w * 16, H = w.h * 16;
      c.x = W <= c.w ? (W - c.w) / 2 : U.clamp(c.x, 0, W - c.w);
      c.y = H <= c.h ? (H - c.h) / 2 : U.clamp(c.y, 0, H - c.h);
    },
    nearSfx(e, name) { if (this.started && e.world === this.world && U.dist(e.x, e.y, this.player.x, this.player.y) < 120) PV.Audio.sfx(name); },

    // ---------- layar judul ----------
    setupTitle() {
      const t = document.getElementById('title');
      const logo = document.getElementById('logo');
      const s1 = PV.Paint.textSprite('LEMBAH', '#ffd23f', '#3a1a0a'), s2 = PV.Paint.textSprite('PIKSEL', '#7ad8ff', '#0a1a3a');
      const c = U.canvas(Math.max(s1.width, s2.width) + 2, 16), g = U.ctx(c);
      g.drawImage(s1, Math.floor((c.width - s1.width) / 2), 0); g.drawImage(s2, Math.floor((c.width - s2.width) / 2), 8);
      logo.width = c.width; logo.height = c.height; U.ctx(logo).drawImage(c, 0, 0);
      const cont = document.getElementById('btnContinue');
      if (PV.State.hasSave()) cont.style.display = ''; else cont.style.display = 'none';
      document.getElementById('btnNew').onclick = () => {
        if (PV.State.hasSave() && !this.confirmNew) { this.confirmNew = true; document.getElementById('btnNew').textContent = 'Yakin? Simpanan lama akan ditimpa'; return; }
        this.start(false);
      };
      cont.onclick = () => this.start(true);
      t.classList.add('ready');
      document.getElementById('loading').classList.add('hidden');
      document.querySelectorAll('[data-icon]').forEach((im) => { im.src = G.iconURL(im.getAttribute('data-icon')); });
    },
    start(cont) {
      PV.Audio.init();
      PV.Audio.sfx('select');
      if (cont && PV.State.load()) { /* dimuat */ } else { PV.State.reset(); PV.State.wipe(); }
      PV.Quests.begin && !cont && PV.Quests.begin();
      this.buildWorlds();
      const p = PV.S.pos;
      const wid = this.worlds[p.map] ? p.map : 'desa';
      this.started = true;
      this.setWorld(wid, p.x, p.y, p.dir);
      if (PV.S.flags.festivalDone) this.festivalUntil = 0;
      document.getElementById('title').classList.add('hidden');
      document.getElementById('hud').classList.remove('hidden');
      PV.UI.refresh();
      PV.Audio.playMusic(this.world.music);
      PV.Quests.ensureDaily();
      if (!cont) {
        PV.State.log('Tiba di Lembah Piksel');
        setTimeout(() => PV.UI.dialog({ name: 'Lembah Piksel', icon: 'lentera' }, [
          'Kamu baru saja pindah ke rumah peninggalan kakek di Lembah Piksel.',
          'Gerak: WASD / panah · Interaksi: E atau Spasi · Tas: I · Misi: Q · Peta: M',
          'Pertama, temui Pak Kades di alun-alun (ikuti jalan ke utara lalu timur).',
        ]), 500);
      } else PV.UI.toast(`Selamat datang kembali! Hari ${PV.S.day}`, 'hati');
    },

    // ---------- update ----------
    update(dt) {
      this.time += dt;
      const UI = PV.UI;
      if (this.fading) {
        const f = this.fading;
        f.t += dt;
        if (f.t >= 0.25 && !f.called) { f.called = true; f.cb && f.cb(); }
        if (f.t >= 0.5) this.fading = null;
      }
      if (this.started) {
        PV.S.playTime += dt;
        PV.Act.updateFarm(dt);
        if (UI.dlg) UI.dialogUpdate(dt);
        else if (this.activeMini) this.activeMini.update(dt);
        else if (!UI.modalOpen && !this.fading) {
          this.player.update(dt);
          this.updateInteract(dt);
          for (const tr of this.world.triggers) {
            const p = this.player;
            if (p.x >= tr.x0 && p.x < tr.x1 && p.y >= tr.y0 && p.y < tr.y1) { tr.action(); break; }
          }
        } else this.player.moving = false;
        if (this.modalBookKeys()) { /* ditangani */ }
        // autosave
        this.saveT += dt;
        if (this.saveT > 30) { this.saveT = 0; PV.State.save(true); }
        // nama area
